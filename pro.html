<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Key Generator v5.0</title>

<!-- 🔥 ZIP СРАЗУ -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- CSS будет дальше -->
<style>

/* =========================
   🎨 VARIABLES
========================= */

:root{
--bg:#0b0f1a;
--card:#111827;

--text:#ffffff;
--sub:#9ca3af;

--primary:#4f7cff;
--primary2:#6f9cff;

--danger:#ff4d4d;

--input:rgba(255,255,255,0.06);
--border:rgba(255,255,255,0.08);
}

/* LIGHT (исправленный — читаемый) */
body.light{
--bg:#f3f4f6;
--card:#ffffff;

--text:#111;
--sub:#555;

--input:#e9edf3;
--border:#dcdcdc;
}

/* NEON (не выжигает глаза) */
body.neon{
--bg:#04070f;
--card:rgba(0,255,200,0.05);

--text:#00ffe0;
--sub:#00c8aa;

--primary:#00ffd0;
--primary2:#00aaff;

--border:rgba(0,255,200,0.2);
}

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
color:var(--text);
padding:14px;
transition:0.25s;
}

/* =========================
   LAYOUT
========================= */

.app{
max-width:520px;
margin:auto;
}

.header h1{
font-size:22px;
margin-bottom:4px;
}

.subtitle{
font-size:13px;
color:var(--sub);
margin-bottom:14px;
}

/* =========================
   CARD
========================= */

.card{
background:var(--card);
border-radius:18px;
padding:16px;
border:1px solid var(--border);
}

/* =========================
   SEGMENTED
========================= */

.segmented{
display:flex;
gap:6px;
margin-bottom:12px;
}

.segmented button{
flex:1;
padding:11px;
border-radius:10px;
border:none;
background:var(--input);
color:var(--text);
font-size:14px;
font-weight:500;
}

.segmented button.active{
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:#fff;
}

/* =========================
   INPUTS
========================= */

.field{
margin-bottom:12px;
}

label{
font-size:13px;
color:var(--sub);
margin-bottom:5px;
display:block;
}

.input{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:var(--input);
color:var(--text);
font-size:16px;
outline:none;
}

/* =========================
   OPTIONS
========================= */

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:12px;
}

.options label{
font-size:13px;
display:flex;
align-items:center;
gap:6px;
}

/* =========================
   BUTTONS
========================= */

.btn{
width:100%;
padding:14px;
border-radius:14px;
border:none;
font-size:15px;
font-weight:600;
margin-top:8px;
cursor:pointer;
}

.btn.primary{
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:#fff;
}

.btn.secondary{
background:var(--input);
color:var(--text);
}

.btn.danger{
background:linear-gradient(135deg,#ff4d4d,#ff6b6b);
color:#fff;
}

.btn.big{
padding:16px;
font-size:16px;
}

/* =========================
   STATUS
========================= */

.status{
text-align:center;
font-size:13px;
margin-top:10px;
color:var(--sub);
}

/* =========================
   PREVIEW
========================= */

.preview{
margin-top:10px;
padding:10px;
background:rgba(0,0,0,0.35);
border-radius:10px;
max-height:180px;
overflow:auto;
font-size:12px;
white-space:pre-wrap;
}

/* =========================
   HIDDEN
========================= */

.hidden{
display:none;
}

/* =========================
   SCROLL
========================= */

.preview::-webkit-scrollbar{
width:5px;
}
.preview::-webkit-scrollbar-thumb{
background:rgba(255,255,255,0.2);
border-radius:10px;
}

/* =========================
   INTERACTIONS
========================= */

button{
transition:0.15s;
}

button:active{
transform:scale(0.96);
}

/* =========================
   MOBILE
========================= */

input{
font-size:16px;
}

@media (max-width:480px){

.header h1{
font-size:20px;
}

.btn{
padding:15px;
}

}

/* =========================
   NEON EXTRA
========================= */

body.neon .btn.primary{
box-shadow:0 0 10px rgba(0,255,200,0.4);
}

</style>
</head>

<body class="dark">

<div class="app">

<header class="header">
<h1 data-i="title"></h1>
<div class="subtitle" data-i="subtitle"></div>
</header>

<div class="top-bar">

<div class="segmented" id="langSwitch">
<button data-lang="ru" class="active">RU</button>
<button data-lang="en">EN</button>
</div>

<div class="segmented" id="themeSwitch">
<button data-theme="dark" class="active">Dark</button>
<button data-theme="neon">Neon</button>
<button data-theme="light">Light</button>
</div>

</div>

<div class="card">

<div class="field">
<label data-i="prefix"></label>
<input id="prefix" class="input" placeholder="api_">
</div>

<div class="field">
<label data-i="keyType"></label>
<select id="keyType" class="input">
<option value="" data-i="noType"></option>
<option value="api">API</option>
<option value="sk">Secret</option>
<option value="pk">Public</option>
</select>
</div>

<div class="field">
<label data-i="env"></label>
<select id="env" class="input">
<option value="" data-i="noEnv"></option>
<option value="live">Live</option>
<option value="test">Test</option>
</select>
</div>

<div class="segmented">
<button id="modeBits" class="active" data-i="bits"></button>
<button id="modeLength" data-i="length"></button>
</div>

<div class="field" id="bitsBlock">
<select id="bits" class="input">
<option>64</option>
<option>128</option>
<option selected>256</option>
<option>512</option>
<option>1024</option>
<option>2048</option>
</select>
</div>

<div class="field hidden" id="lengthBlock">
<input id="length" class="input" value="32">
</div>

<div class="field">
<label data-i="count"></label>
<input id="count" class="input" value="1000">
</div>

<div class="field">
<label data-i="format"></label>
<select id="format" class="input">
<option value="txt">TXT</option>
<option value="csv">CSV</option>
<option value="json">JSON</option>
<option value="zip">ZIP</option>
</select>
</div>

<div class="options">
<label><input type="checkbox" id="letters" checked> <span data-i="letters"></span></label>
<label><input type="checkbox" id="digits" checked> <span data-i="digits"></span></label>
<label><input type="checkbox" id="symbols"> <span data-i="symbols"></span></label>
<label><input type="checkbox" id="exclude"> <span data-i="exclude"></span></label>
<label><input type="checkbox" id="dash"> <span data-i="dash"></span></label>
</div>

<div class="field">
<input id="customCharset" class="input">
</div>

<div class="segmented">
<button id="cryptoMode" class="active" data-i="crypto"></button>
<button id="fastMode" data-i="fast"></button>
</div>

<div class="actions">
<button id="previewBtn" class="btn primary"></button>
<button id="copyBtn" class="btn secondary"></button>
<button id="generateBtn" class="btn primary big"></button>
<button id="stopBtn" class="btn danger"></button>
</div>

<div class="status" id="status"></div>
<div class="preview" id="preview"></div>

</div>
</div>


<!-- JS -->
<script>

/* =========================
   🧠 STATE (ЕДИНЫЙ)
========================= */

const state = {
lang: "ru",
theme: "dark",
mode: "crypto", // crypto | fast
lengthMode: "bits", // bits | length
stop: false
};

/* =========================
   🔗 ELEMENTS
========================= */

const el = {
previewBtn: document.getElementById("previewBtn"),
copyBtn: document.getElementById("copyBtn"),
generateBtn: document.getElementById("generateBtn"),
stopBtn: document.getElementById("stopBtn"),

preview: document.getElementById("preview"),
status: document.getElementById("status"),

bits: document.getElementById("bits"),
length: document.getElementById("length"),
count: document.getElementById("count"),

letters: document.getElementById("letters"),
digits: document.getElementById("digits"),
symbols: document.getElementById("symbols"),
exclude: document.getElementById("exclude"),
dash: document.getElementById("dash"),

prefix: document.getElementById("prefix"),
type: document.getElementById("keyType"),
env: document.getElementById("env"),
custom: document.getElementById("customCharset"),

format: document.getElementById("format"),

langSwitch: document.getElementById("langSwitch"),
themeSwitch: document.getElementById("themeSwitch"),

cryptoBtn: document.getElementById("cryptoMode"),
fastBtn: document.getElementById("fastMode"),

modeBits: document.getElementById("modeBits"),
modeLength: document.getElementById("modeLength"),

bitsBlock: document.getElementById("bitsBlock"),
lengthBlock: document.getElementById("lengthBlock")
};

/* =========================
   🌍 I18N
========================= */

const i18n = {
ru:{
title:"Генератор API ключей",
subtitle:"Профессиональная генерация ключей",

preview:"Предпросмотр",
copy:"Скопировать",
generate:"Сгенерировать",
stop:"СТОП",

bits:"Биты",
length:"Длина",
count:"Количество",
format:"Формат",

prefix:"Префикс",
keyType:"Тип ключа",
env:"Окружение",
noType:"Без типа",
noEnv:"Без окружения",

letters:"Буквы",
digits:"Цифры",
symbols:"Символы",
exclude:"Без похожих",
dash:"Разделять -",

crypto:"Безопасный",
fast:"Быстрый",

empty:"Нет данных"
},

en:{
title:"API Key Generator",
subtitle:"Professional key generation",

preview:"Preview",
copy:"Copy",
generate:"Generate",
stop:"STOP",

bits:"Bits",
length:"Length",
count:"Count",
format:"Format",

prefix:"Prefix",
keyType:"Key type",
env:"Environment",
noType:"No type",
noEnv:"No env",

letters:"Letters",
digits:"Digits",
symbols:"Symbols",
exclude:"Exclude similar",
dash:"Use dashes",

crypto:"Secure",
fast:"Fast",

empty:"No data"
}
};

/* =========================
   🔄 APPLY LANG
========================= */

function applyLang(){

const t = i18n[state.lang];

document.querySelectorAll("[data-i]").forEach(elm=>{
const key = elm.dataset.i;
if(t[key]) elm.innerText = t[key];
});

}

/* =========================
   🌗 THEME
========================= */

function applyTheme(){
document.body.className = state.theme;
}

/* =========================
   🔘 SWITCHES
========================= */

// язык
el.langSwitch.addEventListener("click", e=>{
if(e.target.tagName !== "BUTTON") return;

state.lang = e.target.dataset.lang;

el.langSwitch.querySelectorAll("button")
.forEach(b=>b.classList.remove("active"));

e.target.classList.add("active");

applyLang();
});

// тема
el.themeSwitch.addEventListener("click", e=>{
if(e.target.tagName !== "BUTTON") return;

state.theme = e.target.dataset.theme;

el.themeSwitch.querySelectorAll("button")
.forEach(b=>b.classList.remove("active"));

e.target.classList.add("active");

applyTheme();
});

/* =========================
   🔢 LENGTH MODE
========================= */

el.modeBits.onclick = ()=>{
state.lengthMode = "bits";
el.bitsBlock.classList.remove("hidden");
el.lengthBlock.classList.add("hidden");
};

el.modeLength.onclick = ()=>{
state.lengthMode = "length";
el.bitsBlock.classList.add("hidden");
el.lengthBlock.classList.remove("hidden");
};

/* =========================
   ⚡ MODE
========================= */

el.cryptoBtn.onclick = ()=>{
state.mode = "crypto";
el.cryptoBtn.classList.add("active");
el.fastBtn.classList.remove("active");
};

el.fastBtn.onclick = ()=>{
state.mode = "fast";
el.fastBtn.classList.add("active");
el.cryptoBtn.classList.remove("active");
};

/* =========================
   🔧 HELPERS
========================= */

function getLength(){
return state.lengthMode === "bits"
? Math.floor(parseInt(el.bits.value) / 6)
: parseInt(el.length.value || 32);
}

function getCharset(){

if(el.custom.value) return el.custom.value;

let c = "";

if(el.letters.checked) c += "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
if(el.digits.checked) c += "0123456789";
if(el.symbols.checked) c += "!@#$%^&*";

if(el.exclude.checked){
c = c.replace(/[0Ool1I]/g,"");
}

if(!c){
c = "abcdefghijklmnopqrstuvwxyz0123456789";
}

return c;
}

/* =========================
   🔐 RANDOM (ЕДИНЫЙ)
========================= */

function secureRandom(max){
const arr = new Uint32Array(1);
const limit = Math.floor(4294967296/max)*max;

while(true){
crypto.getRandomValues(arr);
if(arr[0] < limit) return arr[0] % max;
}
}

function rand(max){
return state.mode === "crypto"
? secureRandom(max)
: Math.floor(Math.random()*max);
}

/* =========================
   🔑 GENERATE KEY (ОДИН РАЗ)
========================= */

function generateKey(len, charset){

let res = "";

for(let i=0;i<len;i++){
res += charset[rand(charset.length)];
}

if(el.dash.checked){
res = res.match(/.{1,4}/g).join("-");
}

let prefix = el.prefix.value || "";
let type = el.type.value ? el.type.value + "_" : "";
let env = el.env.value ? el.env.value + "_" : "";

return prefix + type + env + res;
}

/* =========================
   👀 PREVIEW (1:1)
========================= */

el.previewBtn.onclick = ()=>{

let len = getLength();
let cs = getCharset();

let out = [];

for(let i=0;i<80;i++){
out.push(generateKey(len, cs));
}

el.preview.innerText = out.join("\n");
};

/* =========================
   📋 COPY
========================= */

el.copyBtn.onclick = ()=>{

if(!el.preview.innerText){
alert(i18n[state.lang].empty);
return;
}

navigator.clipboard.writeText(el.preview.innerText);
};

/* INIT */

applyLang();
applyTheme();

/* =========================
   ⚡ WORKER (ИДЕНТИЧНАЯ ЛОГИКА)
========================= */

function createWorker(){

const code = `
self.onmessage = function(e){

const { length, charset, size, dash, prefix, type, env, mode } = e.data;

function secureRandom(max){
const arr=new Uint32Array(1);
const limit=Math.floor(4294967296/max)*max;
while(true){
crypto.getRandomValues(arr);
if(arr[0]<limit)return arr[0]%max;
}
}

function rand(max){
return mode === "crypto"
? secureRandom(max)
: Math.floor(Math.random()*max);
}

let out=[];

for(let i=0;i<size;i++){

let r="";

for(let j=0;j<length;j++){
r+=charset[rand(charset.length)];
}

if(dash){
r=r.match(/.{1,4}/g).join("-");
}

let full = (prefix||"") +
(type?type+"_":"") +
(env?env+"_":"") +
r;

out.push(full);
}

postMessage(out);
}
`;

return new Worker(URL.createObjectURL(
new Blob([code], {type:"application/javascript"})
));
}

/* =========================
   📄 FORMATTER
========================= */

function formatOutput(lines, format){

if(format === "json"){
return JSON.stringify(lines, null, 2);
}

if(format === "csv"){
return lines.join(",");
}

return lines.join("\n");
}

/* =========================
   📦 ZIP (REAL)
========================= */

async function makeZip(text, filename){

const zip = new JSZip();
zip.file(filename, text);

return await zip.generateAsync({
type:"blob",
compression:"DEFLATE",
compressionOptions:{level:6}
});

}

/* =========================
   🚀 GENERATE FILE
========================= */

el.generateBtn.onclick = async ()=>{

state.stop = false;

let count = parseInt(el.count.value);
let len = getLength();
let charset = getCharset();
let format = el.format.value;

if(!count || count <= 0){
el.status.innerText = "Invalid";
return;
}

el.generateBtn.disabled = true;
el.generateBtn.innerText = "...";

let worker = createWorker();

let produced = 0;
let chunkSize = 2000;

let lines = [];
let start = performance.now();

worker.onmessage = async (e)=>{

if(state.stop){
worker.terminate();
el.status.innerText = "Stopped";
el.generateBtn.disabled = false;
applyLang();
return;
}

let chunk = e.data;

/* 🔥 НЕ превышаем count */
if(produced + chunk.length > count){
chunk = chunk.slice(0, count - produced);
}

lines.push(...chunk);
produced += chunk.length;

/* 📊 статус */
let elapsed = (performance.now() - start)/1000;
let speed = Math.floor(produced / elapsed);

el.status.innerText = produced + "/" + count + " • " + speed + "/s";

/* ✅ завершение */
if(produced >= count){

let text = formatOutput(lines, format);

let filename = "keys_" + count + "." + (format === "zip" ? "txt" : format);

/* ZIP */
if(format === "zip"){

let blob = await makeZip(text, filename);

let url = URL.createObjectURL(blob);
let a = document.createElement("a");

a.href = url;
a.download = "keys_" + count + ".zip";

a.click();
URL.revokeObjectURL(url);

}else{

let blob = new Blob([text],{type:"text/plain"});
let url = URL.createObjectURL(blob);

let a = document.createElement("a");
a.href = url;
a.download = filename;

a.click();
URL.revokeObjectURL(url);

}

worker.terminate();

el.status.innerText = "Done";
el.generateBtn.disabled = false;
applyLang();

return;
}

/* 🔁 следующий chunk */
worker.postMessage({
length: len,
charset: charset,
size: chunkSize,
dash: el.dash.checked,
prefix: el.prefix.value,
type: el.type.value,
env: el.env.value,
mode: state.mode
});

};

/* ▶️ старт */
worker.postMessage({
length: len,
charset: charset,
size: chunkSize,
dash: el.dash.checked,
prefix: el.prefix.value,
type: el.type.value,
env: el.env.value,
mode: state.mode
});

};

/* =========================
   ⛔ STOP
========================= */

el.stopBtn.onclick = ()=>{
state.stop = true;
};
/* =========================
   🌍 ДОПЕРЕВОД
========================= */

i18n.ru.done = "Готово";
i18n.ru.stopped = "Остановлено";
i18n.ru.invalid = "Неверное значение";
i18n.ru.fastWarn = "Math.random НЕ безопасен. Используй только для тестов.";
i18n.ru.largeTitle = "Большой объём";
i18n.ru.largeDesc = "Будет создан большой файл. Это может занять время.";

i18n.en.done = "Done";
i18n.en.stopped = "Stopped";
i18n.en.invalid = "Invalid value";
i18n.en.fastWarn = "Math.random is NOT secure. Use only for testing.";
i18n.en.largeTitle = "Large generation";
i18n.en.largeDesc = "A large file will be generated. It may take time.";

/* =========================
   🔔 NOTIFY
========================= */

function notify(text){

const n = document.createElement("div");

n.innerText = text;

n.style = `
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:12px 18px;
border-radius:12px;
font-size:13px;
z-index:9999;
`;

document.body.appendChild(n);

setTimeout(()=>n.remove(),2000);

}

/* =========================
   🧠 MODAL
========================= */

function showModal(title, text){

return new Promise(resolve=>{

const m = document.createElement("div");

m.innerHTML = `
<div style="
position:fixed;inset:0;
background:rgba(0,0,0,0.7);
display:flex;align-items:center;justify-content:center;
z-index:9999;">
<div style="
background:#111;
padding:20px;
border-radius:16px;
max-width:320px;
text-align:center;">
<h2 style="color:red;font-weight:700;">${title}</h2>
<p style="font-size:13px;margin:10px 0;">${text}</p>
<button id="okModal" class="btn primary">OK</button>
</div>
</div>
`;

document.body.appendChild(m);

document.getElementById("okModal").onclick = ()=>{
m.remove();
resolve(true);
};

});

}

/* =========================
   ⚠️ FAST WARNING (1 РАЗ)
========================= */

let fastWarned = localStorage.getItem("fastWarned");

el.fastBtn.addEventListener("click", async ()=>{

if(fastWarned) return;

await showModal(
"ВАЖНО!!!",
i18n[state.lang].fastWarn
);

localStorage.setItem("fastWarned","1");

});

/* =========================
   ⚠️ LARGE GENERATION
========================= */

async function checkLarge(count){

if(count < 250000) return true;

return await showModal(
i18n[state.lang].largeTitle,
i18n[state.lang].largeDesc
);

}

/* =========================
   🔁 PATCH GENERATE (АККУРАТНО)
========================= */

const originalGenerate = el.generateBtn.onclick;

el.generateBtn.onclick = async ()=>{

let count = parseInt(el.count.value);

if(!count || count <= 0){
notify(i18n[state.lang].invalid);
return;
}

/* 🔥 предупреждение */
let ok = await checkLarge(count);
if(!ok) return;

await originalGenerate();

};

/* =========================
   💾 SAVE SETTINGS
========================= */

function saveSettings(){

const s = {
bits: el.bits.value,
length: el.length.value,
count: el.count.value,

prefix: el.prefix.value,
type: el.type.value,
env: el.env.value,

letters: el.letters.checked,
digits: el.digits.checked,
symbols: el.symbols.checked,
exclude: el.exclude.checked,
dash: el.dash.checked,

format: el.format.value,
custom: el.custom.value,

lang: state.lang,
theme: state.theme,
mode: state.mode,
lengthMode: state.lengthMode
};

localStorage.setItem("v50_settings", JSON.stringify(s));
}

function loadSettings(){

let raw = localStorage.getItem("v50_settings");
if(!raw) return;

let s = JSON.parse(raw);

el.bits.value = s.bits || 256;
el.length.value = s.length || 32;
el.count.value = s.count || 1000;

el.prefix.value = s.prefix || "";
el.type.value = s.type || "";
el.env.value = s.env || "";

el.letters.checked = s.letters;
el.digits.checked = s.digits;
el.symbols.checked = s.symbols;
el.exclude.checked = s.exclude;
el.dash.checked = s.dash;

el.format.value = s.format || "txt";
el.custom.value = s.custom || "";

state.lang = s.lang || "ru";
state.theme = s.theme || "dark";
state.mode = s.mode || "crypto";
state.lengthMode = s.lengthMode || "bits";

/* восстановление UI */
applyLang();
applyTheme();

if(state.lengthMode === "length"){
el.modeLength.click();
}else{
el.modeBits.click();
}

if(state.mode === "fast"){
el.fastBtn.click();
}else{
el.cryptoBtn.click();
}

}

/* авто сохранение */
document.querySelectorAll("input,select").forEach(e=>{
e.addEventListener("change", saveSettings);
});

loadSettings();

/* =========================
   📋 COPY FIX
========================= */

el.copyBtn.onclick = ()=>{

if(!el.preview.innerText){
notify(i18n[state.lang].empty);
return;
}

navigator.clipboard.writeText(el.preview.innerText);
notify("✔");

};

/* =========================
   📊 SIZE ESTIMATE
========================= */

function updateEstimate(){

let count = parseInt(el.count.value) || 0;
let len = getLength();

if(!count) return;

let size = ((count * (len + 1)) / (1024*1024)).toFixed(1);

el.status.innerText = "~ " + size + " MB";
}

el.count.addEventListener("input", updateEstimate);
el.bits.addEventListener("change", updateEstimate);
el.length.addEventListener("input", updateEstimate);

/* =========================
   📱 MOBILE FIX
========================= */

document.body.style.paddingBottom = "40px";

/* =========================
   ✨ EMPTY
========================= */

if(!el.preview.innerText){
el.preview.innerText = "—";
}
</script>
</body>
</html>
