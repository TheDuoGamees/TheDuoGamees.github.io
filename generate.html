<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Generator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.08);
}

h1 {
    font-size: 22px;
    margin-bottom: 10px;
}

p {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 20px;
}

.label {
    font-size: 13px;
    margin-bottom: 6px;
    display: block;
}

.input {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 16px;
    margin-bottom: 15px;
}

.input:focus {
    outline: 1px solid #4f7cff;
}

.button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #4f7cff, #6f9cff);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.button:hover {
    opacity: 0.9;
}

.button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.status {
    margin-top: 15px;
    font-size: 13px;
    color: #ccc;
    text-align: center;
}

.footer {
    text-align: center;
    font-size: 11px;
    margin-top: 15px;
    color: #666;
}

</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>String Generator</h1>
        <p>Генерация случайных строк в .txt файл</p>

        <label class="label">Количество строк</label>
        <input class="input" id="count" type="number" value="10000">

        <label class="label">Длина строки</label>
        <input class="input" id="length" type="number" value="12">

        <button class="button" id="btn" onclick="generate()">Сгенерировать и скачать</button>

        <div class="status" id="status"></div>
    </div>

    <div class="footer">
        Работает прямо в браузере
    </div>
</div>

<script>
function generateRandomString(length) {
    const lowercase = "abcdefghijklmnopqrstuvwxyz";
    const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const digits = "0123456789_";
    const base = lowercase + digits;
    const all = lowercase + uppercase + digits;

    let result = [];

    if (Math.random() < 0.4) {
        for (let i = 0; i < length; i++) {
            result.push(base[Math.floor(Math.random() * base.length)]);
        }
        let pos = Math.floor(Math.random() * length);
        result[pos] = uppercase[Math.floor(Math.random() * uppercase.length)];
    } else {
        for (let i = 0; i < length; i++) {
            result.push(all[Math.floor(Math.random() * all.length)]);
        }
    }

    return result.join("");
}

function download(text) {
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "strings.txt";
    a.click();

    URL.revokeObjectURL(url);
}

async function generate() {
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");

    let count = parseInt(document.getElementById("count").value);
    let length = parseInt(document.getElementById("length").value);

    // защита от убийства браузера
    

    btn.disabled = true;
    status.innerText = "Генерация...";

    await new Promise(r => setTimeout(r, 50));

    let result = [];

    for (let i = 0; i < count; i++) {
        result.push(generateRandomString(length) + i.toString(16));

        // обновляем статус каждые 10k
        if (i % 10000 === 0) {
            status.innerText = "Сгенерировано: " + i;
            await new Promise(r => setTimeout(r, 0));
        }
    }

    download(result.join("\n"));

    status.innerText = "Готово ✅";
    btn.disabled = false;
}
</script>

</body>
</html>
