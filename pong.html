<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pong для двоих на телефоне</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0c0f1c 0%, #1a1f30 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 8px;
        }
        
        .game-container {
            background: #111a22;
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.7), inset 0 0 30px #2ff3;
            border: 1px solid #3ff3;
            width: 100%;
            max-width: 450px;
        }
        
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            color: #7ff;
            font-size: clamp(32px, 10vw, 48px);
            font-weight: 800;
            text-shadow: 0 0 25px cyan;
            background: #0e1622;
            border-radius: 60px;
            margin-bottom: 15px;
            border: 1px solid #3ff5;
            letter-spacing: 4px;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 3/4;
            background: #0b1018;
            border-radius: 24px;
            box-shadow: 0 0 30px #0ff3, inset 0 0 20px #000;
            border: 2px solid #3ff5;
            touch-action: none;
        }
        
        .controls-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 20px;
        }
        
        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .player-label {
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
            letter-spacing: 2px;
        }
        
        .left-label {
            color: #6cf;
        }
        
        .right-label {
            color: #f6c;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .touch-btn {
            background: #1e2a3a;
            border: 3px solid;
            border-radius: 60px;
            padding: 18px 0;
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 15px currentColor;
            box-shadow: 0 8px 0 #0a0f18, 0 12px 25px black;
            transition: all 0.05s ease;
            touch-action: manipulation;
            cursor: pointer;
            width: 100%;
            line-height: 1;
            text-align: center;
        }
        
        .touch-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0a0f18, 0 8px 20px black;
        }
        
        .btn-left {
            border-color: #3cf;
            background: #1a3a55;
        }
        
        .btn-right {
            border-color: #f5a;
            background: #551a3a;
        }
        
        .restart-area {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        
        .restart-btn {
            background: #2a3f5a;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 24px;
            padding: 14px 35px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 0 #0e1a2a, 0 10px 30px black;
            border: 2px solid #8cf;
            transition: 0.05s ease;
            width: fit-content;
            touch-action: manipulation;
        }
        
        .restart-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0e1a2a, 0 5px 20px black;
        }
        
        .hint {
            text-align: center;
            color: #89b;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Счет -->
        <div class="score-board">
            <span id="scoreLeft">0</span>
            <span style="color: #48b; font-size: 30px;">⚡</span>
            <span id="scoreRight">0</span>
        </div>

        <!-- Игровое поле (адаптивное) -->
        <canvas id="gameCanvas" width="600" height="800"></canvas>

        <!-- Сенсорное управление для двоих -->
        <div class="controls-container">
            <!-- Левый игрок (синий) -->
            <div class="control-panel">
                <div class="player-label left-label">👈 ЛЕВЫЙ</div>
                <div class="btn-group">
                    <button class="touch-btn btn-left" id="leftUpBtn" aria-label="Вверх">▲ ВВЕРХ</button>
                    <button class="touch-btn btn-left" id="leftDownBtn" aria-label="Вниз">▼ ВНИЗ</button>
                </div>
            </div>

            <!-- Правый игрок (розовый) -->
            <div class="control-panel">
                <div class="player-label right-label">ПРАВЫЙ 👉</div>
                <div class="btn-group">
                    <button class="touch-btn btn-right" id="rightUpBtn" aria-label="Вверх">▲ ВВЕРХ</button>
                    <button class="touch-btn btn-right" id="rightDownBtn" aria-label="Вниз">▼ ВНИЗ</button>
                </div>
            </div>
        </div>

        <!-- Кнопка рестарта -->
        <div class="restart-area">
            <button class="restart-btn" id="restartButton">🔄 НАЧАТЬ ЗАНОВО</button>
        </div>
        <div class="hint">👆 Жми и держи кнопки — ракетка движется</div>
    </div>

    <script>
        (function() {
            // ----- Настройки игры -----
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // Размеры (логические, подстраиваются под canvas)
            let canvasWidth = 600;
            let canvasHeight = 800;
            
            // Игровые объекты
            const paddleWidth = 18;
            const paddleHeight = 130;
            const ballSize = 20;

            let leftPaddleY = canvasHeight / 2 - paddleHeight / 2;
            let rightPaddleY = canvasHeight / 2 - paddleHeight / 2;
            let ballX = canvasWidth / 2 - ballSize/2;
            let ballY = canvasHeight / 2 - ballSize/2;
            let ballSpeedX = 7;
            let ballSpeedY = 5;

            let leftScore = 0;
            let rightScore = 0;

            // Состояния кнопок (сенсорных)
            let leftUpPressed = false;
            let leftDownPressed = false;
            let rightUpPressed = false;
            let rightDownPressed = false;

            const paddleSpeed = 10;

            // ----- Привязка кнопок -----
            const leftUpBtn = document.getElementById('leftUpBtn');
            const leftDownBtn = document.getElementById('leftDownBtn');
            const rightUpBtn = document.getElementById('rightUpBtn');
            const rightDownBtn = document.getElementById('rightDownBtn');

            // Функции для обработки нажатий/отпускания
            function setLeftUp(state) { leftUpPressed = state; }
            function setLeftDown(state) { leftDownPressed = state; }
            function setRightUp(state) { rightUpPressed = state; }
            function setRightDown(state) { rightDownPressed = state; }

            // События для мыши + тачскрина
            function addButtonListeners(btn, downCallback, upCallback) {
                // Мышь
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); downCallback(true); });
                btn.addEventListener('mouseup', () => { upCallback(false); });
                btn.addEventListener('mouseleave', () => { upCallback(false); });
                
                // Тач
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); downCallback(true); });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); upCallback(false); });
                btn.addEventListener('touchcancel', (e) => { e.preventDefault(); upCallback(false); });
            }

            addButtonListeners(leftUpBtn, setLeftUp, setLeftUp);
            addButtonListeners(leftDownBtn, setLeftDown, setLeftDown);
            addButtonListeners(rightUpBtn, setRightUp, setRightUp);
            addButtonListeners(rightDownBtn, setRightDown, setRightDown);

            // ----- Функции счета -----
            function updateScoreDisplay() {
                document.getElementById('scoreLeft').innerText = leftScore;
                document.getElementById('scoreRight').innerText = rightScore;
            }

            function resetBall() {
                ballX = canvasWidth / 2 - ballSize/2;
                ballY = canvasHeight / 2 - ballSize/2;
                ballSpeedX = (Math.random() > 0.5 ? 7 : -7);
                ballSpeedY = (Math.random() > 0.5 ? 5 : -5);
            }

            function restartGame() {
                leftScore = 0;
                rightScore = 0;
                leftPaddleY = canvasHeight / 2 - paddleHeight / 2;
                rightPaddleY = canvasHeight / 2 - paddleHeight / 2;
                resetBall();
                updateScoreDisplay();
            }

            document.getElementById('restartButton').addEventListener('click', restartGame);
            document.getElementById('restartButton').addEventListener('touchstart', (e) => {
                e.preventDefault();
                restartGame();
            });

            // ----- Игровая логика -----
            function updateGame() {
                // Движение ракеток
                if (leftUpPressed && leftPaddleY > 0) leftPaddleY -= paddleSpeed;
                if (leftDownPressed && leftPaddleY < canvasHeight - paddleHeight) leftPaddleY += paddleSpeed;
                
                if (rightUpPressed && rightPaddleY > 0) rightPaddleY -= paddleSpeed;
                if (rightDownPressed && rightPaddleY < canvasHeight - paddleHeight) rightPaddleY += paddleSpeed;

                // Движение мяча
                ballX += ballSpeedX;
                ballY += ballSpeedY;

                // Столкновение с верхом/низом
                if (ballY <= 0 || ballY >= canvasHeight - ballSize) {
                    ballSpeedY = -ballSpeedY;
                }

                // Левая ракетка (столкновение)
                if (ballX <= paddleWidth + 10 && 
                    ballY + ballSize >= leftPaddleY && 
                    ballY <= leftPaddleY + paddleHeight) {
                    
                    ballSpeedX = -ballSpeedX;
                    ballX = paddleWidth + 12; // немножко отодвигаем
                    
                    let centerPaddle = leftPaddleY + paddleHeight/2;
                    let centerBall = ballY + ballSize/2;
                    let deltaY = centerBall - centerPaddle;
                    ballSpeedY = deltaY * 0.3;
                }

                // Правая ракетка
                if (ballX >= canvasWidth - paddleWidth - ballSize - 10 && 
                    ballY + ballSize >= rightPaddleY && 
                    ballY <= rightPaddleY + paddleHeight) {
                    
                    ballSpeedX = -ballSpeedX;
                    ballX = canvasWidth - paddleWidth - ballSize - 18;
                    
                    let centerPaddle = rightPaddleY + paddleHeight/2;
                    let centerBall = ballY + ballSize/2;
                    let deltaY = centerBall - centerPaddle;
                    ballSpeedY = deltaY * 0.3;
                }

                // Голы
                if (ballX < -ballSize) {
                    rightScore++;
                    updateScoreDisplay();
                    resetBall();
                }
                if (ballX > canvasWidth + ballSize) {
                    leftScore++;
                    updateScoreDisplay();
                    resetBall();
                }
            }

            // ----- Рисование -----
            function draw() {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                
                // Фон
                ctx.fillStyle = '#0c1320';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                
                // Пунктирная линия
                ctx.strokeStyle = '#3ff3';
                ctx.lineWidth = 4;
                ctx.setLineDash([20, 30]);
                ctx.beginPath();
                ctx.moveTo(canvasWidth/2, 0);
                ctx.lineTo(canvasWidth/2, canvasHeight);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Левая ракетка
                ctx.shadowColor = '#0ff';
                ctx.shadowBlur = 25;
                ctx.fillStyle = '#2cf';
                ctx.fillRect(10, leftPaddleY, paddleWidth, paddleHeight);
                
                // Правая ракетка
                ctx.shadowColor = '#f3f';
                ctx.shadowBlur = 25;
                ctx.fillStyle = '#f5b';
                ctx.fillRect(canvasWidth - paddleWidth - 10, rightPaddleY, paddleWidth, paddleHeight);
                
                // Мяч
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#fea';
                ctx.beginPath();
                ctx.arc(ballX + ballSize/2, ballY + ballSize/2, ballSize/2, 0, 2*Math.PI);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            }

            // ----- Анимация -----
            function gameLoop() {
                updateGame();
                draw();
                requestAnimationFrame(gameLoop);
            }

            // Старт
            restartGame();
            gameLoop();
        })();
    </script>
</body>
</html>
