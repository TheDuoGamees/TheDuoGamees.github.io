<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Secure Access</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #070b14, #02030a);
    color: white;
    overflow: hidden;
}

/* 🔒 экран */
#loginScreen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    overflow: hidden;
}

/* ✨ частицы (снег) */
.particles {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.particles span {
    position: absolute;
    display: block;
    width: 3px;
    height: 3px;
    background: rgba(79,220,255,0.6);
    border-radius: 50%;
    animation: fall linear infinite;
}

@keyframes fall {
    from {
        transform: translateY(-10vh);
    }
    to {
        transform: translateY(110vh);
    }
}

/* 🧊 карточка */
.login-box {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 340px;
    padding: 25px 20px;
    border-radius: 18px;
    backdrop-filter: blur(20px);
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(79,220,255,0.2);
    box-shadow: 0 0 30px rgba(79,220,255,0.2);
    text-align: center;
}

/* 🧠 заголовок */
.login-box h1 {
    margin-bottom: 15px;
    font-size: 24px;
    color: #4fdcff;
    text-shadow: 0 0 10px rgba(79,220,255,0.6);
}

/* ⌨️ input */
#passInput {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 12px;
    border: 1px solid rgba(79,220,255,0.4);
    background: transparent;
    color: white;
    outline: none;
    text-align: center;
    font-size: 16px;
    box-shadow: 0 0 10px rgba(79,220,255,0.2);
}

/* 🔘 кнопка */
#loginBtn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, #4fdcff, #3a7bff);
    color: black;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 12px rgba(79,220,255,0.6);
}

#loginBtn:active {
    transform: scale(0.97);
}

#loginBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* ❗ ошибка */
#error {
    margin-top: 10px;
    font-size: 14px;
    color: #ff4d6d;
    text-shadow: 0 0 8px rgba(255,77,109,0.6);
}

/* основной контент */
.container {
    display: none;
    padding: 20px;
}
</style>

</head>
<body>

<div id="loginScreen">
    <div class="particles" id="particles"></div>

    <div class="login-box">
        <h1>ACCESS</h1>
        <input id="passInput" placeholder="Введите код">
        <button id="loginBtn" onclick="checkAccess()">Войти</button>
        <p id="error"></p>
    </div>
</div>

<div class="container">
    <h2>Добро пожаловать 🔥</h2>
    <p>Ты прошёл защиту</p>
</div>

<!-- ❗ ТВОЙ JS БЕЗ ИЗМЕНЕНИЙ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyiEWQpFbi9F70u7r7ays4tORQA9oa_Ew",
  authDomain: "phiziks-e0c5c.firebaseapp.com",
  projectId: "phiziks-e0c5c",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 DEVICE
async function getDeviceId() {
    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d");
    ctx.fillText("fingerprint", 10, 10);

    return btoa([
        navigator.userAgent,
        navigator.language,
        screen.width + "x" + screen.height,
        Intl.DateTimeFormat().resolvedOptions().timeZone,
        canvas.toDataURL()
    ].join("|"));
}

// 🌐 IP
let cachedIP = null;
async function getIP() {
    if (cachedIP) return cachedIP;
    try {
        let res = await fetch("https://api64.ipify.org?format=json");
        let data = await res.json();
        cachedIP = data.ip;
        return cachedIP;
    } catch {
        return "unknown";
    }
}

// 🚫 ИНКОГНИТО
async function isIncognito() {
    try {
        localStorage.setItem("t", "1");
        localStorage.removeItem("t");
    } catch {
        return true;
    }

    if (!window.indexedDB) return true;

    return await new Promise(resolve => {
        const db = indexedDB.open("test_incog");
        db.onerror = () => resolve(true);
        db.onsuccess = () => {
            indexedDB.deleteDatabase("test_incog");
            resolve(false);
        };
    });
}

// 📊 ЛОГИ
async function logAttempt(code, success) {
    try {
        await addDoc(collection(db, "logs"), {
            code,
            success,
            time: new Date().toLocaleString()
        });
    } catch {}
}

// 🔘 КНОПКА
function disableBtn() {
    document.getElementById("loginBtn").disabled = true;
}

function enableBtn() {
    document.getElementById("loginBtn").disabled = false;
}

// ⏱ ТАЙМЕР
function startCountdown(end, el) {
    function update() {
        let now = Date.now();

        if (now >= end) {
            el.innerText = "";
            enableBtn();
            return;
        }

        let diff = end - now;
        let m = Math.floor(diff / 60000);
        let s = Math.floor((diff % 60000) / 1000);

        el.innerText = `Блок: ${m}м ${s}с`;
        requestAnimationFrame(update);
    }
    update();
}

// 🔢 АНТИСПАМ
function registerFail() {
    let attempts = parseInt(localStorage.getItem("attempts") || "0") + 1;
    localStorage.setItem("attempts", attempts);

    let blockTime = 0;

    if (attempts >= 3 && attempts < 5) {
        blockTime = 5 * 60 * 1000;
    } else if (attempts >= 5) {
        blockTime = 15 * 60 * 1000;
    }

    if (blockTime > 0) {
        let end = Date.now() + blockTime;
        localStorage.setItem("blockedUntil", end);
        return end;
    }

    return null;
}

// 🚀 ВХОД
async function checkAccess() {
    let input = document.getElementById("passInput").value.trim();
    let error = document.getElementById("error");
    let now = Date.now();

    if (await isIncognito()) {
        error.innerText = "Ошибка доступа";
        return;
    }

    let blockedUntil = parseInt(localStorage.getItem("blockedUntil") || "0");
    if (now < blockedUntil) {
        disableBtn();
        startCountdown(blockedUntil, error);
        return;
    }

    error.innerText = "Подожди...";

    try {
        const ref = doc(db, "keys", input);
        const snap = await getDoc(ref);

        let device = await getDeviceId();
        let ip = await getIP();

        if (!snap.exists()) {
            let end = registerFail();
            await logAttempt(input, false);

            if (end) {
                disableBtn();
                startCountdown(end, error);
            } else {
                error.innerText = "Неверный код";
            }
            return;
        }

        let data = snap.data();

        if (data.device && data.device !== device) {
            error.innerText = "Ключ уже используется";
            return;
        }

        if (data.ip && data.ip !== ip) {
            error.innerText = "Доступ запрещён";
            return;
        }

        if (!data.device) {
            await updateDoc(ref, { device, ip });
        }

        localStorage.setItem("attempts", "0");
        localStorage.removeItem("blockedUntil");

        await logAttempt(input, true);

        document.getElementById("loginScreen").style.display = "none";
        document.querySelector(".container").style.display = "block";

    } catch (e) {
        console.log(e);
        error.innerText = "Ошибка подключения";
    }
}

window.checkAccess = checkAccess;
</script>

<!-- ❗ ДОБАВЛЯЕМ ЧАСТИЦЫ -->
<script>
const particlesContainer = document.getElementById("particles");

for (let i = 0; i < 60; i++) {
    let p = document.createElement("span");
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (5 + Math.random() * 10) + "s";
    p.style.opacity = Math.random();
    p.style.width = p.style.height = (2 + Math.random() * 3) + "px";
    particlesContainer.appendChild(p);
}
</script>

</body>
</html>
