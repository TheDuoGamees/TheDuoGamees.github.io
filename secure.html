<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Secure Access</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #02030a;
    color: white;
    overflow: hidden;
}

/* экран */
#loginScreen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #070b14, #02030a);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* частицы */
.particles {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.particles span {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #4fdcff;
    border-radius: 50%;
    opacity: 0.6;
    animation: fall linear infinite;
}

@keyframes fall {
    from { transform: translateY(-10vh); }
    to { transform: translateY(110vh); }
}

/* карточка */
.login-box {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 320px;
    padding: 20px;
    border-radius: 16px;
    background: rgba(10,15,25,0.9);
    border: 1px solid rgba(79,220,255,0.2);
    box-shadow: 0 0 20px rgba(79,220,255,0.2);
    text-align: center;
}

/* заголовок */
.login-box h1 {
    margin-bottom: 15px;
    font-size: 22px;
    color: #4fdcff;
}

/* input */
#passInput {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid rgba(79,220,255,0.3);
    background: transparent;
    color: white;
    text-align: center;
    font-size: 16px;
}

/* кнопка */
#loginBtn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #4fdcff, #3a7bff);
    color: black;
    font-weight: bold;
    font-size: 16px;
}

#error {
    margin-top: 10px;
    font-size: 14px;
    color: #ff4d6d;
}

/* контент */
.container {
    display: none;
    padding: 20px;
}
</style>
</head>

<body>

<div id="loginScreen">
    <div class="particles" id="particles"></div>

    <div class="login-box">
        <h1>ACCESS</h1>
        <input type="password" id="passInput" placeholder="Введите код">
        <button id="loginBtn" onclick="checkAccess()">Войти</button>
        <p id="error"></p>
    </div>
</div>

<div class="container">
    <h2>Добро пожаловать</h2>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyiEWQpFbi9F70u7r7ays4tORQA9oa_Ew",
  authDomain: "phiziks-e0c5c.firebaseapp.com",
  projectId: "phiziks-e0c5c",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 DEVICE
async function getDeviceId() {
    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d");
    ctx.fillText("fingerprint", 10, 10);

    return btoa([
        navigator.userAgent,
        navigator.language,
        screen.width + "x" + screen.height,
        Intl.DateTimeFormat().resolvedOptions().timeZone,
        canvas.toDataURL()
    ].join("|"));
}

// 🌐 IP
let cachedIP = null;
async function getIP() {
    if (cachedIP) return cachedIP;
    try {
        let res = await fetch("https://api64.ipify.org?format=json");
        let data = await res.json();
        cachedIP = data.ip;
        return cachedIP;
    } catch {
        return "unknown";
    }
}

// 🚫 ИНКОГНИТО
async function isIncognito() {
    try {
        localStorage.setItem("t", "1");
        localStorage.removeItem("t");
    } catch {
        return true;
    }

    if (!window.indexedDB) return true;

    return await new Promise(resolve => {
        const db = indexedDB.open("test_incog");
        db.onerror = () => resolve(true);
        db.onsuccess = () => {
            indexedDB.deleteDatabase("test_incog");
            resolve(false);
        };
    });
}

// 📊 ЛОГИ
async function logAttempt(code, success) {
    try {
        await addDoc(collection(db, "logs"), {
            code,
            success,
            time: new Date().toLocaleString()
        });
    } catch {}
}

// 🔘 КНОПКА
function disableBtn() {
    document.getElementById("loginBtn").disabled = true;
}

function enableBtn() {
    document.getElementById("loginBtn").disabled = false;
}

// ⏱ ТАЙМЕР
function startCountdown(end, el) {
    function update() {
        let now = Date.now();

        if (now >= end) {
            el.innerText = "";
            enableBtn();
            return;
        }

        let diff = end - now;
        let m = Math.floor(diff / 60000);
        let s = Math.floor((diff % 60000) / 1000);

        el.innerText = `Блок: ${m}м ${s}с`;
        requestAnimationFrame(update);
    }
    update();
}

// 🔢 АНТИСПАМ
function registerFail() {
    let attempts = parseInt(localStorage.getItem("attempts") || "0") + 1;
    localStorage.setItem("attempts", attempts);

    let blockTime = 0;

    if (attempts >= 3 && attempts < 5) {
        blockTime = 5 * 60 * 1000;
    } else if (attempts >= 5) {
        blockTime = 15 * 60 * 1000;
    }

    if (blockTime > 0) {
        let end = Date.now() + blockTime;
        localStorage.setItem("blockedUntil", end);
        return end;
    }

    return null;
}

// 🚀 ВХОД
async function checkAccess() {
    let input = document.getElementById("passInput").value.trim();
    let error = document.getElementById("error");
    let now = Date.now();

    // 🚫 инкогнито
    if (await isIncognito()) {
        error.innerText = "Инкогнито запрещено";
        return;
    }

    // ⏱ блок
    let blockedUntil = parseInt(localStorage.getItem("blockedUntil") || "0");
    if (now < blockedUntil) {
        disableBtn();
        startCountdown(blockedUntil, error);
        return;
    }

    error.innerText = "Подожди...";

    try {
        const ref = doc(db, "keys", input);
        const snap = await getDoc(ref);

        let device = await getDeviceId();
        let ip = await getIP();

        // ❌ неверный код
        if (!snap.exists()) {
            let end = registerFail();
            await logAttempt(input, false);

            if (end) {
                disableBtn();
                startCountdown(end, error);
            } else {
                error.innerText = "Неверный код";
            }
            return;
        }

        let data = snap.data();

        // 🔒 DEVICE
        if (data.device && data.device !== device) {
            await logAttempt(input, false);
            error.innerText = "Ключ уже используется";
            return;
        }

        // 🔒 IP
        if (data.ip && data.ip !== ip) {
            await logAttempt(input, false);
            error.innerText = "Доступ с другого интернета запрещён";
            return;
        }

        // ✅ первый вход
        if (!data.device) {
            await updateDoc(ref, { device, ip });
        }

        localStorage.setItem("attempts", "0");
        localStorage.removeItem("blockedUntil");

        await logAttempt(input, true);

        document.getElementById("loginScreen").style.display = "none";
        document.querySelector(".container").style.display = "block";

    } catch (e) {
        console.log(e);
        error.innerText = "Ошибка подключения";
    }
}

window.checkAccess = checkAccess;
</script>
