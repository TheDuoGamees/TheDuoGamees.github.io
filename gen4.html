<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Key Generator v4.1</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#0b0f1a;
color:#fff;
padding:16px;
}

.card{
max-width:520px;
margin:auto;
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:18px;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
}

h1{font-size:20px;margin-bottom:6px}
.sub{font-size:13px;color:#aaa;margin-bottom:16px}

.segment{display:flex;gap:8px;margin-bottom:12px}
.segment button{
flex:1;padding:12px;border-radius:12px;border:none;
background:rgba(255,255,255,0.08);color:white;
font-weight:500
}
.segment .active{
background:linear-gradient(135deg,#4f7cff,#7aa2ff)
}

.input,select{
width:100%;padding:14px;border-radius:14px;border:none;
background:rgba(255,255,255,0.08);color:white;
margin-bottom:12px;font-size:16px
}

.options{
display:grid;grid-template-columns:1fr 1fr;
gap:10px;margin-bottom:12px
}

.options label{font-size:14px}

.button{
width:100%;padding:16px;border-radius:16px;border:none;
font-size:15px;font-weight:600;margin-top:8px;
background:linear-gradient(135deg,#4f7cff,#6f9cff)
}

.stop{
background:linear-gradient(135deg,#ff4d4d,#ff6b6b)
}

.status{text-align:center;font-size:13px;margin-top:10px;color:#aaa}

.preview{
margin-top:10px;padding:10px;background:rgba(0,0,0,0.4);
border-radius:10px;max-height:180px;overflow:auto;font-size:12px
}

input{font-size:16px}
</style>
</head>

<body>

<div class="card">

<h1 id="title"></h1>
<div class="sub" id="sub"></div>

<div class="segment">
<button id="ruBtn" class="active">RU</button>
<button id="enBtn">EN</button>
</div>

<div class="segment">
<button id="bitsBtn" class="active">Bits</button>
<button id="lengthBtn">Length</button>
</div>

<select id="bitsSelect">
<option>64</option><option>128</option>
<option selected>256</option>
<option>512</option><option>1024</option><option>2048</option>
</select>

<input id="lengthInput" class="input" value="32" style="display:none">

<input id="countInput" class="input" value="1000">

<select id="formatSelect">
<option value="txt">TXT</option>
<option value="csv">CSV</option>
<option value="json">JSON</option>
</select>

<div class="options">
<label><input type="checkbox" id="letters" checked> <span data-i="letters"></span></label>
<label><input type="checkbox" id="digits" checked> <span data-i="digits"></span></label>
<label><input type="checkbox" id="symbols"> <span data-i="symbols"></span></label>
<label><input type="checkbox" id="exclude"> <span data-i="exclude"></span></label>
<label><input type="checkbox" id="dash"> <span data-i="dash"></span></label>
<label><input type="checkbox" id="gzip"> GZIP</label>
</div>

<input id="customCharset" class="input">

<div class="segment">
<button id="cryptoBtn" class="active">Crypto</button>
<button id="fastBtn">Fast</button>
</div>

<button id="previewBtn" class="button"></button>
<button id="copyBtn" class="button"></button>
<button id="generateBtn" class="button"></button>
<button id="stopBtn" class="button stop"></button>

<div id="status" class="status"></div>
<div id="preview" class="preview"></div>

</div>

<script>

/* =========================
   STATE
========================= */

let state={
mode:"crypto",
lengthMode:"bits",
lang:"ru",
stop:false
};

/* =========================
   I18N
========================= */

const i18n={
ru:{
title:"Генератор API ключей",
sub:"Инструмент генерации ключей",
preview:"Предпросмотр",
copy:"Скопировать",
generate:"Генерировать",
stop:"СТОП",
letters:"Буквы",
digits:"Цифры",
symbols:"Символы",
exclude:"Исключить похожие",
dash:"Разделять -",
},
en:{
title:"API Key Generator",
sub:"Secure key generator",
preview:"Preview",
copy:"Copy",
generate:"Generate",
stop:"STOP",
letters:"Letters",
digits:"Digits",
symbols:"Symbols",
exclude:"Exclude similar",
dash:"Use dashes",
}
};

function applyLang(){
let t=i18n[state.lang];

title.innerText=t.title;
sub.innerText=t.sub;
previewBtn.innerText=t.preview;
copyBtn.innerText=t.copy;
generateBtn.innerText=t.generate;
stopBtn.innerText=t.stop;

document.querySelectorAll("[data-i]").forEach(el=>{
el.innerText=t[el.dataset.i];
});
}

/* =========================
   EVENTS
========================= */

ruBtn.onclick=()=>{state.lang="ru";applyLang()}
enBtn.onclick=()=>{state.lang="en";applyLang()}

bitsBtn.onclick=()=>{
state.lengthMode="bits";
bitsSelect.style.display="block";
lengthInput.style.display="none";
}

lengthBtn.onclick=()=>{
state.lengthMode="length";
bitsSelect.style.display="none";
lengthInput.style.display="block";
}

/* =========================
   GENERATION
========================= */

function secureRandom(max){
const arr=new Uint32Array(1);
const limit=Math.floor(4294967296/max)*max;
while(true){
crypto.getRandomValues(arr);
if(arr[0]<limit)return arr[0]%max;
}
}

function rand(max){
return state.mode==="crypto"
?secureRandom(max)
:Math.floor(Math.random()*max);
}

function getLength(){
return state.lengthMode==="bits"
?Math.floor(bitsSelect.value/6)
:lengthInput.value||32;
}

function getCharset(){
let c="";
if(letters.checked)c+="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
if(digits.checked)c+="0123456789";
if(symbols.checked)c+="!@#$%^&*";
if(exclude.checked)c=c.replace(/[0Ool1I]/g,"");
if(customCharset.value)return customCharset.value;
return c||"abc123";
}

function genKey(len,cs){
let r="";
for(let i=0;i<len;i++)r+=cs[rand(cs.length)];
if(dash.checked)r=r.match(/.{1,4}/g).join("-");
return r;
}

/* =========================
   PREVIEW
========================= */

previewBtn.onclick=()=>{
let len=getLength();
let cs=getCharset();
let out=[];
for(let i=0;i<100;i++)out.push(genKey(len,cs));
preview.innerText=out.join("\n");
};

/* =========================
   COPY
========================= */

copyBtn.onclick=()=>{
if(!preview.innerText)return;
navigator.clipboard.writeText(preview.innerText);
copyBtn.innerText="✔";
setTimeout(()=>applyLang(),1000);
};

/* =========================
   GENERATE FILE
========================= */

generateBtn.onclick=async()=>{

state.stop=false;

let count=parseInt(countInput.value);
let len=getLength();
let cs=getCharset();

let parts=[];
for(let i=0;i<count;i++){
if(state.stop)break;
parts.push(genKey(len,cs)+"\n");
if(i%5000===0)await new Promise(r=>setTimeout(r,0));
}

let blob=new Blob(parts,{type:"text/plain"});
let url=URL.createObjectURL(blob);

let a=document.createElement("a");
a.href=url;
a.download="keys.txt";
a.click();

URL.revokeObjectURL(url);
};

/* =========================
   STOP
========================= */

stopBtn.onclick=()=>state.stop=true;

/* INIT */
applyLang();

</script>
<script>

/* =========================
   ⚡ WORKER (ЧИСТЫЙ)
========================= */

function createWorker(){

const code = `
self.onmessage = function(e){

const { length, charset, size, dash } = e.data;

function secureRandom(max){
const arr=new Uint32Array(1);
const limit=Math.floor(4294967296/max)*max;
while(true){
crypto.getRandomValues(arr);
if(arr[0]<limit)return arr[0]%max;
}
}

let out=[];

for(let i=0;i<size;i++){
let r="";
for(let j=0;j<length;j++){
r+=charset[secureRandom(charset.length)];
}

if(dash){
r=r.match(/.{1,4}/g).join("-");
}

out.push(r);
}

postMessage(out);
}
`;

const blob = new Blob([code], {type:"application/javascript"});
return new Worker(URL.createObjectURL(blob));
}

/* =========================
   🚀 ULTRA GENERATION
========================= */

async function generateFast(){

state.stop = false;

let count = parseInt(countInput.value);
let len = getLength();
let cs = getCharset();

if(!count || count <= 0){
status.innerText = "Invalid";
return;
}

let worker = createWorker();

let produced = 0;
let chunkSize = 2000;

let parts = [];

let start = performance.now();

worker.onmessage = async (e)=>{

if(state.stop){
worker.terminate();
status.innerText = "Stopped";
return;
}

let chunk = e.data;

parts.push(chunk.join("\n") + "\n");

produced += chunk.length;

let elapsed = (performance.now() - start)/1000;
let speed = Math.floor(produced/elapsed);

status.innerText = produced + "/" + count + " • " + speed + "/s";

if(produced >= count){

let blob = new Blob(parts, {type:"text/plain"});
let url = URL.createObjectURL(blob);

let a = document.createElement("a");
a.href = url;
a.download = "keys.txt";
a.click();

URL.revokeObjectURL(url);

worker.terminate();
status.innerText = "Done";

return;
}

worker.postMessage({
length: len,
charset: cs,
size: chunkSize,
dash: dash.checked
});

};

worker.postMessage({
length: len,
charset: cs,
size: chunkSize,
dash: dash.checked
});

}

/* =========================
   🔁 ПЕРЕЗАМЕНА ГЕНЕРАЦИИ
========================= */

generateBtn.onclick = generateFast;

</script>
<script>

/* =========================
   📁 WRITER (REAL STREAM)
========================= */

async function createWriter(filename){

// ПК — настоящий streaming
if(window.showSaveFilePicker){

const handle = await showSaveFilePicker({
suggestedName: filename
});

const writable = await handle.createWritable();

return {
write: chunk => writable.write(chunk),
close: () => writable.close(),
real: true
};
}

// 📱 fallback (iPhone)
let parts = [];

return {
write: chunk => parts.push(chunk),
close: () => parts
};

}

/* =========================
   🗜️ GZIP
========================= */

async function compressIfNeeded(blob){

if(!gzip.checked) return blob;

if(!window.CompressionStream) return blob;

const cs = new CompressionStream("gzip");
const stream = blob.stream().pipeThrough(cs);
return await new Response(stream).blob();

}

/* =========================
   🚀 STREAM GENERATION
========================= */

async function generateStream(){

state.stop = false;

let count = parseInt(countInput.value);
let len = getLength();
let cs = getCharset();

if(!count || count <= 0){
status.innerText = "Invalid";
return;
}

// ⚠️ предупреждение
if(count > 250000){
if(!confirm("Large file (~" + Math.floor(count*len/1024/1024) + " MB)")){
return;
}
}

let writer = await createWriter("keys.txt");

let produced = 0;
let chunkSize = 2000;

let worker = createWorker();

let start = performance.now();

worker.onmessage = async (e)=>{

if(state.stop){
worker.terminate();
status.innerText = "Stopped";
return;
}

let chunk = e.data;

let text = chunk.join("\n") + "\n";

// если real stream → пишем сразу
if(writer.real){
await writer.write(text);
}else{
// fallback
await writer.write(text);
}

produced += chunk.length;

let elapsed = (performance.now() - start)/1000;
let speed = Math.floor(produced/elapsed);

status.innerText = produced + "/" + count + " • " + speed + "/s";

if(produced >= count){

let result = await writer.close();

// fallback download (iPhone)
if(Array.isArray(result)){

let blob = new Blob(result,{type:"text/plain"});
blob = await compressIfNeeded(blob);

let url = URL.createObjectURL(blob);

let a = document.createElement("a");
a.href = url;
a.download = gzip.checked ? "keys.txt.gz" : "keys.txt";
a.click();

URL.revokeObjectURL(url);
}

worker.terminate();
status.innerText = "Done";

return;
}

worker.postMessage({
length: len,
charset: cs,
size: chunkSize,
dash: dash.checked
});

};

worker.postMessage({
length: len,
charset: cs,
size: chunkSize,
dash: dash.checked
});

}

/* =========================
   🔁 REPLACE GENERATE
========================= */

generateBtn.onclick = generateStream;

</script>
<script>

/* =========================
   🌍 FULL I18N (ЧИСТО)
========================= */

const i18nFull = {
ru:{
title:"Генератор API ключей",
sub:"Инструмент генерации ключей",
preview:"Предпросмотр",
copy:"Скопировать",
generate:"Генерировать",
stop:"СТОП",
letters:"Буквы",
digits:"Цифры",
symbols:"Символы",
exclude:"Исключить похожие",
dash:"Разделять -",
done:"Готово",
stopped:"Остановлено",
invalid:"Неверное количество",
empty:"Нет данных",
},
en:{
title:"API Key Generator",
sub:"Secure key generator",
preview:"Preview",
copy:"Copy",
generate:"Generate",
stop:"STOP",
letters:"Letters",
digits:"Digits",
symbols:"Symbols",
exclude:"Exclude similar",
dash:"Use dashes",
done:"Done",
stopped:"Stopped",
invalid:"Invalid count",
empty:"No data",
}
};

function applyLangFull(){

let t=i18nFull[state.lang];

title.innerText=t.title;
sub.innerText=t.sub;

previewBtn.innerText=t.preview;
copyBtn.innerText=t.copy;
generateBtn.innerText=t.generate;
stopBtn.innerText=t.stop;

document.querySelectorAll("[data-i]").forEach(el=>{
el.innerText=t[el.dataset.i];
});

}

/* =========================
   🔄 ПЕРЕХВАТ ЯЗЫКА
========================= */

ruBtn.onclick=()=>{state.lang="ru";applyLangFull();}
enBtn.onclick=()=>{state.lang="en";applyLangFull();}

applyLangFull();

/* =========================
   🔔 УВЕДОМЛЕНИЯ (ВМЕСТО ALERT)
========================= */

function notify(text){

const n=document.createElement("div");

n.innerText=text;

n.style=`
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:12px 18px;
border-radius:12px;
font-size:13px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
z-index:9999;
`;

document.body.appendChild(n);

setTimeout(()=>n.remove(),2000);

}

/* =========================
   📋 COPY FIX (БЕЗ ДУБЛЯ)
========================= */

copyBtn.onclick=()=>{

if(!preview.innerText){
notify(i18nFull[state.lang].empty);
return;
}

navigator.clipboard.writeText(preview.innerText);

notify("✔");

};

/* =========================
   ⚠️ FAST MODE WARNING (1 РАЗ)
========================= */

let fastWarned=localStorage.getItem("fastWarned");

fastBtn.onclick=()=>{

state.mode="fast";

if(!fastWarned){

const modal=document.createElement("div");

modal.innerHTML=`
<div style="
position:fixed;inset:0;
background:rgba(0,0,0,0.7);
display:flex;align-items:center;justify-content:center;
z-index:9999;
">
<div style="
background:#111;
padding:20px;
border-radius:16px;
max-width:320px;
text-align:center;
">
<h2 style="color:red;">ВАЖНО!!!</h2>
<p style="font-size:13px;margin:10px 0;">
Math.random НЕ безопасен.
Используй только для тестов.
</p>
<button id="okFast" class="button">OK</button>
</div>
</div>
`;

document.body.appendChild(modal);

document.getElementById("okFast").onclick=()=>{
modal.remove();
localStorage.setItem("fastWarned","1");
};

}

};

/* =========================
   🎨 ACTIVE BUTTON STATE
========================= */

document.querySelectorAll(".segment button").forEach(btn=>{
btn.addEventListener("click",()=>{
btn.parentNode.querySelectorAll("button")
.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
});
});

/* =========================
   📱 MOBILE UX FIX
========================= */

document.body.style.paddingBottom="40px";

/* =========================
   🔢 INPUT SAFE
========================= */

countInput.oninput=()=>{
countInput.value=countInput.value.replace(/\D/g,"");
};

/* =========================
   ✨ MICRO ANIMATION
========================= */

document.querySelectorAll(".button").forEach(b=>{
b.addEventListener("click",()=>{
b.style.transform="scale(0.96)";
setTimeout(()=>b.style.transform="",100);
});
});

</script>
<script>

/* =========================
   💾 SAVE SETTINGS (ЛЁГКОЕ)
========================= */

function saveSettings(){

const s = {
bits: bitsSelect.value,
length: lengthInput.value,
count: countInput.value,
dash: dash.checked,
gzip: gzip.checked,
letters: letters.checked,
digits: digits.checked,
symbols: symbols.checked,
exclude: exclude.checked,
custom: customCharset.value,
lang: state.lang,
mode: state.mode
};

localStorage.setItem("gen_v41", JSON.stringify(s));
}

function loadSettings(){

let raw = localStorage.getItem("gen_v41");
if(!raw) return;

let s = JSON.parse(raw);

bitsSelect.value = s.bits || 256;
lengthInput.value = s.length || 32;
countInput.value = s.count || 1000;

dash.checked = s.dash;
gzip.checked = s.gzip;

letters.checked = s.letters;
digits.checked = s.digits;
symbols.checked = s.symbols;
exclude.checked = s.exclude;

customCharset.value = s.custom || "";

state.lang = s.lang || "ru";
state.mode = s.mode || "crypto";

applyLangFull();
}

/* автосохранение */
document.querySelectorAll("input,select").forEach(el=>{
el.addEventListener("change", saveSettings);
});

loadSettings();

/* =========================
   ⏳ LOADING STATE
========================= */

const originalGenerate = generateBtn.onclick;

generateBtn.onclick = async ()=>{

generateBtn.disabled = true;
generateBtn.innerText = "...";

await originalGenerate();

generateBtn.disabled = false;
applyLangFull();
};

/* =========================
   📊 ESTIMATE SIZE
========================= */

function updateEstimate(){

let count = parseInt(countInput.value) || 0;
let len = getLength();

if(!count) return;

let size = ((count * (len + 1)) / (1024*1024)).toFixed(1);

status.innerText = "~ " + size + " MB";

}

countInput.addEventListener("input", updateEstimate);
bitsSelect.addEventListener("change", updateEstimate);
lengthInput.addEventListener("input", updateEstimate);

/* =========================
   🎯 BETTER BUTTON TEXT
========================= */

document.querySelectorAll(".button").forEach(b=>{
b.style.letterSpacing = "0.4px";
b.style.fontWeight = "600";
});

/* =========================
   ✨ HOVER UX (ПК)
========================= */

document.querySelectorAll(".button").forEach(b=>{

b.addEventListener("mouseenter", ()=>{
b.style.transform = "translateY(-2px)";
b.style.boxShadow = "0 8px 20px rgba(0,0,0,0.4)";
});

b.addEventListener("mouseleave", ()=>{
b.style.transform = "";
b.style.boxShadow = "";
});

});

/* =========================
   📱 TOUCH UX
========================= */

document.querySelectorAll(".button").forEach(b=>{

b.addEventListener("touchstart", ()=>{
b.style.transform = "scale(0.97)";
});

b.addEventListener("touchend", ()=>{
b.style.transform = "";
});

});

/* =========================
   🔥 EMPTY STATE UX
========================= */

if(!preview.innerText){
preview.innerText = "—";
}

/* =========================
   🧼 AUTO SCROLL PREVIEW
========================= */

const observer = new MutationObserver(()=>{
preview.scrollTop = preview.scrollHeight;
});

observer.observe(preview, { childList:true });

</script>
</body>
</html>
