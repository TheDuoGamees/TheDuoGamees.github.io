<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #222530;
            --border: #2a2d38;
            --text: #e1e4ed;
            --text2: #9ca3b4;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #c7d2fe, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .lang-toggle {
            display: flex;
            gap: 4px;
            background: var(--surface2);
            border-radius: 20px;
            padding: 3px;
        }
        .lang-toggle button {
            padding: 6px 14px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            background: transparent;
            color: var(--text2);
            transition: var(--transition);
        }
        .lang-toggle button.active {
            background: var(--accent);
            color: #fff;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .card-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text2);
            margin-bottom: 14px;
            font-weight: 600;
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .grid4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text2);
            margin-bottom: 4px;
        }
        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }
        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toggle-pill {
            display: flex;
            background: var(--surface2);
            border-radius: 20px;
            padding: 3px;
            gap: 2px;
        }
        .toggle-pill button {
            padding: 7px 16px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            background: transparent;
            color: var(--text2);
            transition: var(--transition);
            white-space: nowrap;
        }
        .toggle-pill button.active {
            background: var(--accent);
            color: #fff;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text);
            user-select: none;
        }
        .checkbox-label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .preset-btn {
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--surface2);
            color: var(--text);
            transition: var(--transition);
            white-space: nowrap;
        }
        .preset-btn:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }
        .preset-btn.active-preset {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.2);
            color: #c7d2fe;
        }

        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: inherit;
            letter-spacing: 0.01em;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.08);
        }
        .btn-sm {
            padding: 6px 13px;
            font-size: 0.8rem;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .preview-box {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            max-height: 260px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.78rem;
            line-height: 1.7;
            word-break: break-all;
            color: #a5b4fc;
            border: 1px solid var(--border);
        }
        .preview-box span {
            display: block;
        }
        .preview-box .key-num {
            color: var(--text2);
            margin-right: 8px;
            font-size: 0.7rem;
            user-select: none;
        }

        .progress-wrap {
            margin-top: 12px;
            display: none;
        }
        .progress-wrap.active {
            display: block;
        }
        .progress-bar {
            height: 8px;
            border-radius: 10px;
            background: var(--surface2);
            overflow: hidden;
            margin-bottom: 6px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #818cf8);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-text {
            font-size: 0.8rem;
            color: var(--text2);
            text-align: center;
        }

        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .download-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            color: #fff;
            box-shadow: var(--shadow);
            animation: slideInRight 0.3s ease;
            pointer-events: auto;
            max-width: 380px;
        }
        .toast.info {
            background: #3b82f6;
        }
        .toast.warn {
            background: #d97706;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.success {
            background: #16a34a;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .modal h3 {
            margin-bottom: 12px;
            font-size: 1.2rem;
        }
        .modal p {
            color: var(--text2);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .modal .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .grid2,
            .grid3,
            .grid4 {
                grid-template-columns: 1fr 1fr;
            }
            .container {
                padding: 12px 10px 40px;
            }
            .card {
                padding: 14px 12px;
            }
            header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔑 API Key Generator</h1>
            <div class="lang-toggle" id="langToggle">
                <button data-lang="en" class="active">EN</button>
                <button data-lang="ru">RU</button>
            </div>
        </header>

        <!-- MODE & LENGTH -->
        <div class="card">
            <div class="card-title" data-i18n="mode_title">Generation Mode</div>
            <div class="toggle-row" style="margin-bottom:12px;">
                <div class="toggle-pill" id="modeToggle">
                    <button data-mode="length" class="active" data-i18n="mode_length">Length</button>
                    <button data-mode="bits" data-i18n="mode_bits">Bits</button>
                </div>
                <span style="font-size:0.8rem;color:var(--text2);" data-i18n="mode_desc">Choose how to specify key size</span>
            </div>
            <div id="lengthSection" class="grid2">
                <div>
                    <label data-i18n="label_length">Key Length (chars)</label>
                    <input type="number" id="inputLength" value="32" min="4" max="2048">
                </div>
            </div>
            <div id="bitsSection" style="display:none;">
                <div class="grid2" style="margin-bottom:8px;">
                    <div>
                        <label data-i18n="label_bits">Bits</label>
                        <input type="number" id="inputBits" value="256" min="64" max="2048" step="8">
                    </div>
                    <div>
                        <label data-i18n="label_effective_length">Effective Length (chars)</label>
                        <input type="number" id="effectiveLength" value="32" readonly style="opacity:0.7;">
                    </div>
                </div>
                <label style="margin-bottom:4px;" data-i18n="label_presets">Presets</label>
                <div class="grid4" id="bitsPresets">
                    <button class="preset-btn" data-bits="128">128 bit</button>
                    <button class="preset-btn active-preset" data-bits="256">256 bit</button>
                    <button class="preset-btn" data-bits="512">512 bit</button>
                    <button class="preset-btn" data-bits="1024">1024 bit</button>
                </div>
            </div>
        </div>

        <!-- CHARSET -->
        <div class="card">
            <div class="card-title" data-i18n="charset_title">Character Set</div>
            <div class="checkbox-group" style="margin-bottom:8px;">
                <label class="checkbox-label"><input type="checkbox" id="chkLetters" checked><span data-i18n="charset_letters">Letters (a-z A-Z)</span></label>
                <label class="checkbox-label"><input type="checkbox" id="chkNumbers" checked><span data-i18n="charset_numbers">Numbers (0-9)</span></label>
                <label class="checkbox-label"><input type="checkbox" id="chkSymbols"><span data-i18n="charset_symbols">Symbols (!@#...)</span></label>
            </div>
            <div style="margin-bottom:8px;">
                <label class="checkbox-label"><input type="checkbox" id="chkExcludeSimilar"><span data-i18n="charset_exclude">Exclude similar (0Ool1I)</span></label>
            </div>
            <div>
                <label data-i18n="label_custom_charset">Custom Charset (overrides above)</label>
                <input type="text" id="inputCustomCharset" placeholder="e.g. ABCDEF12345" style="font-family:monospace;">
            </div>
        </div>

        <!-- FORMAT -->
        <div class="card">
            <div class="card-title" data-i18n="format_title">Key Format</div>
            <div class="grid2">
                <div>
                    <label data-i18n="label_prefix">Prefix</label>
                    <input type="text" id="inputPrefix" placeholder="e.g. myapp_" maxlength="32">
                </div>
                <div>
                    <label data-i18n="label_key_type">Key Type</label>
                    <select id="selectKeyType">
                        <option value="api" data-i18n="type_api">api_</option>
                        <option value="sk" data-i18n="type_sk">sk_</option>
                        <option value="pk" data-i18n="type_pk">pk_</option>
                    </select>
                </div>
                <div>
                    <label data-i18n="label_env">Environment</label>
                    <select id="selectEnv">
                        <option value="live" data-i18n="env_live">Live</option>
                        <option value="test" data-i18n="env_test">Test</option>
                    </select>
                </div>
                <div>
                    <label class="checkbox-label" style="margin-top:22px;"><input type="checkbox" id="chkSeparator" checked><span data-i18n="label_separator">Separator "-" every 4 chars</span></label>
                </div>
            </div>
        </div>

        <!-- RANDOM MODE -->
        <div class="card">
            <div class="card-title" data-i18n="random_title">Random Mode</div>
            <div class="toggle-row">
                <div class="toggle-pill" id="randomToggle">
                    <button data-random="crypto" class="active" data-i18n="random_crypto">🔒 Crypto</button>
                    <button data-random="fast" data-i18n="random_fast">⚡ Fast</button>
                </div>
                <span style="font-size:0.8rem;color:var(--text2);" data-i18n="random_desc">Crypto uses getRandomValues, Fast uses Math.random</span>
            </div>
        </div>

        <!-- PREVIEW -->
        <div class="card">
            <div class="card-title" data-i18n="preview_title">Preview (50 keys)</div>
            <div class="preview-box" id="previewBox">
                <span style="color:var(--text2);" data-i18n="preview_placeholder">Configure settings and click Preview</span>
            </div>
            <button class="btn btn-outline btn-sm" id="btnPreview" style="margin-top:8px;" data-i18n="btn_preview">↻ Refresh Preview</button>
        </div>

        <!-- GENERATE -->
        <div class="card">
            <div class="card-title" data-i18n="generate_title">Generate Keys</div>
            <div class="grid2" style="margin-bottom:12px;">
                <div>
                    <label data-i18n="label_count">Number of Keys</label>
                    <input type="number" id="inputCount" value="100" min="1" max="500000">
                </div>
                <div>
                    <label data-i18n="label_format">Download Format</label>
                    <select id="selectFormat">
                        <option value="txt">TXT</option>
                        <option value="csv">CSV</option>
                        <option value="json">JSON</option>
                        <option value="zip">ZIP</option>
                    </select>
                </div>
            </div>
            <div class="action-row">
                <button class="btn btn-primary" id="btnGenerate" data-i18n="btn_generate">⚡ Generate & Download</button>
                <button class="btn btn-danger" id="btnStop" style="display:none;" data-i18n="btn_stop">⏹ STOP</button>
                <span id="statusText" style="font-size:0.85rem;color:var(--text2);"></span>
            </div>
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText"></div>
            </div>
            <div class="download-row" id="downloadRow" style="display:none;">
                <button class="btn btn-outline btn-sm" data-fmt="txt" data-i18n="btn_download_txt">📄 TXT</button>
                <button class="btn btn-outline btn-sm" data-fmt="csv" data-i18n="btn_download_csv">📊 CSV</button>
                <button class="btn btn-outline btn-sm" data-fmt="json" data-i18n="btn_download_json">📋 JSON</button>
                <button class="btn btn-outline btn-sm" data-fmt="zip" data-i18n="btn_download_zip">📦 ZIP</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div id="modalContainer"></div>

    <script>
        (function() {
            // ==================== 1. STATE ====================
            const state = {
                mode: 'length', // 'length' | 'bits'
                length: 32,
                bits: 256,
                charsetLetters: true,
                charsetNumbers: true,
                charsetSymbols: false,
                customCharset: '',
                excludeSimilar: false,
                separator: true,
                separatorInterval: 4,
                prefix: '',
                keyType: 'api',
                environment: 'live',
                randomMode: 'crypto', // 'crypto' | 'fast'
                count: 100,
                downloadFormat: 'txt',
                language: 'en',
                generatedKeys: [],
                isGenerating: false,
                cancelRequested: false,
                fastModeWarningShown: false,
            };

            // ==================== 2. DOM CACHE ====================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const dom = {
                langToggle: $('#langToggle'),
                modeToggle: $('#modeToggle'),
                lengthSection: $('#lengthSection'),
                bitsSection: $('#bitsSection'),
                inputLength: $('#inputLength'),
                inputBits: $('#inputBits'),
                effectiveLength: $('#effectiveLength'),
                bitsPresets: $('#bitsPresets'),
                chkLetters: $('#chkLetters'),
                chkNumbers: $('#chkNumbers'),
                chkSymbols: $('#chkSymbols'),
                chkExcludeSimilar: $('#chkExcludeSimilar'),
                inputCustomCharset: $('#inputCustomCharset'),
                inputPrefix: $('#inputPrefix'),
                selectKeyType: $('#selectKeyType'),
                selectEnv: $('#selectEnv'),
                chkSeparator: $('#chkSeparator'),
                randomToggle: $('#randomToggle'),
                inputCount: $('#inputCount'),
                selectFormat: $('#selectFormat'),
                btnGenerate: $('#btnGenerate'),
                btnStop: $('#btnStop'),
                btnPreview: $('#btnPreview'),
                previewBox: $('#previewBox'),
                statusText: $('#statusText'),
                progressWrap: $('#progressWrap'),
                progressFill: $('#progressFill'),
                progressText: $('#progressText'),
                downloadRow: $('#downloadRow'),
                toastContainer: $('#toastContainer'),
                modalContainer: $('#modalContainer'),
            };

            // ==================== 3. i18n ====================
            const i18nDict = {
                en: {
                    mode_title: 'Generation Mode',
                    mode_length: 'Length',
                    mode_bits: 'Bits',
                    mode_desc: 'Choose how to specify key size',
                    label_length: 'Key Length (chars)',

                    label_effective_length: 'Effective Length (chars)',

                    charset_title: 'Character Set',

                    label_custom_charset: 'Custom Charset (overrides above)',

                    label_key_type: 'Key Type',
                    type_api: 'api_',
                    type_sk: 'sk_',
                    type_pk: 'pk_',
                    label_env: 'Environment',
                    env_live: 'Live',
                    env_test: 'Test',
                    label_separator: 'Separator "-" every 4 chars',
                    random_title: 'Random Mode',
                    random_crypto: '🔒 Crypto',
                    random_fast: '⚡ Fast',
                    random_desc: 'Crypto uses getRandomValues, Fast uses Math.random',
                    preview_title: 'Preview (50 keys)',
                    preview_placeholder: 'Configure settings and click Preview',
                    btn_preview: '↻ Refresh Preview',
                    generate_title: 'Generate Keys',
                    label_count: 'Number of Keys',
                    label_format: 'Download Format',
                    btn_generate: '⚡ Generate & Download',
                    btn_stop: '⏹ STOP',
                    btn_download_txt: '📄 TXT',
                    btn_download_csv: '📊 CSV',
                    btn_download_json: '📋 JSON',
                    btn_download_zip: '📦 ZIP',
                    toast_fast_warning: '⚠️ Fast mode uses Math.random — less secure. Not recommended for production keys.',
                    toast_no_charset: '❌ Please select at least one character set or provide a custom charset.',
                    toast_invalid_length: '❌ Invalid key length. Must be between 4 and 2048.',
                    toast_invalid_bits: '❌ Invalid bits value. Must be between 64 and 2048.',
                    toast_invalid_count: '❌ Invalid count. Must be between 1 and 500000.',
                    toast_generated: '✅ Generated {count} keys successfully!',
                    toast_zip_missing: '⚠️ JSZip library not loaded. Cannot create ZIP. Check your internet connection.',
                    toast_copied: '📋 Copied!',
                    modal_stop_title: 'Generation Stopped',
                    modal_stop_body: 'Generation stopped. <strong>{count}</strong> keys generated. Download partial result?',
                    modal_yes: 'Yes, Download',
                    modal_no: 'No, Discard',
                    status_generating: 'Generating... {current} / {total}',
                    status_done: 'Done! {count} keys ready.',
                    status_stopped: 'Stopped. {count} keys in memory.',
                },
                ru: {
                    mode_title: 'Режим генерации',
                    mode_length: 'Длина',
                    mode_bits: 'Биты',
                    mode_desc: 'Выберите способ указания размера ключа',
                    label_length: 'Длина ключа (симв.)',

            function getCharset() {
                if (state.customCharset.trim()) {
                    let cs = state.customCharset.trim();
                    if (state.excludeSimilar) {
                        cs = cs.replace(/[0Ool1I]/g, '');
                    }
                    return [...new Set(cs)].join('');
                }
                let cs = '';
                if (state.charsetLetters) cs += 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
                if (state.charsetNumbers) cs += '0123456789';
                if (state.charsetSymbols) cs += '!@#$%^&*()_+-=[]{}|;:,.<>?';
                if (state.excludeSimilar) {
                    cs = cs.replace(/[0Ool1I]/g, '');
                }
                return [...new Set(cs)].join('');
            }

            function getEffectiveLength() {
                if (state.mode === 'bits') {
                    return Math.ceil(state.bits / 8);
                }
                return state.length;
            }

            function getFullPrefix() {
                let p = state.prefix || '';
                const typeMap = { api: 'api_', sk: 'sk_', pk: 'pk_' };
                p += typeMap[state.keyType] || 'api_';
                if (state.environment === 'test') p += 'test_';
                // For live, no extra env marker (or optionally 'live_')
                return p;
            }

            // ==================== 5. GENERATOR (SINGLE LOGIC) ====================
            // Crypto buffer for optimized random value generation
            let cryptoBuffer = new Uint32Array(1024);
            let cryptoBufferIndex = 1024; // force refill on first use

            function refillCryptoBuffer() {
                if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
                    crypto.getRandomValues(cryptoBuffer);
                    cryptoBufferIndex = 0;
                } else {
                    // Fallback: fill with Math.random-based values
                    for (let i = 0; i < cryptoBuffer.length; i++) {
                        cryptoBuffer[i] = Math.floor(Math.random() * 4294967296);
                    }
                    cryptoBufferIndex = 0;
                }
            }

            function getRandomIndex(max) {
                if (state.randomMode === 'crypto') {
                    if (cryptoBufferIndex >= cryptoBuffer.length) {
                        refillCryptoBuffer();
                    }
                    const val = cryptoBuffer[cryptoBufferIndex];
                    cryptoBufferIndex++;
                    return val % max;
                } else {
                    return Math.floor(Math.random() * max);
                }
            }

            /**
             * SINGLE SOURCE OF TRUTH for key generation.
             * Generates ONE key (random part only, no prefix, no separators).
             * @param {string} charset - the character set to use
             * @param {number} length - the number of random characters
             * @returns {string} the generated random string
             */
            function generateRandomPart(charset, length) {
                if (!charset || charset.length === 0) return '';
                if (length <= 0) return '';
                const chars = charset;
                const maxIdx = chars.length;
                const result = new Array(length);
                // Use buffered approach for crypto mode
                if (state.randomMode === 'crypto') {
                    // Ensure buffer is ready
                    if (cryptoBufferIndex >= cryptoBuffer.length) {
                        refillCryptoBuffer();
                    }
                    for (let i = 0; i < length; i++) {
                        if (cryptoBufferIndex >= cryptoBuffer.length) {
                            refillCryptoBuffer();
                        }
                        result[i] = chars[cryptoBuffer[cryptoBufferIndex] % maxIdx];
                        cryptoBufferIndex++;
                    }
                } else {
                    for (let i = 0; i < length; i++) {
                        result[i] = chars[Math.floor(Math.random() * maxIdx)];
                    }
                }
                return result.join('');
            }

            /**
             * Builds a full key: prefix + random part with optional separator.
             * Uses generateRandomPart internally.
             */
            function generateFullKey(charset, randomLength, prefix, separator, separatorInterval) {
                const randomPart = generateRandomPart(charset, randomLength);
                let formattedRandom = randomPart;
                if (separator && separatorInterval > 0 && randomPart.length > separatorInterval) {
                    const chunks = [];
                    for (let i = 0; i < randomPart.length; i += separatorInterval) {
                        chunks.push(randomPart.slice(i, i + separatorInterval));
                    }
                    formattedRandom = chunks.join('-');
                }
                return prefix + formattedRandom;
            }

            /**
             * Generate multiple keys. Used by preview, direct generation, and download.
             * This is the SINGLE entry point for bulk generation.
             */
            function generateKeys(charset, randomLength, prefix, separator, separatorInterval, count) {
                const keys = [];
                for (let i = 0; i < count; i++) {
                    keys.push(generateFullKey(charset, randomLength, prefix, separator, separatorInterval));
                }
                return keys;
            }

            // ==================== 6. WORKER ====================
            let worker = null;

            function getWorkerCode() {
                // The worker uses the SAME algorithm as the main thread's generateRandomPart and generateFullKey.
                // We pass the charset, length, prefix, separator config, randomMode, and count.
                const code = `
                    'use strict';
                    let cryptoBuffer = new Uint32Array(1024);
                    let cryptoBufferIndex = 1024;
                    function refillCryptoBuffer() {
                        if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
                            crypto.getRandomValues(cryptoBuffer);
                            cryptoBufferIndex = 0;
                        } else {
                            for (let i = 0; i < cryptoBuffer.length; i++) {
                                cryptoBuffer[i] = Math.floor(Math.random() * 4294967296);
                            }
                            cryptoBufferIndex = 0;
                        }
                    }
                    function getRandomIndex(max, randomMode) {
                        if (randomMode === 'crypto') {
                            if (cryptoBufferIndex >= cryptoBuffer.length) {
                                refillCryptoBuffer();
                            }
                            const val = cryptoBuffer[cryptoBufferIndex];
                            cryptoBufferIndex++;
                            return val % max;
                        } else {
                            return Math.floor(Math.random() * max);
                        }
                    }
                    function generateRandomPart(charset, length, randomMode) {
                        if (!charset || charset.length === 0) return '';
                        if (length <= 0) return '';
                        const chars = charset;
                        const maxIdx = chars.length;
                        const result = new Array(length);
                        if (randomMode === 'crypto') {
                            if (cryptoBufferIndex >= cryptoBuffer.length) refillCryptoBuffer();
                            for (let i = 0; i < length; i++) {
                                if (cryptoBufferIndex >= cryptoBuffer.length) refillCryptoBuffer();
                                result[i] = chars[cryptoBuffer[cryptoBufferIndex] % maxIdx];
                                cryptoBufferIndex++;
                            }
                        } else {
                            for (let i = 0; i < length; i++) {
                                result[i] = chars[Math.floor(Math.random() * maxIdx)];
                            }
                        }
                        return result.join('');
                    }
                    function generateFullKey(charset, randomLength, prefix, separator, separatorInterval, randomMode) {
                        const randomPart = generateRandomPart(charset, randomLength, randomMode);
                        let formattedRandom = randomPart;
                        if (separator && separatorInterval > 0 && randomPart.length > separatorInterval) {
                            const chunks = [];
                            for (let i = 0; i < randomPart.length; i += separatorInterval) {
                                chunks.push(randomPart.slice(i, i + separatorInterval));
                            }
                            formattedRandom = chunks.join('-');
                        }
                        return prefix + formattedRandom;
                    }
                    self.onmessage = function(e) {
                        const { charset, randomLength, prefix, separator, separatorInterval, randomMode, count, chunkSize } = e.data;
                        const totalKeys = count;
                        const generated = [];
                        const sz = chunkSize || 2000;
                        for (let i = 0; i < totalKeys; i++) {
                            generated.push(generateFullKey(charset, randomLength, prefix, separator, separatorInterval, randomMode));
                            if (generated.length >= sz || i === totalKeys - 1) {
                                self.postMessage({ type: 'chunk', keys: generated.slice(), progress: i + 1, total: totalKeys });
                                generated.length = 0;
                            }
                        }
                        self.postMessage({ type: 'done', total: totalKeys });
                    };
                `;
                return code;
            }

            function createWorker() {
                if (worker) {
                    worker.terminate();
                    worker = null;
                }
                const blob = new Blob([getWorkerCode()], { type: 'application/javascript' });
                const url = URL.createObjectURL(blob);
                worker = new Worker(url);
                URL.revokeObjectURL(url);
                return worker;
            }

            function terminateWorker() {
                if (worker) {
                    worker.terminate();
                    worker = null;
                }
            }

            // ==================== 7. UI LOGIC ====================
            function updateEffectiveLengthDisplay() {
                const eff = getEffectiveLength();

                    return;
                }
                const randomLength = getEffectiveLength();

                    dom.previewBox.innerHTML =
                        `<span style="color:#f87171;">${t('toast_invalid_length')}</span>`;
                    return;
                }
                const prefix = getFullPrefix();
                const keys = generateKeys(charset, randomLength, prefix, state.separator, state.separatorInterval,
                    50);
                dom.previewBox.innerHTML = keys.map((k, i) =>
                    `<span><span class="key-num">${String(i + 1).padStart(2, '0')}</span>${escapeHTML(k)}</span>`
                ).join('');

            function escapeHTML(str) {

                return div.innerHTML;
            }

            function updateUIForMode() {
                if (state.mode === 'length') {
                    dom.lengthSection.style.display = '';
                    dom.bitsSection.style.display = 'none';
                } else {
                    dom.lengthSection.style.display = 'none';
                    dom.bitsSection.style.display = '';
                }
                updateEffectiveLengthDisplay();
                updateBitsPresets();
                // Update toggle buttons
                $$('#modeToggle button').forEach(b => {
                    b.classList.toggle('active', b.getAttribute('data-mode') === state.mode);
                });

            function updateUIForRandom() {
                $$('#randomToggle button').forEach(b => {
                    b.classList.toggle('active', b.getAttribute('data-random') === state.randomMode);
                });
            }

            function setGeneratingUI(active) {
                state.isGenerating = active;
                state.cancelRequested = false;
                dom.btnGenerate.style.display = active ? 'none' : '';
                dom.btnStop.style.display = active ? '' : 'none';
                dom.progressWrap.classList.toggle('active', active);
                if (!active) {
                    dom.progressFill.style.width = '0%';
                    dom.progressText.textContent = '';
                }
                dom.downloadRow.style.display = 'none';
            }

            async function doGenerateAndDownload() {
                const charset = getCharset();
                if (!charset) {
                    showToast(t('toast_no_charset'), 'error');
                    return;
                }
                const randomLength = getEffectiveLength();
                if (randomLength < 4 || randomLength > 2048) {
                    showToast(t('toast_invalid_length'), 'error');
                    return;
                }
                const count = state.count;
                if (count < 1 || count > 500000) {
                    showToast(t('toast_invalid_count'), 'error');
                    return;
                }

                // Fast mode warning (once)
                if (state.randomMode === 'fast' && !state.fastModeWarningShown) {
                    showToast(t('toast_fast_warning'), 'warn', 5000);
                    state.fastModeWarningShown = true;
                    saveSettings();
                }

                const prefix = getFullPrefix();
                setGeneratingUI(true);
                state.generatedKeys = [];
                dom.statusText.textContent = t('status_generating', { current: 0, total: count });

                const useWorker = count > 2000;

                if (useWorker) {
                    await generateWithWorker(charset, randomLength, prefix, count);
                } else {
                    await generateDirect(charset, randomLength, prefix, count);
                }

                if (state.cancelRequested) {
                    // Stop was requested
                    const partialCount = state.generatedKeys.length;
                    setGeneratingUI(false);
                    dom.statusText.textContent = t('status_stopped', { count: partialCount });
                    showModal(
                        t('modal_stop_title'),
                        t('modal_stop_body', { count: partialCount }),
                        () => {
                            // YES - download partial
                            if (state.generatedKeys.length > 0) {
                                triggerDownload(state.generatedKeys, state.downloadFormat);
                            }
                        },
                        () => {
                            // NO - discard
                            state.generatedKeys = [];
                            dom.statusText.textContent = '';
                            dom.downloadRow.style.display = 'none';
                        }
                    );
                    return;
                }

                // Success
                setGeneratingUI(false);
                dom.statusText.textContent = t('status_done', { count: state.generatedKeys.length });
                dom.downloadRow.style.display = '';
                showToast(t('toast_generated', { count: state.generatedKeys.length }), 'success');
                // Auto-download
                triggerDownload(state.generatedKeys, state.downloadFormat);
            }

            async function generateDirect(charset, randomLength, prefix, count) {
                const chunkSize = 500;
                for (let offset = 0; offset < count; offset += chunkSize) {
                    if (state.cancelRequested) break;
                    const batchSize = Math.min(chunkSize, count - offset);
                    const batch = generateKeys(charset, randomLength, prefix, state.separator, state.separatorInterval,
                        batchSize);
                    state.generatedKeys.push(...batch);
                    dom.progressFill.style.width = ((state.generatedKeys.length / count) * 100) + '%';
                    dom.progressText.textContent = t('status_generating', { current: state.generatedKeys.length,
                        total: count });
                    dom.statusText.textContent = t('status_generating', { current: state.generatedKeys.length,
                        total: count });
                    // Yield to UI thread
                    await sleep(0);
                }
            }

            async function generateWithWorker(charset, randomLength, prefix, count) {
                return new Promise((resolve) => {
                    const w = createWorker();
                    const chunkSize = 2000;
                    w.onmessage = function(e) {
                        if (state.cancelRequested) {
                            terminateWorker();
                            resolve();
                            return;
                        }
                        const msg = e.data;
                        if (msg.type === 'chunk') {
                            state.generatedKeys.push(...msg.keys);
                            const pct = Math.round((msg.progress / msg.total) * 100);
                            dom.progressFill.style.width = pct + '%';
                            dom.progressText.textContent = t('status_generating', { current: msg.progress,
                                total: msg.total });
                            dom.statusText.textContent = t('status_generating', { current: msg.progress,
                                total: msg.total });
                        } else if (msg.type === 'done') {
                            terminateWorker();
                            resolve();
                        }
                    };
                    w.onerror = function(err) {
                        terminateWorker();
                        console.error('Worker error:', err);
                        resolve();
                    };
                    w.postMessage({
                        charset,
                        randomLength,
                        prefix,
                        separator: state.separator,
                        separatorInterval: state.separatorInterval,
                        randomMode: state.randomMode,
                        count,
                        chunkSize,
                    });
                });
            }

            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            function triggerDownload(keys, format) {
                if (!keys || keys.length === 0) {
                    showToast('No keys to download.', 'warn');
                    return;
                }
                const count = keys.length;
                const filenameBase = `keys_${count}`;

                if (format === 'zip') {
                    downloadAsZip(keys, filenameBase);
                } else {
                    let content, mimeType, ext;
                    if (format === 'json') {
                        content = JSON.stringify(keys, null, 2);
                        mimeType = 'application/json';
                        ext = 'json';
                    } else if (format === 'csv') {
                        content = keys.join('\n');
                        mimeType = 'text/csv';
                        ext = 'csv';
                    } else {
                        content = keys.join('\n');
                        mimeType = 'text/plain';
                        ext = 'txt';
                    }
                    downloadBlob(content, `${filenameBase}.${ext}`, mimeType);
                }
            }

            function downloadBlob(content, filename, mimeType) {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function downloadAsZip(keys, filenameBase) {
                if (typeof JSZip === 'undefined') {
                    showToast(t('toast_zip_missing'), 'error', 5000);
                    // Fallback to TXT
                    downloadBlob(keys.join('\n'), `${filenameBase}.txt`, 'text/plain');
                    return;
                }
                const zip = new JSZip();
                zip.file(`${filenameBase}.txt`, keys.join('\n'));
                zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } }).then(
                    blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${filenameBase}.zip`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }).catch(err => {
                    console.error('ZIP error:', err);
                    showToast('Failed to create ZIP. Downloading as TXT instead.', 'error');
                    downloadBlob(keys.join('\n'), `${filenameBase}.txt`, 'text/plain');
                });
            }

            // ==================== 8. STORAGE ====================
            function saveSettings() {
                const settings = {
                    mode: state.mode,
                    length: state.length,
                    bits: state.bits,
                    charsetLetters: state.charsetLetters,
                    charsetNumbers: state.charsetNumbers,
                    charsetSymbols: state.charsetSymbols,
                    customCharset: state.customCharset,
                    excludeSimilar: state.excludeSimilar,
                    separator: state.separator,
                    prefix: state.prefix,
                    keyType: state.keyType,
                    environment: state.environment,
                    randomMode: state.randomMode,
                    count: state.count,
                    downloadFormat: state.downloadFormat,
                    language: state.language,
                    fastModeWarningShown: state.fastModeWarningShown,
                };
                try {
                    localStorage.setItem('apikeygen_settings', JSON.stringify(settings));
                } catch (e) {
                    // Storage full or unavailable
                }
            }

            function loadSettings() {
                try {
                    const raw = localStorage.getItem('apikeygen_settings');
                    if (raw) {
                        const settings = JSON.parse(raw);
                        // Merge with defaults
                        for (const key of Object.keys(settings)) {
                            if (key in state) {
                                state[key] = settings[key];
                            }
                        }
                    }
                } catch (e) {
                    // Ignore parse errors
                }
            }

            // ==================== 9. INIT & EVENT BINDING ====================
            function bindEvents() {
                // Language toggle
                dom.langToggle.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    const lang = btn.getAttribute('data-lang');
                    if (lang && lang !== state.language) {
                        state.language = lang;
                        applyI18n();
                        saveSettings();
                        refreshPreview();
                        // Update modal if open
                    }
                });

                // Mode toggle
                dom.modeToggle.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    const mode = btn.getAttribute('data-mode');
                    if (mode && mode !== state.mode) {
                        state.mode = mode;
                        updateUIForMode();
                        saveSettings();
                        refreshPreview();
                    }
                });

                // Length input
                dom.inputLength.addEventListener('input', () => {
                    let val = parseInt(dom.inputLength.value);
                    if (isNaN(val) || val < 4) val = 4;
                    if (val > 2048) val = 2048;
                    state.length = val;
                    dom.inputLength.value = val;
                    updateEffectiveLengthDisplay();
                    saveSettings();
                    refreshPreview();
                });

                // Bits input
                dom.inputBits.addEventListener('input', () => {
                    let val = parseInt(dom.inputBits.value);
                    if (isNaN(val) || val < 64) val = 64;
                    if (val > 2048) val = 2048;
                    // Round to nearest multiple of 8
                    val = Math.round(val / 8) * 8;
                    if (val < 64) val = 64;
                    state.bits = val;
                    dom.inputBits.value = val;
                    updateEffectiveLengthDisplay();
                    updateBitsPresets();
                    saveSettings();
                    refreshPreview();
                });

                // Bits presets
                dom.bitsPresets.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    const bits = parseInt(btn.getAttribute('data-bits'));
                    if (!isNaN(bits)) {
                        state.bits = bits;
                        dom.inputBits.value = bits;
                        updateEffectiveLengthDisplay();
                        updateBitsPresets();
                        saveSettings();
                        refreshPreview();
                    }
                });

                // Charset checkboxes
                [dom.chkLetters, dom.chkNumbers, dom.chkSymbols, dom.chkExcludeSimilar].forEach(chk => {
                    chk.addEventListener('change', () => {
                        state.charsetLetters = dom.chkLetters.checked;
                        state.charsetNumbers = dom.chkNumbers.checked;
                        state.charsetSymbols = dom.chkSymbols.checked;
                        state.excludeSimilar = dom.chkExcludeSimilar.checked;
                        saveSettings();
                        refreshPreview();
                    });
                });

                // Custom charset
                dom.inputCustomCharset.addEventListener('input', () => {
                    state.customCharset = dom.inputCustomCharset.value;
                    saveSettings();
                    refreshPreview();
                });

                // Prefix
                dom.inputPrefix.addEventListener('input', () => {
                    state.prefix = dom.inputPrefix.value;
                    saveSettings();
                    refreshPreview();
                });

                // Key type
                dom.selectKeyType.addEventListener('change', () => {
                    state.keyType = dom.selectKeyType.value;
                    saveSettings();
                    refreshPreview();
                });

                // Environment
                dom.selectEnv.addEventListener('change', () => {
                    state.environment = dom.selectEnv.value;
                    saveSettings();
                    refreshPreview();
                });

                // Separator
                dom.chkSeparator.addEventListener('change', () => {
                    state.separator = dom.chkSeparator.checked;
                    saveSettings();
                    refreshPreview();
                });

                // Random mode
                dom.randomToggle.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    const mode = btn.getAttribute('data-random');
                    if (mode && mode !== state.randomMode) {
                        state.randomMode = mode;
                        updateUIForRandom();
                        saveSettings();
                        refreshPreview();
                        // Reset crypto buffer on mode switch
                        cryptoBufferIndex = 1024;
                    }
                });

                // Count
                dom.inputCount.addEventListener('input', () => {
                    let val = parseInt(dom.inputCount.value);
                    if (isNaN(val) || val < 1) val = 1;
                    if (val > 500000) val = 500000;
                    state.count = val;
                    dom.inputCount.value = val;
                    saveSettings();
                });

                // Format
                dom.selectFormat.addEventListener('change', () => {
                    state.downloadFormat = dom.selectFormat.value;
                    saveSettings();
                });

                // Generate button
                dom.btnGenerate.addEventListener('click', () => {
                    doGenerateAndDownload();
                });

                // Stop button
                dom.btnStop.addEventListener('click', () => {
                    state.cancelRequested = true;
                    terminateWorker();
                    // The generation loop will detect cancelRequested and show the modal
                });

                // Preview button
                dom.btnPreview.addEventListener('click', () => {
                    refreshPreview();
                });

                // Download row buttons
                dom.downloadRow.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    const fmt = btn.getAttribute('data-fmt');
                    if (fmt && state.generatedKeys.length > 0) {
                        triggerDownload(state.generatedKeys, fmt);
                    }
                });
            }

            function initUIFromState() {
                dom.inputLength.value = state.length;
                dom.inputBits.value = state.bits;
                dom.chkLetters.checked = state.charsetLetters;
                dom.chkNumbers.checked = state.charsetNumbers;
                dom.chkSymbols.checked = state.charsetSymbols;
                dom.chkExcludeSimilar.checked = state.excludeSimilar;
                dom.inputCustomCharset.value = state.customCharset;
                dom.inputPrefix.value = state.prefix;
                dom.selectKeyType.value = state.keyType;
                dom.selectEnv.value = state.environment;
                dom.chkSeparator.checked = state.separator;
                dom.inputCount.value = state.count;
                dom.selectFormat.value = state.downloadFormat;
                updateUIForMode();
                updateUIForRandom();
                updateEffectiveLengthDisplay();
                updateBitsPresets();
            }

            function init() {
                loadSettings();
                initUIFromState();
                applyI18n();
                bindEvents();
                refreshPreview();
                // Reset crypto buffer
                cryptoBufferIndex = 1024;
            }

            init();
        })();
    </script>
</body>
</html>
