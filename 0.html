<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Key Generator v4.0</title>

<style>

/* =========================
   🔥 BASE
========================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: #0b0f1a;
  color: #fff;
  padding: 16px;
}

/* =========================
   📦 CARD
========================= */

.card {
  max-width: 520px;
  margin: auto;
  background: rgba(255,255,255,0.04);
  border-radius: 20px;
  padding: 18px;
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
}

/* =========================
   📝 TEXT
========================= */

h1 {
  font-size: 20px;
  margin-bottom: 6px;
}

.sub {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 16px;
}

/* =========================
   🔘 SEGMENT
========================= */

.segment {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.segment button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-weight: 500;
}

.segment button.active {
  background: linear-gradient(135deg, #4f7cff, #7aa2ff);
}

/* =========================
   🧾 INPUT
========================= */

.input, select {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  margin-bottom: 12px;
  font-size: 16px;
}

/* =========================
   ⚙️ OPTIONS
========================= */

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.options label {
  font-size: 14px;
}

/* =========================
   🔘 BUTTONS
========================= */

.button {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  margin-top: 8px;
  background: linear-gradient(135deg, #4f7cff, #6f9cff);
}

.stop {
  background: linear-gradient(135deg, #ff4d4d, #ff6b6b);
}

/* =========================
   📊 STATUS
========================= */

.status {
  text-align: center;
  font-size: 13px;
  margin-top: 10px;
  color: #aaa;
}

/* =========================
   👀 PREVIEW
========================= */

.preview {
  margin-top: 10px;
  padding: 10px;
  background: rgba(0,0,0,0.4);
  border-radius: 10px;
  max-height: 180px;
  overflow: auto;
  font-size: 12px;
}

/* =========================
   📱 MOBILE FIX
========================= */

input {
  font-size: 16px;
}

</style>
</head>

<body>

<div class="card">

<h1 id="title">API Key Generator</h1>
<div class="sub">Secure key generation tool</div>

<!-- LANGUAGE -->
<div class="segment">
<button id="ruBtn" class="active">RU</button>
<button id="enBtn">EN</button>
</div>

<!-- MODE -->
<div class="segment">
<button id="bitsBtn" class="active">Bits</button>
<button id="lengthBtn">Length</button>
</div>

<!-- BIT SELECT -->
<select id="bitsSelect">
<option>64</option>
<option>128</option>
<option selected>256</option>
<option>512</option>
<option>1024</option>
<option>2048</option>
</select>

<input id="lengthInput" class="input" value="32" style="display:none">

<!-- COUNT -->
<input id="countInput" class="input" value="1000">

<!-- FORMAT -->
<select id="formatSelect">
<option value="txt">TXT</option>
<option value="csv">CSV</option>
<option value="json">JSON</option>
</select>

<!-- OPTIONS -->
<div class="options">
<label><input type="checkbox" id="letters" checked> Letters</label>
<label><input type="checkbox" id="digits" checked> Digits</label>
<label><input type="checkbox" id="symbols"> Symbols</label>
<label><input type="checkbox" id="exclude"> Exclude similar</label>
<label><input type="checkbox" id="dash"> Use dashes</label>
<label><input type="checkbox" id="gzip"> GZIP</label>
</div>

<input id="customCharset" class="input" placeholder="Custom charset">

<!-- MODE -->
<div class="segment">
<button id="cryptoBtn" class="active">Crypto</button>
<button id="fastBtn">Fast</button>
</div>

<!-- ACTION -->
<button id="previewBtn" class="button">Preview</button>
<button id="copyBtn" class="button">Copy</button>
<button id="generateBtn" class="button">Generate</button>
<button id="stopBtn" class="button stop">STOP</button>

<div id="status" class="status"></div>
<div id="preview" class="preview"></div>

</div>

<!-- JS БУДЕТ ДАЛЬШЕ -->
<script>

/* =========================
   🧠 STATE
========================= */

let mode = "crypto";
let lengthMode = "bits";
let stopRequested = false;
let currentLang = "ru";

/* =========================
   🔘 ELEMENTS
========================= */

const bitsSelect = document.getElementById("bitsSelect");
const lengthInput = document.getElementById("lengthInput");
const countInput = document.getElementById("countInput");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

/* =========================
   🔄 MODE SWITCH
========================= */

bitsBtn.onclick = () => {
    lengthMode = "bits";
    bitsSelect.style.display = "block";
    lengthInput.style.display = "none";
    bitsBtn.classList.add("active");
    lengthBtn.classList.remove("active");
};

lengthBtn.onclick = () => {
    lengthMode = "length";
    bitsSelect.style.display = "none";
    lengthInput.style.display = "block";
    lengthBtn.classList.add("active");
    bitsBtn.classList.remove("active");
};

/* =========================
   🔐 MODE SWITCH (SAFE)
========================= */

let fastWarned = localStorage.getItem("fastWarned");

function showFastWarning(){
    if(fastWarned) return;

    const modal = document.createElement("div");
    modal.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;">
        <div style="background:#111;padding:20px;border-radius:16px;max-width:320px;text-align:center;">
            <h2 style="color:red;font-weight:700;">ВАЖНО!!!</h2>
            <p style="font-size:13px;margin:10px 0;">
            Fast mode использует Math.random и НЕ является безопасным.
            Используй только для тестов.
            </p>
            <button id="closeWarn" class="button">Понятно</button>
        </div>
    </div>
    `;
    document.body.appendChild(modal);

    document.getElementById("closeWarn").onclick = () => {
        modal.remove();
        localStorage.setItem("fastWarned", "1");
    };
}

cryptoBtn.onclick = () => {
    mode = "crypto";
    cryptoBtn.classList.add("active");
    fastBtn.classList.remove("active");
};

fastBtn.onclick = () => {
    mode = "fast";
    fastBtn.classList.add("active");
    cryptoBtn.classList.remove("active");
    showFastWarning();
};

/* =========================
   🔢 LENGTH
========================= */

function getLength(){
    if(lengthMode === "bits"){
        return Math.floor(parseInt(bitsSelect.value) / 6);
    }
    return parseInt(lengthInput.value) || 32;
}

/* =========================
   🔤 CHARSET
========================= */

function getCharset(){
    let base = "";

    if(letters.checked) base += "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if(digits.checked) base += "0123456789";
    if(symbols.checked) base += "!@#$%^&*";

    let custom = customCharset.value.trim();

    if(custom){
        return custom;
    }

    if(exclude.checked){
        base = base.replace(/[0Ool1I]/g, "");
    }

    return base || "abcdefghijklmnopqrstuvwxyz0123456789";
}

/* =========================
   🔐 RANDOM
========================= */

function secureRandom(max){
    const arr = new Uint32Array(1);
    const limit = Math.floor(4294967296 / max) * max;

    while(true){
        crypto.getRandomValues(arr);
        if(arr[0] < limit) return arr[0] % max;
    }
}

function rand(max){
    if(mode === "crypto") return secureRandom(max);
    return Math.floor(Math.random() * max);
}

/* =========================
   🔑 GENERATE KEY
========================= */

function generateKey(length, charset){

    let res = "";
    for(let i=0;i<length;i++){
        res += charset[rand(charset.length)];
    }

    if(dash.checked){
        res = res.match(/.{1,4}/g).join("-");
    }

    return res;
}

/* =========================
   ⚠️ VALIDATION
========================= */

countInput.oninput = () => {
    countInput.value = countInput.value.replace(/\D/g,"");
};

/* =========================
   👀 PREVIEW
========================= */

previewBtn.onclick = () => {

    let len = getLength();
    let charset = getCharset();

    let arr = [];

    for(let i=0;i<100;i++){
        arr.push(generateKey(len, charset));
    }

    preview.innerText = arr.join("\n");
};

/* =========================
   📋 COPY
========================= */

copyBtn.onclick = () => {

    if(!preview.innerText){
        copyBtn.innerText = "Empty";
        return;
    }

    navigator.clipboard.writeText(preview.innerText);

    copyBtn.innerText = "Copied";

    setTimeout(()=>{
        copyBtn.innerText = currentLang === "ru" ? "Скопировать" : "Copy";
    },1000);
};

/* =========================
   ⛔ STOP
========================= */

stopBtn.onclick = () => {
    stopRequested = true;
    status.innerText = "Stopped";
};

</script>
<script>

/* =========================
   📊 UTILS
========================= */

function estimateSize(count, len){
    return ((count * (len + 1)) / (1024*1024)).toFixed(1);
}

/* =========================
   ⚠️ WARNING
========================= */

function confirmLarge(count, len){
    if(count > 250000){
        return confirm(`Large file (~${estimateSize(count,len)} MB). Continue?`);
    }
    return true;
}

/* =========================
   📁 WRITER
========================= */

async function createWriter(filename){

    // ПК (реальный стриминг)
    if(window.showSaveFilePicker){
        const handle = await showSaveFilePicker({
            suggestedName: filename
        });

        const writable = await handle.createWritable();

        return {
            write: chunk => writable.write(chunk),
            close: () => writable.close(),
            real: true
        };
    }

    // iPhone fallback
    let parts = [];

    return {
        write: chunk => parts.push(chunk),
        close: () => parts
    };
}

/* =========================
   🚀 GENERATE
========================= */

generateBtn.onclick = async () => {

    stopRequested = false;

    let count = parseInt(countInput.value);
    let len = getLength();
    let charset = getCharset();
    let format = formatSelect.value;
    let gzip = document.getElementById("gzip").checked;

    if(!count || count <= 0){
        status.innerText = "Invalid count";
        return;
    }

    if(!confirmLarge(count, len)) return;

    status.innerText = "Preparing...";

    const writer = await createWriter(`keys.${format}`);

    if(format === "csv") await writer.write("key\n");
    if(format === "json") await writer.write("[\n");

    let chunk = [];
    let chunkSize = 5000;
    let first = true;

    let start = performance.now();

    for(let i=0;i<count;i++){

        if(stopRequested){
            status.innerText = "Stopped";
            return;
        }

        let key = generateKey(len, charset);

        if(format === "json"){
            let row = JSON.stringify(key);
            if(!first) row = ",\n" + row;
            chunk.push(row);
            first = false;
        } else {
            chunk.push(key + "\n");
        }

        if(chunk.length >= chunkSize){

            await writer.write(chunk.join(""));
            chunk = [];

            let elapsed = (performance.now() - start) / 1000;
            let speed = Math.floor(i / elapsed);
            let percent = ((i / count) * 100).toFixed(1);

            status.innerText = `${percent}% • ${i}/${count} • ${speed}/s`;

            await new Promise(r => setTimeout(r, 0));
        }
    }

    if(chunk.length){
        await writer.write(chunk.join(""));
    }

    if(format === "json"){
        await writer.write("\n]");
    }

    let result = await writer.close();

    /* =========================
       📦 DOWNLOAD (iPhone)
    ========================= */

    if(Array.isArray(result)){

        let blob = new Blob(result, { type: "text/plain" });

        // gzip
        if(gzip && window.CompressionStream){
            const cs = new CompressionStream("gzip");
            const stream = blob.stream().pipeThrough(cs);
            blob = await new Response(stream).blob();
        }

        let url = URL.createObjectURL(blob);

        let a = document.createElement("a");
        a.href = url;
        a.download = gzip
            ? `keys.${format}.gz`
            : `keys.${format}`;

        a.click();

        URL.revokeObjectURL(url);
    }

    status.innerText = "Done";
};

</script>
<script>

/* =========================
   🌍 FULL I18N (ВСЁ)
========================= */

const i18n = {
    ru: {
        title: "Генератор API ключей",
        preview: "Предпросмотр",
        copy: "Скопировать",
        copied: "Скопировано",
        generate: "Генерировать",
        stop: "СТОП",
        preparing: "Подготовка...",
        done: "Готово",
        stopped: "Остановлено",
        invalid: "Неверное количество",
        empty: "Нет данных",
        warning: "Большой файл",
    },
    en: {
        title: "API Key Generator",
        preview: "Preview",
        copy: "Copy",
        copied: "Copied",
        generate: "Generate",
        stop: "STOP",
        preparing: "Preparing...",
        done: "Done",
        stopped: "Stopped",
        invalid: "Invalid count",
        empty: "No data",
        warning: "Large file",
    }
};

function applyLang(){
    let t = i18n[currentLang];

    document.getElementById("title").innerText = t.title;
    previewBtn.innerText = t.preview;
    copyBtn.innerText = t.copy;
    generateBtn.innerText = t.generate;
    stopBtn.innerText = t.stop;
}

ruBtn.onclick = ()=>{
    currentLang = "ru";
    applyLang();
};

enBtn.onclick = ()=>{
    currentLang = "en";
    applyLang();
};

applyLang();

/* =========================
   🔔 CUSTOM NOTIFICATIONS
========================= */

function notify(text){

    const n = document.createElement("div");
    n.innerText = text;

    n.style = `
        position:fixed;
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        background:#111;
        padding:12px 18px;
        border-radius:12px;
        font-size:13px;
        box-shadow:0 10px 30px rgba(0,0,0,0.5);
        z-index:9999;
    `;

    document.body.appendChild(n);

    setTimeout(()=>{
        n.remove();
    },2000);
}

/* =========================
   📋 COPY UX FIX
========================= */

copyBtn.onclick = () => {

    if(!preview.innerText){
        notify(i18n[currentLang].empty);
        return;
    }

    navigator.clipboard.writeText(preview.innerText);

    notify(i18n[currentLang].copied);
};

/* =========================
   ⚠️ WARNING UX (NO ALERT)
========================= */

function confirmLargeUX(count, len){

    if(count < 250000) return Promise.resolve(true);

    return new Promise(res => {

        const modal = document.createElement("div");

        modal.innerHTML = `
        <div style="
            position:fixed; inset:0;
            background:rgba(0,0,0,0.7);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:9999;
        ">
            <div style="
                background:#111;
                padding:20px;
                border-radius:16px;
                width:280px;
                text-align:center;
            ">
                <h3 style="color:#ff5555;">⚠ ${i18n[currentLang].warning}</h3>
                <p style="font-size:13px;margin:10px 0;">
                ~ ${estimateSize(count,len)} MB
                </p>
                <button id="okLarge" class="button">OK</button>
            </div>
        </div>
        `;

        document.body.appendChild(modal);

        document.getElementById("okLarge").onclick = ()=>{
            modal.remove();
            res(true);
        };
    });
}

/* =========================
   🎨 THEMES (НОРМАЛЬНЫЕ)
========================= */

const themes = {
    dark: {
        bg: "#0b0f1a",
        card: "rgba(255,255,255,0.04)",
        text: "#fff"
    },
    light: {
        bg: "#f5f5f5",
        card: "#ffffff",
        text: "#111"
    },
    neon: {
        bg: "#050510",
        card: "rgba(0,255,200,0.05)",
        text: "#0ff"
    }
};

let theme = "dark";

function applyTheme(){

    let t = themes[theme];

    document.body.style.background = t.bg;
    document.body.style.color = t.text;

    document.querySelector(".card").style.background = t.card;
}

/* UI кнопки тем */
const themeUI = document.createElement("div");
themeUI.className = "segment";
themeUI.innerHTML = `
<button onclick="setTheme('dark')">Dark</button>
<button onclick="setTheme('light')">Light</button>
<button onclick="setTheme('neon')">Neon</button>
`;

document.querySelector(".card").prepend(themeUI);

function setTheme(t){
    theme = t;
    applyTheme();
}

applyTheme();

/* =========================
   🔥 GENERATE PATCH
========================= */

const oldGenerate = generateBtn.onclick;

generateBtn.onclick = async () => {

    let count = parseInt(countInput.value);
    let len = getLength();

    if(!count){
        notify(i18n[currentLang].invalid);
        return;
    }

    let ok = await confirmLargeUX(count, len);
    if(!ok) return;

    status.innerText = i18n[currentLang].preparing;

    await oldGenerate();

    status.innerText = i18n[currentLang].done;
};

</script>
<script>

/* =========================
   ⚡ WEB WORKER (ГЕНЕРАЦИЯ)
========================= */

function createWorker(){

    const code = `
    self.onmessage = function(e){

        const { length, charset, chunkSize, dash } = e.data;

        function secureRandom(max){
            const arr = new Uint32Array(1);
            const limit = Math.floor(4294967296 / max) * max;
            while(true){
                crypto.getRandomValues(arr);
                if(arr[0] < limit) return arr[0] % max;
            }
        }

        function gen(len, charset){
            let r="";
            for(let i=0;i<len;i++){
                r+=charset[secureRandom(charset.length)];
            }

            if(${true} && dash){
                r = r.match(/.{1,4}/g).join("-");
            }

            return r;
        }

        let out = [];

        for(let i=0;i<chunkSize;i++){
            out.push(gen(length, charset));
        }

        postMessage(out);
    }
    `;

    const blob = new Blob([code], {type:"application/javascript"});
    return new Worker(URL.createObjectURL(blob));
}

/* =========================
   💾 SAVE SETTINGS
========================= */

function saveSettings(){

    const s = {
        bits: bitsSelect.value,
        length: lengthInput.value,
        count: countInput.value,
        format: formatSelect.value,
        dash: dash.checked,
        gzip: gzip.checked,
        letters: letters.checked,
        digits: digits.checked,
        symbols: symbols.checked,
        exclude: exclude.checked,
        custom: customCharset.value,
        lang: currentLang,
        theme
    };

    localStorage.setItem("gen_v4", JSON.stringify(s));
}

function loadSettings(){

    let raw = localStorage.getItem("gen_v4");
    if(!raw) return;

    let s = JSON.parse(raw);

    bitsSelect.value = s.bits || 256;
    lengthInput.value = s.length || 32;
    countInput.value = s.count || 1000;

    formatSelect.value = s.format || "txt";

    dash.checked = s.dash;
    gzip.checked = s.gzip;

    letters.checked = s.letters;
    digits.checked = s.digits;
    symbols.checked = s.symbols;
    exclude.checked = s.exclude;

    customCharset.value = s.custom || "";

    currentLang = s.lang || "ru";
    theme = s.theme || "dark";

    applyLang();
    applyTheme();
}

document.querySelectorAll("input, select").forEach(el=>{
    el.addEventListener("change", saveSettings);
});

loadSettings();

/* =========================
   📁 REAL STREAM WRITER
========================= */

async function createRealWriter(filename){

    if(window.showSaveFilePicker){

        const handle = await showSaveFilePicker({
            suggestedName: filename
        });

        const writable = await handle.createWritable();

        return {
            write: chunk => writable.write(chunk),
            close: () => writable.close(),
            real: true
        };
    }

    let parts = [];

    return {
        write: chunk => parts.push(chunk),
        close: () => parts
    };
}

/* =========================
   🚀 ULTRA GENERATION
========================= */

generateBtn.onclick = async () => {

    stopRequested = false;

    let count = parseInt(countInput.value);
    let len = getLength();
    let charset = getCharset();
    let format = formatSelect.value;
    let useGzip = gzip.checked;

    if(!count){
        notify("Invalid");
        return;
    }

    let writer = await createRealWriter(`keys.${format}`);

    // UI lock
    generateBtn.disabled = true;
    generateBtn.innerText = "...";

    let worker = createWorker();

    let produced = 0;
    let chunkSize = 2000;

    let start = performance.now();

    worker.onmessage = async (e)=>{

        if(stopRequested){
            worker.terminate();
            generateBtn.disabled = false;
            generateBtn.innerText = i18n[currentLang].generate;
            return;
        }

        let chunk = e.data;

        let out = chunk.join("\n") + "\n";

        await writer.write(out);

        produced += chunk.length;

        let elapsed = (performance.now() - start)/1000;
        let speed = Math.floor(produced/elapsed);

        status.innerText = `${produced}/${count} • ${speed}/s`;

        if(produced >= count){

            let result = await writer.close();

            // fallback download
            if(Array.isArray(result)){

                let blob = new Blob(result, {type:"text/plain"});

                if(useGzip && window.CompressionStream){
                    const cs = new CompressionStream("gzip");
                    const stream = blob.stream().pipeThrough(cs);
                    blob = await new Response(stream).blob();
                }

                let url = URL.createObjectURL(blob);

                let a = document.createElement("a");
                a.href = url;
                a.download = useGzip
                    ? `keys.${format}.gz`
                    : `keys.${format}`;

                a.click();
                URL.revokeObjectURL(url);
            }

            worker.terminate();

            generateBtn.disabled = false;
            generateBtn.innerText = i18n[currentLang].generate;

            status.innerText = i18n[currentLang].done;
            return;
        }

        worker.postMessage({
            length: len,
            charset,
            chunkSize,
            dash: dash.checked
        });
    };

    worker.postMessage({
        length: len,
        charset,
        chunkSize,
        dash: dash.checked
    });
};

/* =========================
   ⛔ STOP FIX
========================= */

stopBtn.onclick = ()=>{
    stopRequested = true;
    status.innerText = i18n[currentLang].stopped;
};

</script>
