<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <title>TheDuo Tools</title>
  <style>
    :root{
      --bg1:#08111f;
      --bg2:#0d1730;
      --bg3:#101b38;
      --panel:rgba(12,18,33,.72);
      --panel-2:rgba(15,24,44,.82);
      --panel-3:rgba(20,30,52,.92);
      --text:#f5f7ff;
      --muted:#9aa8c7;
      --muted-2:#7181a4;
      --border:rgba(145,174,255,.16);
      --border-2:rgba(145,174,255,.26);
      --shadow:0 24px 60px rgba(0,0,0,.34);
      --shadow-soft:0 12px 30px rgba(0,0,0,.18);
      --accent:#7c5cff;
      --accent-2:#00e5ff;
      --accent-3:#24f6a4;
      --danger:#ff5d8f;
      --warn:#ffcc66;
      --radius:22px;
      --radius-sm:16px;
      --radius-xs:12px;
      --header-h:82px;
      --sidebar-w:288px;
      --scrollbar:10px;
      --ease:cubic-bezier(.2,.9,.2,1);
    }

    body[data-theme="light-glass"]{
      --bg1:#edf2ff;
      --bg2:#f8fbff;
      --bg3:#eef3ff;
      --panel:rgba(255,255,255,.72);
      --panel-2:rgba(255,255,255,.86);
      --panel-3:rgba(255,255,255,.95);
      --text:#13213a;
      --muted:#5f6d86;
      --muted-2:#7a879a;
      --border:rgba(68,101,160,.14);
      --border-2:rgba(68,101,160,.22);
      --shadow:0 24px 60px rgba(36,58,95,.14);
      --shadow-soft:0 12px 30px rgba(36,58,95,.08);
      --accent:#684dff;
      --accent-2:#0bb1ff;
      --accent-3:#11b883;
      --danger:#e34b6a;
      --warn:#e2a836;
    }

    body[data-theme="purple-cyber"]{
      --bg1:#090617;
      --bg2:#140927;
      --bg3:#1d0f34;
      --panel:rgba(20,10,38,.74);
      --panel-2:rgba(28,14,54,.86);
      --panel-3:rgba(36,18,68,.94);
      --text:#fbf8ff;
      --muted:#b8a8dd;
      --muted-2:#8b79b5;
      --border:rgba(205,176,255,.16);
      --border-2:rgba(205,176,255,.26);
      --shadow:0 24px 60px rgba(0,0,0,.42);
      --shadow-soft:0 12px 30px rgba(0,0,0,.22);
      --accent:#c15cff;
      --accent-2:#6c7bff;
      --accent-3:#31f3c9;
      --danger:#ff6ea8;
      --warn:#ffc76c;
    }

    body[data-theme="emerald-matrix"]{
      --bg1:#071510;
      --bg2:#0c2019;
      --bg3:#102a20;
      --panel:rgba(8,26,19,.74);
      --panel-2:rgba(11,35,25,.86);
      --panel-3:rgba(13,45,31,.94);
      --text:#effff6;
      --muted:#9dd6b7;
      --muted-2:#76ae94;
      --border:rgba(145,255,201,.16);
      --border-2:rgba(145,255,201,.26);
      --shadow:0 24px 60px rgba(0,0,0,.38);
      --shadow-soft:0 12px 30px rgba(0,0,0,.2);
      --accent:#25d37d;
      --accent-2:#42ffd3;
      --accent-3:#9cff5c;
      --danger:#ff6d8c;
      --warn:#ffe27c;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% 10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
        radial-gradient(900px 500px at 85% 14%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 60%),
        radial-gradient(900px 560px at 50% 100%, color-mix(in srgb, var(--accent-3) 10%, transparent), transparent 64%),
        linear-gradient(135deg,var(--bg1),var(--bg2) 46%,var(--bg3));
      overflow:hidden;
      min-width:320px;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      inset:auto;
      pointer-events:none;
      z-index:0;
      mix-blend-mode:screen;
    }

    body::before{
      width:42vw;height:42vw;left:-14vw;top:-10vw;
      background:radial-gradient(circle, color-mix(in srgb, var(--accent) 24%, transparent), transparent 62%);
      filter:blur(30px);
      opacity:.55;
      animation: floatGlow 18s var(--ease) infinite alternate;
    }
    body::after{
      width:40vw;height:40vw;right:-14vw;bottom:-12vw;
      background:radial-gradient(circle, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 64%);
      filter:blur(38px);
      opacity:.48;
      animation: floatGlow 20s var(--ease) infinite alternate-reverse;
    }

    @keyframes floatGlow{
      from{transform:translate3d(0,0,0) scale(1)}
      to{transform:translate3d(2vw,2vh,0) scale(1.08)}
    }

    #bgCanvas{
      position:fixed;
      inset:0;
      z-index:0;
      width:100%;
      height:100%;
      pointer-events:none;
      opacity:.8;
    }

    .app{
      position:relative;
      z-index:1;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    .header{
      height:var(--header-h);
      padding:14px 16px;
      display:flex;
      align-items:center;
      gap:14px;
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(22px) saturate(1.2);
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 92%, transparent), color-mix(in srgb, var(--panel) 82%, transparent));
      border-bottom:1px solid var(--border);
      box-shadow:var(--shadow-soft);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:220px;
      flex:0 0 auto;
    }
    .brandMark{
      width:46px;height:46px;border-radius:16px;
      display:grid;place-items:center;
      background:
        radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 55%),
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 95%, white 5%), color-mix(in srgb, var(--accent-2) 72%, black 28%));
      color:white;
      box-shadow:0 12px 28px color-mix(in srgb, var(--accent) 28%, transparent);
      border:1px solid color-mix(in srgb, white 18%, transparent);
      font-weight:900;
      letter-spacing:.04em;
    }
    .brandText{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .brandText strong{
      font-size:1.02rem;
      line-height:1.1;
      letter-spacing:-.02em;
    }
    .brandText span{
      font-size:.8rem;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .searchWrap{
      position:relative;
      flex:1 1 auto;
      max-width:700px;
      min-width:0;
      margin-inline:auto;
    }
    .searchIcon{
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      width:18px;height:18px;
      color:var(--muted);
      pointer-events:none;
      opacity:.95;
    }
    .searchInput{
      width:100%;
      height:52px;
      padding:0 42px 0 42px;
      border-radius:16px;
      border:1px solid var(--border);
      outline:none;
      background:color-mix(in srgb, var(--panel-2) 86%, transparent);
      color:var(--text);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      transition:transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
    }
    .searchInput::placeholder{color:color-mix(in srgb, var(--muted) 90%, transparent)}
    .searchInput:focus{
      border-color:color-mix(in srgb, var(--accent) 42%, var(--border));
      box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent), inset 0 1px 0 rgba(255,255,255,.04);
      transform:translateY(-1px);
    }
    .searchClear{
      position:absolute;
      right:10px;top:50%;
      transform:translateY(-50%);
      width:30px;height:30px;
      border:none;border-radius:10px;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      transition:background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
    }
    .searchClear:hover{background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--text); transform:translateY(-50%) scale(1.05)}
    .searchClear:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

    .headerActions{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
      margin-left:auto;
    }
    .select{
      height:52px;
      border-radius:16px;
      padding:0 14px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-2) 92%, transparent);
      color:var(--text);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
      outline:none;
      cursor:pointer;
      transition:border-color .2s var(--ease), transform .2s var(--ease), background .2s var(--ease);
    }
    .select:hover{transform:translateY(-1px); border-color:var(--border-2)}
    .select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

    .iconBtn, .pillBtn, .ghostBtn, .openBtn, .favBtn, .chipBtn, .sideBtn{
      border:none;
      outline:none;
      cursor:pointer;
      transition:transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), opacity .2s var(--ease);
      font:inherit;
      color:inherit;
    }

    .iconBtn{
      width:52px;height:52px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:color-mix(in srgb, var(--panel-2) 88%, transparent);
      border:1px solid var(--border);
      box-shadow:var(--shadow-soft);
    }
    .iconBtn:hover{transform:translateY(-1px); border-color:var(--border-2); box-shadow:0 16px 28px rgba(0,0,0,.12)}
    .iconBtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

    .toolCount{
      display:flex;
      align-items:center;
      gap:8px;
      height:52px;
      padding:0 14px;
      border-radius:16px;
      border:1px solid var(--border);
      background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, var(--panel-2)), color-mix(in srgb, var(--accent-2) 10%, var(--panel-2)));
      box-shadow:var(--shadow-soft);
      white-space:nowrap;
      font-weight:700;
    }
    .toolCount small{
      font-weight:600;
      color:var(--muted);
    }

    .menuBtn{display:none}

    .layout{
      display:grid;
      grid-template-columns:var(--sidebar-w) 1fr;
      min-height:0;
      flex:1 1 auto;
    }

    .sidebar{
      min-height:0;
      padding:18px 14px 18px 16px;
      border-right:1px solid var(--border);
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 92%, transparent), color-mix(in srgb, var(--panel) 78%, transparent));
      backdrop-filter:blur(22px) saturate(1.15);
      overflow:auto;
      scrollbar-width:thin;
      scrollbar-color:var(--border) transparent;
    }
    .sidebar::-webkit-scrollbar, .main::-webkit-scrollbar{width:var(--scrollbar);height:var(--scrollbar)}
    .sidebar::-webkit-scrollbar-thumb, .main::-webkit-scrollbar-thumb{
      background:color-mix(in srgb, var(--border-2) 80%, transparent);
      border-radius:999px;
      border:2px solid transparent;
      background-clip:padding-box;
    }

    .sideSection{
      margin-bottom:18px;
      padding:16px;
      border-radius:var(--radius);
      border:1px solid var(--border);
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 90%, transparent), color-mix(in srgb, var(--panel) 84%, transparent));
      box-shadow:var(--shadow-soft);
    }

    .sideTitle{
      margin:0 0 12px 0;
      font-size:.78rem;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:var(--muted);
    }

    .sideBtn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:13px 14px;
      margin-bottom:10px;
      border-radius:16px;
      background:transparent;
      border:1px solid transparent;
      color:var(--text);
      text-align:left;
    }
    .sideBtn:last-child{margin-bottom:0}
    .sideBtn:hover{
      background:color-mix(in srgb, var(--accent) 10%, transparent);
      border-color:color-mix(in srgb, var(--accent) 22%, transparent);
      transform:translateX(2px);
    }
    .sideBtn.active{
      background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 24%, transparent), color-mix(in srgb, var(--accent-2) 14%, transparent));
      border-color:color-mix(in srgb, var(--accent) 38%, transparent);
      box-shadow:0 12px 28px color-mix(in srgb, var(--accent) 15%, transparent);
    }
    .sideBtn span:last-child{
      color:var(--muted);
      font-size:.86rem;
    }

    .favFilter{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      width:100%;
      padding:13px 14px;
      margin-bottom:10px;
      border-radius:16px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-3) 82%, transparent);
    }
    .favFilter.active{
      border-color:color-mix(in srgb, var(--accent) 40%, var(--border));
      background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--panel-3)), color-mix(in srgb, var(--accent-2) 12%, var(--panel-3)));
      box-shadow:0 10px 24px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .sidebarNote{
      margin:14px 0 0;
      color:var(--muted);
      font-size:.92rem;
      line-height:1.55;
    }

    .main{
      min-height:0;
      overflow:auto;
      padding:20px 20px 28px 20px;
      scrollbar-width:thin;
      scrollbar-color:var(--border) transparent;
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(0,1.3fr) minmax(240px,.95fr);
      gap:18px;
      align-items:stretch;
      padding:22px;
      margin-bottom:18px;
      border-radius:28px;
      border:1px solid var(--border);
      background:
        radial-gradient(1000px 240px at 8% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 55%),
        radial-gradient(900px 240px at 100% 0%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 52%),
        linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 92%, transparent), color-mix(in srgb, var(--panel) 82%, transparent));
      box-shadow:var(--shadow);
      backdrop-filter:blur(24px) saturate(1.15);
      position:relative;
      overflow:hidden;
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:auto -12% -30% auto;
      width:300px;height:300px;
      border-radius:50%;
      background:radial-gradient(circle, color-mix(in srgb, var(--accent-3) 20%, transparent), transparent 62%);
      filter:blur(8px);
      opacity:.5;
      pointer-events:none;
    }
    .eyebrow{
      margin:0 0 10px 0;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-3) 70%, transparent);
      color:var(--muted);
      font-size:.82rem;
      letter-spacing:.06em;
      text-transform:uppercase;
      width:max-content;
    }
    .hero h1{
      margin:0;
      font-size:clamp(1.75rem, 3vw, 3.1rem);
      line-height:1.02;
      letter-spacing:-.04em;
      max-width:14ch;
    }
    .hero p{
      margin:12px 0 0 0;
      color:var(--muted);
      max-width:60ch;
      line-height:1.65;
      font-size:1rem;
    }

    .heroMeta{
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:stretch;
      justify-content:space-between;
    }
    .resumeWrap{
      display:flex;
      justify-content:flex-end;
    }
    .resumeBtn{
      min-height:48px;
      padding:0 16px;
      border-radius:16px;
      border:1px solid color-mix(in srgb, var(--accent) 32%, var(--border));
      background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 26%, var(--panel-3)), color-mix(in srgb, var(--accent-2) 12%, var(--panel-3)));
      color:var(--text);
      box-shadow:0 14px 28px color-mix(in srgb, var(--accent) 16%, transparent);
      font-weight:800;
      letter-spacing:-.01em;
      display:inline-flex;
      align-items:center;
      gap:10px;
    }
    .resumeBtn:hover{transform:translateY(-1px)}
    .resumeBtn.hidden{display:none}

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }
    .stat{
      padding:14px 14px 12px;
      border-radius:18px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-3) 76%, transparent);
      box-shadow:var(--shadow-soft);
    }
    .stat strong{
      display:block;
      font-size:1.25rem;
      letter-spacing:-.03em;
      line-height:1.1;
    }
    .stat span{
      display:block;
      margin-top:6px;
      color:var(--muted);
      font-size:.86rem;
    }

    .recent{
      margin:0 0 18px 0;
      padding:16px 18px;
      border-radius:24px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 88%, transparent), color-mix(in srgb, var(--panel) 84%, transparent));
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(20px);
    }
    .recentHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:12px;
    }
    .recentHead strong{
      font-size:.92rem;
      letter-spacing:-.01em;
    }
    .recentStrip{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .chipBtn{
      min-height:38px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-3) 82%, transparent);
      color:var(--text);
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:.88rem;
    }
    .chipBtn:hover{
      transform:translateY(-1px);
      border-color:color-mix(in srgb, var(--accent) 28%, var(--border));
      box-shadow:0 10px 20px rgba(0,0,0,.08);
    }

    .contentHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .contentHeader h2{
      margin:0;
      font-size:1.02rem;
      letter-spacing:-.02em;
    }
    .filterSummary{
      color:var(--muted);
      font-size:.92rem;
    }
    .clearBtn{
      min-height:40px;
      padding:0 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--text);
    }
    .clearBtn:hover{
      transform:translateY(-1px);
      border-color:color-mix(in srgb, var(--accent) 26%, var(--border));
      background:color-mix(in srgb, var(--accent) 8%, transparent);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
      gap:16px;
      align-items:stretch;
    }

    .card{
      position:relative;
      padding:18px;
      border-radius:24px;
      border:1px solid var(--border);
      background:
        radial-gradient(500px 180px at 20% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 56%),
        linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 88%, transparent), color-mix(in srgb, var(--panel) 82%, transparent));
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(20px) saturate(1.15);
      overflow:hidden;
      cursor:pointer;
      transform:translateY(0) scale(1);
      transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease), background .22s var(--ease);
      min-height:240px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      isolation:isolate;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 38%, transparent), transparent 40%, color-mix(in srgb, var(--accent-2) 24%, transparent));
      -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite:exclude;
      opacity:.72;
      pointer-events:none;
      z-index:-1;
    }
    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 24px 56px rgba(0,0,0,.18);
      border-color:color-mix(in srgb, var(--accent) 30%, var(--border));
    }
    .card:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }

    .cardTop{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:14px;
    }
    .toolIcon{
      width:56px;height:56px;
      border-radius:18px;
      display:grid;
      place-items:center;
      font-weight:900;
      letter-spacing:.02em;
      font-size:.78rem;
      background:
        radial-gradient(circle at 30% 28%, color-mix(in srgb, white 18%, transparent), transparent 48%),

      color:var(--muted);

      box-shadow:0 10px 20px color-mix(in srgb, var(--danger) 18%, transparent);

      color:var(--muted);
      font-size:.94rem;
      line-height:1.6;

      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:16px;

      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-3) 78%, transparent);
      color:var(--muted);
      font-size:.84rem;

      border-radius:14px;

      color:#fff;
      font-weight:800;
      letter-spacing:-.01em;
      box-shadow:0 14px 22px color-mix(in srgb, var(--accent) 16%, transparent);

      color:var(--muted);
      box-shadow:var(--shadow-soft);

      inset:0;
      z-index:30;

      flex-direction:column;

      pointer-events:none;
      transform:translateY(18px) scale(.985);
      transition:opacity .28s var(--ease), transform .28s var(--ease);

      opacity:1;
      pointer-events:auto;
      transform:translateY(0) scale(1);
    }

      pointer-events:none;

      height:74px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 90%, transparent), color-mix(in srgb, var(--panel) 72%, transparent));
      backdrop-filter:blur(22px) saturate(1.15);
      box-shadow:var(--shadow-soft);
    }
    .workspaceTitle{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
    }
    .workspaceTitle strong{
      font-size:1.02rem;
      letter-spacing:-.02em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .workspaceTitle span{
      font-size:.84rem;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .workspaceActions{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
    }

      min-height:46px;
      padding:0 16px;
      border-radius:14px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-2) 86%, transparent);
      color:var(--text);
      box-shadow:var(--shadow-soft);
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-weight:700;

    .frameShell{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      padding:16px;
    }
    .frameBox{
      position:relative;
      width:100%;
      height:100%;
      border-radius:28px;
      overflow:hidden;
      border:1px solid var(--border);
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 82%, transparent), color-mix(in srgb, var(--panel) 72%, transparent));

      backdrop-filter:blur(24px) saturate(1.1);

    .frameBox iframe{
      width:100%;
      height:100%;
      border:0;
      background:transparent;
    }
    .loading{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      background:linear-gradient(180deg, color-mix(in srgb, var(--panel-3) 74%, transparent), color-mix(in srgb, var(--panel) 60%, transparent));
      opacity:0;
      pointer-events:none;
      transition:opacity .2s var(--ease);
    }
    .loading.show{opacity:1; pointer-events:auto}
    .loaderCard{
      width:min(360px, 88vw);
      padding:22px;
      border-radius:24px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-2) 86%, transparent);
      box-shadow:var(--shadow);
      text-align:center;
      backdrop-filter:blur(22px);
    }
    .spinner{
      width:46px;height:46px;
      margin:0 auto 14px;
      border-radius:50%;
      border:3px solid color-mix(in srgb, var(--border-2) 68%, transparent);
      border-top-color:var(--accent);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loaderCard strong{display:block; font-size:1.02rem; margin-bottom:8px}
    .loaderCard span{color:var(--muted); font-size:.92rem; line-height:1.55}

    .toastWrap{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:50;
      display:flex;
      flex-direction:column;
      gap:10px;
      pointer-events:none;
    }
    .toast{
      min-width:240px;
      max-width:min(420px, calc(100vw - 32px));
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel-3) 88%, transparent);
      color:var(--text);
      box-shadow:var(--shadow);
      backdrop-filter:blur(20px);
      transform:translateY(10px);
      opacity:0;
      animation:toastIn .25s var(--ease) forwards, toastOut .3s var(--ease) forwards 2.8s;
    }
    .toast strong{display:block; margin-bottom:4px}
    .toast span{display:block; color:var(--muted); font-size:.9rem; line-height:1.45}
    @keyframes toastIn{to{transform:translateY(0); opacity:1}}
    @keyframes toastOut{to{transform:translateY(10px); opacity:0}}

    .mobileBackdrop{
      position:fixed;
      inset:0;
      z-index:18;
      background:rgba(0,0,0,.38);
      opacity:0;
      pointer-events:none;
      transition:opacity .22s var(--ease);
    }

    .hidden{display:none !important}

    @media (max-width: 1080px){
      .layout{grid-template-columns:1fr}
      .sidebar{
        position:fixed;
        left:0; top:var(--header-h);
        bottom:0;
        width:min(86vw, 320px);
        transform:translateX(-102%);
        transition:transform .26s var(--ease);
        z-index:19;
      }
      body.sidebar-open .sidebar{transform:translateX(0)}
      body.sidebar-open .mobileBackdrop{opacity:1; pointer-events:auto}
      .menuBtn{display:grid}
      .brand{min-width:0}
      .header{gap:10px}
      .searchWrap{max-width:none}
      .headerActions{gap:8px}
      .toolCount{display:none}
      .hero{grid-template-columns:1fr}
      .resumeWrap{justify-content:flex-start}
      .stats{grid-template-columns:repeat(3,1fr)}
      .main{padding:16px}
    }

    @media (max-width: 720px){
      :root{--header-h:74px}
      .header{padding:10px 12px}
      .brandMark{width:40px;height:40px;border-radius:14px}
      .brandText strong{font-size:.98rem}
      .brandText span{font-size:.75rem}
      .searchInput{height:46px;border-radius:14px}
      .iconBtn,.select{height:46px;border-radius:14px}
      .hero{padding:18px;border-radius:24px}
      .hero h1{max-width:none}
      .stats{grid-template-columns:1fr}
      .contentHeader{flex-direction:column; align-items:flex-start}
      .frameShell{padding:10px}
      .frameBox{border-radius:22px}
      .workspaceBar{height:auto; min-height:74px; flex-wrap:wrap}
      .workspaceActions{width:100%; justify-content:space-between}
      .ghostBtn{flex:1 1 auto; justify-content:center}
    }

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation:none !important; transition:none !important; scroll-behavior:auto !important}
      body::before, body::after{display:none}
    }

    .focusRing:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  </style>
</head>

      function initParticles() {
        const canvas = document.getElementById("bgCanvas");
        const ctx = canvas.getContext("2d", { alpha: true });
        const particles = [];
        let w = 0, h = 0, raf = 0;
        let particleColor = "";

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.width = Math.floor(innerWidth * dpr);
          h = canvas.height = Math.floor(innerHeight * dpr);
          canvas.style.width = innerWidth + "px";
          canvas.style.height = innerHeight + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const count = Math.max(18, Math.min(36, Math.round((innerWidth * innerHeight) / 60000)));
          particles.length = 0;
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * innerWidth,
              y: Math.random() * innerHeight,
              vx: (Math.random() - .5) * 0.28,
              vy: (Math.random() - .5) * 0.28,
              r: 1.2 + Math.random() * 2.8,
              a: 0.25 + Math.random() * 0.5
            });
          }
        }

        function themeParticleColor() {
          const computed = getComputedStyle(document.body);
          const accent = computed.getPropertyValue("--accent").trim() || "#7c5cff";
          const accent2 = computed.getPropertyValue("--accent-2").trim() || "#00e5ff";
          return { accent, accent2 };
        }

        function step() {
          const { accent, accent2 } = themeParticleColor();
          particleColor = accent;
          ctx.clearRect(0, 0, innerWidth, innerHeight);

          // soft wash
          const wash = ctx.createRadialGradient(innerWidth * .35, innerHeight * .18, 40, innerWidth * .35, innerHeight * .18, Math.max(innerWidth, innerHeight) * .7);
          wash.addColorStop(0, hexToRgba(accent, .06));
          wash.addColorStop(.55, "rgba(0,0,0,0)");
          wash.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = wash;
          ctx.fillRect(0, 0, innerWidth, innerHeight);

          particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < -20) p.x = innerWidth + 20;
            if (p.x > innerWidth + 20) p.x = -20;
            if (p.y < -20) p.y = innerHeight + 20;
            if (p.y > innerHeight + 20) p.y = -20;

            ctx.beginPath();
            ctx.fillStyle = hexToRgba(i % 2 ? accent : accent2, p.a * 0.56);
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          });

          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const a = particles[i];
              const b = particles[j];
              const dx = a.x - b.x;
              const dy = a.y - b.y;
              const dist = Math.hypot(dx, dy);
              if (dist < 150) {
                const alpha = (1 - dist / 150) * 0.08;
                ctx.strokeStyle = hexToRgba(accent2, alpha);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }
          }

          raf = requestAnimationFrame(step);
        }

        function hexToRgba(color, alpha) {
          const c = document.createElement("canvas").getContext("2d");
          c.fillStyle = color;
          const computed = c.fillStyle;
          if (computed.startsWith("rgb")) {
            return computed.replace("rgb(", "rgba(").replace(")", `, ${alpha})`);
          }
          return color;
        }

        window.addEventListener("resize", resize);
        resize();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(step);

        // make theme updates feel alive
        document.body.addEventListener("themechange", () => {
          resize();
        });
      }

          const target = document.querySelector(".frameBox");

              await document.exitFullscreen();
            } else if (target.requestFullscreen) {
              await target.requestFullscreen();
            } else if (TOOL_FRAME.requestFullscreen) {
              await TOOL_FRAME.requestFullscreen();
            }
          } catch {}
        });

        TOOL_FRAME.addEventListener("load", () => {
          LOADING.classList.remove("show");
        });

        window.addEventListener("keydown", e => {
          const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
          const typing = tag === "input" || tag === "textarea" || tag === "select" || document.activeElement?.isContentEditable;
          if (e.key === "Escape") {
            if (document.body.classList.contains("workspace-mode")) {
              e.preventDefault();
              closeWorkspace();
              return;
            }
            if (document.body.classList.contains("sidebar-open")) {
              e.preventDefault();
              showSidebar(false);
              return;
            }
          }

          if (typing || document.body.classList.contains("workspace-mode")) return;

          const map = {
            "1": 0, "2": 1, "3": 2, "4": 3, "5": 4,
            "6": 5, "7": 6, "8": 7, "9": 8, "0": 9
          };
          if (map.hasOwnProperty(e.key)) {
            e.preventDefault();
            const index = map[e.key];
            const tool = TOOLS[index];
            if (tool) openToolById(tool.id, true);
          }
        });

        window.addEventListener("storage", () => {
          // Reflect external changes when the same file is open in multiple tabs.
          state.lang = safeGet(STORAGE.lang, state.lang);
          state.theme = safeGet(STORAGE.theme, state.theme);
          state.favorites = safeGet(STORAGE.favorites, state.favorites);
          state.recent = safeGet(STORAGE.recent, state.recent);
          state.lastTool = safeGet(STORAGE.lastTool, state.lastTool);
          applyTheme(state.theme);
          document.documentElement.lang = state.lang;
          renderEverything();
        });
      }

      function initThemeAndLang() {
        document.body.dataset.theme = state.theme;
        document.documentElement.lang = state.lang;
        buildThemeOptionLabels();
        LANG_SELECT.value = state.lang;
        THEME_SELECT.value = state.theme;
      }

      function announceLastTool() {
        if (state.lastTool && getTool(state.lastTool)) {
          // Keep remembered tool visible without forcing open.
          toast(t("restored"), toolTitle(getTool(state.lastTool)));
        }
      }

      function setupThemeChangeSync() {
        const sync = () => document.body.dispatchEvent(new Event("themechange"));
        const obs = new MutationObserver(sync);
        obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
      }

      function init() {
        initThemeAndLang();
        bindEvents();
        applyTheme(state.theme);
        renderEverything();
        initParticles();

        if (!state.lastTool) {
          RESUME_BTN.classList.add("hidden");
        }

        // Keep the remembered tool available, but do not hijack the page.
        if (state.lastTool && getTool(state.lastTool)) {
          RESUME_BTN.classList.remove("hidden");
          RESUME_BTN.innerHTML = `↺ ${escapeHtml(t("resume"))}`;
        }

        setupThemeChangeSync();
      }

      init();
    })();
  </script>
</body>
</html>
