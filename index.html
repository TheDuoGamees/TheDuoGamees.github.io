<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>TheDuo Tools</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(16, 22, 40, 0.96);
      --panel-2: rgba(13, 18, 33, 0.96);
      --card: rgba(19, 26, 47, 0.95);
      --card-2: rgba(25, 33, 57, 0.95);
      --text: #eef3ff;
      --muted: #9aa6c3;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #7c8cff;
      --primary-2: #95a2ff;
      --accent: #4bd8c8;
      --danger: #ff6b8b;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      --shadow-soft: 0 8px 18px rgba(0, 0, 0, 0.16);
      --radius: 18px;
      --radius-lg: 24px;
    }

    body[data-theme="light"] {
      --bg: #f5f7fb;
      --panel: rgba(255, 255, 255, 0.92);
      --panel-2: rgba(248, 250, 255, 0.95);
      --card: rgba(255, 255, 255, 0.96);
      --card-2: rgba(244, 247, 255, 0.98);
      --text: #1f2937;
      --muted: #667085;
      --border: rgba(17, 24, 39, 0.09);
      --primary: #5865f2;
      --primary-2: #6e7bff;
      --accent: #12b886;
      --danger: #e11d48;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 8px 18px rgba(15, 23, 42, 0.06);
    }

    body[data-theme="purple"] {
      --bg: #120f1f;
      --panel: rgba(24, 19, 42, 0.96);
      --panel-2: rgba(19, 15, 35, 0.96);
      --card: rgba(29, 22, 52, 0.96);
      --card-2: rgba(35, 27, 64, 0.96);
      --text: #f2ecff;
      --muted: #b5a9d6;
      --border: rgba(232, 224, 255, 0.1);
      --primary: #b58cff;
      --primary-2: #cfb0ff;
      --accent: #69e1ff;
      --danger: #ff7ba5;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
      --shadow-soft: 0 8px 18px rgba(0, 0, 0, 0.16);
    }

    body[data-theme="emerald"] {
      --bg: #071815;
      --panel: rgba(10, 28, 24, 0.96);
      --panel-2: rgba(8, 23, 20, 0.96);
      --card: rgba(12, 33, 29, 0.96);
      --card-2: rgba(14, 38, 34, 0.96);
      --text: #ebfff8;
      --muted: #9cc4ba;
      --border: rgba(206, 255, 243, 0.09);
      --primary: #3ee3b0;
      --primary-2: #66f0c6;
      --accent: #7be4ff;
      --danger: #ff7e92;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
      --shadow-soft: 0 8px 18px rgba(0, 0, 0, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select,
    input {
      touch-action: manipulation;
    }

    ::selection {
      background: color-mix(in srgb, var(--primary) 28%, transparent);
    }

    .app {
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(1200px 650px at 15% -20%, color-mix(in srgb, var(--primary) 18%, transparent), transparent 55%),
        radial-gradient(900px 480px at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 50%),
        var(--bg);
    }

    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding:
        calc(12px + env(safe-area-inset-top))
        calc(14px + env(safe-area-inset-right))
        12px
        calc(14px + env(safe-area-inset-left));
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: none;
      box-shadow: var(--shadow-soft);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 0 0 auto;
      user-select: none;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: var(--shadow-soft);
      flex: 0 0 auto;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-text strong {
      font-size: 1rem;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text span {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-wrap {
      flex: 1 1 320px;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search {
      width: 100%;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow-soft);
    }

    .search::placeholder {
      color: var(--muted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      margin-left: auto;
    }

    .control,
    .icon-btn,
    .seg-btn,
    .chip-btn,
    .open-btn,
    .back-btn,
    .card-fav,
    .mini-item,
    .category-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      box-shadow: none;
      outline: none;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, opacity 0.12s ease;
    }

    .control:hover,
    .icon-btn:hover,
    .seg-btn:hover,
    .chip-btn:hover,
    .open-btn:hover,
    .back-btn:hover,
    .card-fav:hover,
    .mini-item:hover,
    .category-btn:hover {
      border-color: color-mix(in srgb, var(--primary) 28%, var(--border));
    }

    .control:active,
    .icon-btn:active,
    .seg-btn:active,
    .chip-btn:active,
    .open-btn:active,
    .back-btn:active,
    .card-fav:active,
    .mini-item:active,
    .category-btn:active {
      transform: scale(0.98);
    }

    .seg-btn,
    .control {
      height: 40px;
      padding: 0 12px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .seg-group {
      display: inline-flex;
      border-radius: 13px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow-soft);
    }

    .seg-btn {
      border: 0;
      border-radius: 0;
      background: transparent;
      height: 40px;
      padding: 0 12px;
      min-width: 46px;
    }

    .seg-btn.active {
      background: color-mix(in srgb, var(--primary) 20%, transparent);
      color: var(--text);
    }

    .theme-select {
      height: 40px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 0 12px;
      box-shadow: var(--shadow-soft);
      outline: none;
    }

    .menu-btn {
      display: none;
    }

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .sidebar {
      width: 290px;
      flex: 0 0 290px;
      min-width: 0;
      border-right: 1px solid var(--border);
      background: var(--panel-2);
      padding:
        16px
        14px
        calc(16px + env(safe-area-inset-bottom))
        calc(14px + env(safe-area-inset-left));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .sidebar-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-title strong {
      font-size: 0.98rem;
    }

    .sidebar-title span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .sidebar-close {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .section-label {
      margin: 18px 0 10px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .category-list {
      display: grid;
      gap: 8px;
    }

    .category-btn {
      width: 100%;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      text-align: left;
      background: var(--card);
    }

    .category-btn.active {
      background: color-mix(in srgb, var(--primary) 15%, var(--card));
      border-color: color-mix(in srgb, var(--primary) 30%, var(--border));
    }

    .category-btn .count {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .sidebar-note {
      margin-top: 16px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 10%, transparent), transparent), var(--card);
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.9rem;
    }

    .main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding:
        16px
        calc(16px + env(safe-area-inset-right))
        calc(16px + env(safe-area-inset-bottom))
        16px;
      scroll-behavior: smooth;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      padding: 14px;
      box-shadow: var(--shadow-soft);
      min-width: 0;
    }

    .stat .num {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .stat .label {
      color: var(--muted);
      font-size: 0.84rem;
      margin-top: 4px;
    }

    .workspace {
      display: none;
      margin-bottom: 16px;
      gap: 12px;
      flex-direction: column;
      min-height: 0;
    }

    .workspace.active {
      display: flex;
      animation: fadeIn 0.18s ease-out;
    }

    .workspace-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .workspace-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .workspace-title .title-stack {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .workspace-title strong {
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workspace-title span {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workspace-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .back-btn,
    .open-btn {
      height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .open-btn {
      background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--accent) 55%, var(--primary)));
      color: #fff;
      border-color: transparent;
      box-shadow: var(--shadow-soft);
    }

    .workspace-frame {
      flex: 1 1 auto;
      min-height: clamp(420px, 72dvh, 920px);
      border-radius: 22px;
      border: 1px solid var(--border);
      overflow: hidden;
      background: #0a0a0a;
      box-shadow: var(--shadow);
      position: relative;
    }

    .workspace-frame.loading::after {
      content: attr(data-loading);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.15));
      pointer-events: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
      pointer-events: auto;
      -webkit-overflow-scrolling: touch;
    }

    .launcher {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .launcher-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: end;
    }

    .launcher-head h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      line-height: 1.15;
    }

    .launcher-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      max-width: 62ch;
      line-height: 1.5;
    }

    .mini-sections {
      display: grid;
      gap: 12px;
    }

    .mini-block {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow-soft);
      padding: 14px;
    }

    .mini-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mini-head strong {
      font-size: 0.92rem;
    }

    .mini-head span {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .mini-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .mini-item {
      flex: 0 0 auto;
      min-width: 170px;
      max-width: 240px;
      border-radius: 16px;
      padding: 12px 14px;
      text-align: left;
      background: var(--card-2);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mini-item strong {
      font-size: 0.92rem;
      line-height: 1.2;
    }

    .mini-item span {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .tool-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 8%, transparent), transparent 26%), var(--card);
      box-shadow: var(--shadow-soft);
      padding: 14px;
      color: var(--text);
      min-height: 190px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      outline: none;
      min-width: 0;
    }

    .tool-card:focus-visible,
    .mini-item:focus-visible,
    .category-btn:focus-visible,
    .control:focus-visible,
    .seg-btn:focus-visible,
    .open-btn:focus-visible,
    .back-btn:focus-visible,
    .card-fav:focus-visible,
    .icon-btn:focus-visible,
    .theme-select:focus-visible,
    .search:focus-visible,
    .sidebar-close:focus-visible,
    .menu-btn:focus-visible {
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent);
    }

    .tool-card:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--primary) 28%, var(--border));
    }

    .tool-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 38%, transparent), color-mix(in srgb, var(--accent) 28%, transparent));
      color: #fff;
      font-size: 1.25rem;
      flex: 0 0 auto;
      box-shadow: var(--shadow-soft);
    }

    .card-fav {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: var(--card-2);
      color: var(--muted);
    }

    .card-fav.active {
      color: #ffd34d;
      background: color-mix(in srgb, #ffd34d 16%, var(--card-2));
    }

    .tool-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .tool-content h3 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      min-width: 0;
    }

    .tool-content p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
      min-width: 0;
    }

    .tool-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .badge.primary {
      color: var(--text);
      background: color-mix(in srgb, var(--primary) 14%, var(--card-2));
      border-color: color-mix(in srgb, var(--primary) 22%, var(--border));
    }

    .open-mini {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-2);
      font-weight: 700;
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 22px;
      padding: 24px 18px;
      color: var(--muted);
      text-align: center;
      background: var(--card);
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
    }

    .backdrop {
      display: none;
    }

    .toast-wrap {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
      display: grid;
      gap: 8px;
      width: min(92vw, 420px);
    }

    .toast {
      opacity: 0;
      transform: translateY(10px);
      animation: toastIn 0.18s ease-out forwards;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .toast.good {
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
    }

    .toast.warn {
      border-color: color-mix(in srgb, var(--danger) 35%, var(--border));
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes toastIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 920px) {
      .topbar {
        gap: 10px;
      }

      .menu-btn {
        display: inline-flex;
      }

      .controls {
        margin-left: 0;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 70;
        width: min(88vw, 320px);
        transform: translateX(-102%);
        transition: transform 0.22s ease;
        box-shadow: 20px 0 45px rgba(0, 0, 0, 0.24);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-close {
        display: inline-flex;
      }

      .backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 65;
        background: rgba(0, 0, 0, 0.42);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }

      .backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .stats-row {
        grid-template-columns: 1fr;
      }

      .main {
        padding-top: 14px;
      }

      .workspace-frame {
        min-height: 58dvh;
      }

      .mini-item {
        min-width: 160px;
      }
    }

    @media (max-width: 560px) {
      .brand-text span {
        display: none;
      }

      .search-wrap {
        flex-basis: 100%;
        order: 3;
      }

      .topbar {
        align-items: center;

      .tool-grid {

      .workspace-bar {
        align-items: flex-start;
      }

      .workspace-actions {
        width: 100%;
        justify-content: space-between;
      }

  </style>
</head>
<body data-theme="dark">
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="TheDuo Tools">

    <div class="content">

        </div>

        <div class="section-label" id="catLabel">Categories</div>
        <nav id="categoryList" class="category-list"></nav>

        <div class="sidebar-note" id="sidebarNote">
          Fast launcher, favorites, recent tools, and saved preferences.
        </div>

      <div id="backdrop" class="backdrop" aria-hidden="true"></div>

      <main id="main" class="main">
        <section id="workspace" class="workspace" aria-label="Workspace">
          <div class="workspace-bar">
            <div class="workspace-title">
              <button id="backBtn" class="back-btn" type="button">←</button>
              <div class="title-stack">
                <strong id="workspaceTitle">Workspace</strong>
                <span id="workspacePath">—</span>
              </div>
            </div>

            <div class="workspace-actions">
              <button id="openNewTabBtn" class="open-btn" type="button">↗</button>
            </div>
          </div>

          <div id="frameBox" class="workspace-frame loading" data-loading="Loading..." aria-live="polite">
            <iframe id="toolFrame" title="Tool workspace" loading="eager"></iframe>
          </div>
        </section>

        <section id="launcher" class="launcher">
          <div class="launcher-head">
            <div>
              <h1 id="launcherTitle">Tools launcher</h1>
              <p id="launcherDesc">Search, favorite, and open your HTML tools instantly.</p>
            </div>
          </div>

          <div class="stats-row">
            <div class="stat">
              <div class="num" id="statTools">0</div>
              <div class="label" id="statToolsLabel">Tools</div>
            </div>
            <div class="stat">
              <div class="num" id="statFavs">0</div>
              <div class="label" id="statFavsLabel">Favorites</div>
            </div>
            <div class="stat">
              <div class="num" id="statRecent">0</div>
              <div class="label" id="statRecentLabel">Recent</div>

          <div class="mini-sections">
            <div id="favoritesBlock" class="mini-block hidden">
              <div class="mini-head">
                <strong id="favoritesTitle">Favorites</strong>

              <div id="favoritesRow" class="mini-row"></div>

            <div id="recentBlock" class="mini-block hidden">

    <div id="toastWrap" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script>
    const tools = [
      {
        id: "api-key",

        desc: {

          ru: "Сборка, декодирование и управление ссылками в компактном интерфейсе."

      {

      },
      {

        category: "text",
        icon: "🔤",

        desc: {

          ru: "Сортировка, очистка и упорядочивание списков слов без лишних действий."

      },
      {

        href: "phiziks.html",
        category: "study",
        icon: "📘",
        title: { en: "Phiziks", ru: "Phiziks" },
        desc: {
          en: "Study helper for physics practice and fast revision.",
          ru: "Помощник для изучения физики и быстрой подготовки."
        }
      },
      {
        id: "pong",
        href: "pong.html",
        category: "games",
        icon: "🎮",
        title: { en: "Pong", ru: "Понг" },
        desc: {
          en: "Lightweight classic game, ready for a quick break.",
          ru: "Лёгкая классическая игра для короткой паузы."
        }
      }
    ];

    const categoryOrder = ["all", "security", "developer", "design", "text", "study", "games"];

    const i18n = {
      en: {
        appTitle: "TheDuo Tools",
        appSub: "Mini web tools ecosystem",
        searchPlaceholder: "Search tools...",
        menu: "Menu",
        close: "Close",
        browse: "Browse",
        filters: "Filters and categories",
        categories: "Categories",
        sidebarNote: "Fast launcher, favorites, recent tools, and saved preferences.",
        launcherTitle: "Tools launcher",
        launcherDesc: "Search, favorite, and open your HTML tools instantly.",
        tools: "Tools",
        favorites: "Favorites",
        recent: "Recent",
        allTools: "All tools",
        workspace: "Workspace",
        openNewTab: "Open in new tab",
        back: "Back",
        loading: "Loading...",
        noResultsTitle: "No tools found",
        noResultsDesc: "Try another search or category.",
        toastOpened: (name) => `Opened ${name}`,
        toastSaved: "Saved",
        toastRestored: "Session restored",
        open: "Open",
        favorite: "Favorite",
        unfavorite: "Unfavorite",
        language: "Language",
        theme: "Theme",
        dark: "Dark",
        light: "Light",
        purple: "Purple",
        emerald: "Emerald",
        counts: (n) => `${n}`,
        nothingYet: "Nothing here yet"
      },
      ru: {
        appTitle: "TheDuo Tools",
        appSub: "Экосистема мини веб-инструментов",
        searchPlaceholder: "Поиск инструментов...",
        menu: "Меню",
        close: "Закрыть",
        browse: "Обзор",
        filters: "Фильтры и категории",
        categories: "Категории",
        sidebarNote: "Быстрый лаунчер, избранное, недавние инструменты и сохранённые настройки.",
        launcherTitle: "Панель инструментов",
        launcherDesc: "Ищи, добавляй в избранное и открывай HTML-инструменты мгновенно.",
        tools: "Инструменты",
        favorites: "Избранное",
        recent: "Недавние",
        allTools: "Все инструменты",
        workspace: "Рабочая область",
        openNewTab: "Открыть в новой вкладке",
        back: "Назад",
        loading: "Загрузка...",
        noResultsTitle: "Инструменты не найдены",
        noResultsDesc: "Попробуй другой поиск или категорию.",
        toastOpened: (name) => `Открыто: ${name}`,
        toastSaved: "Сохранено",
        toastRestored: "Сессия восстановлена",
        open: "Открыть",
        favorite: "В избранное",
        unfavorite: "Убрать из избранного",
        language: "Язык",
        theme: "Тема",
        dark: "Тёмная",
        light: "Светлая",
        purple: "Фиолетовая",
        emerald: "Изумрудная",
        counts: (n) => `${n}`,
        nothingYet: "Пока ничего нет"
      }
    };

    const categories = ["all", "security", "developer", "design", "text", "study", "games"];

    const els = {
      body: document.body,
      searchInput: document.getElementById("searchInput"),
      themeSelect: document.getElementById("themeSelect"),
      langEn: document.getElementById("langEn"),
      langRu: document.getElementById("langRu"),
      menuBtn: document.getElementById("menuBtn"),
      sidebar: document.getElementById("sidebar"),
      sidebarClose: document.getElementById("sidebarClose"),
      backdrop: document.getElementById("backdrop"),
      categoryList: document.getElementById("categoryList"),
      sidebarTitle: document.getElementById("sidebarTitle"),
      sidebarSubtitle: document.getElementById("sidebarSubtitle"),
      catLabel: document.getElementById("catLabel"),
      sidebarNote: document.getElementById("sidebarNote"),
      launcherTitle: document.getElementById("launcherTitle"),
      launcherDesc: document.getElementById("launcherDesc"),
      statTools: document.getElementById("statTools"),
      statFavs: document.getElementById("statFavs"),
      statRecent: document.getElementById("statRecent"),
      statToolsLabel: document.getElementById("statToolsLabel"),
      statFavsLabel: document.getElementById("statFavsLabel"),
      statRecentLabel: document.getElementById("statRecentLabel"),
      favoritesBlock: document.getElementById("favoritesBlock"),
      recentBlock: document.getElementById("recentBlock"),
      favoritesTitle: document.getElementById("favoritesTitle"),
      recentTitle: document.getElementById("recentTitle"),
      favoritesCount: document.getElementById("favoritesCount"),
      recentCount: document.getElementById("recentCount"),
      favoritesRow: document.getElementById("favoritesRow"),
      recentRow: document.getElementById("recentRow"),
      allToolsLabel: document.getElementById("allToolsLabel"),
      toolGrid: document.getElementById("toolGrid"),
      workspace: document.getElementById("workspace"),
      workspaceTitle: document.getElementById("workspaceTitle"),
      workspacePath: document.getElementById("workspacePath"),
      openNewTabBtn: document.getElementById("openNewTabBtn"),
      backBtn: document.getElementById("backBtn"),
      toolFrame: document.getElementById("toolFrame"),
      frameBox: document.getElementById("frameBox"),
      toastWrap: document.getElementById("toastWrap"),
      brandTitle: document.getElementById("brandTitle"),
      brandSubtitle: document.getElementById("brandSubtitle")
    };

    const STORAGE_KEY = "thedduo-tools-portal-v3";

    const state = {
      lang: "en",
      theme: "dark",
      category: "all",
      query: "",
      favorites: [],
      recent: [],
      activeTool: null,
      sidebarOpen: false
    };

    function t(key, ...args) {
      const value = i18n[state.lang][key];
      return typeof value === "function" ? value(...args) : value;
    }

    function getTool(id) {
      return tools.find((tool) => tool.id === id) || null;
    }

    function toolTitle(tool) {
      return tool.title[state.lang] || tool.title.en;
    }

    function toolDesc(tool) {
      return tool.desc[state.lang] || tool.desc.en;
    }

    function categoryLabel(cat) {
      if (cat === "all") return t("allTools");
      const map = {
        all: { en: "All", ru: "Все" },
        security: { en: "Security", ru: "Безопасность" },
        developer: { en: "Developer", ru: "Разработка" },
        design: { en: "Design", ru: "Дизайн" },
        text: { en: "Text", ru: "Текст" },
        study: { en: "Study", ru: "Учёба" },
        games: { en: "Games", ru: "Игры" }
      };
      return map[cat]?.[state.lang] || cat;
    }

    function saveState() {
      const payload = {
        lang: state.lang,
        theme: state.theme,
        category: state.category,
        favorites: state.favorites,
        recent: state.recent,
        lastTool: state.activeTool ? state.activeTool.id : null
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);

        if (parsed && typeof parsed === "object") {
          if (["en", "ru"].includes(parsed.lang)) state.lang = parsed.lang;
          if (["dark", "light", "purple", "emerald"].includes(parsed.theme)) state.theme = parsed.theme;
          if (categories.includes(parsed.category)) state.category = parsed.category;
          if (Array.isArray(parsed.favorites)) state.favorites = parsed.favorites.filter((id) => getTool(id));
          if (Array.isArray(parsed.recent)) state.recent = parsed.recent.filter((id) => getTool(id)).slice(0, 6);
          if (parsed.lastTool && getTool(parsed.lastTool)) {
            state.activeTool = getTool(parsed.lastTool);
          }
        }
      } catch {
        return;
      }
    }

    function applyTheme() {
      document.body.dataset.theme = state.theme;
      const options = [
        ["dark", t("dark")],
        ["light", t("light")],
        ["purple", t("purple")],
        ["emerald", t("emerald")]
      ];
      els.themeSelect.innerHTML = options
        .map(([value, label]) => `<option value="${value}">${label}</option>`)
        .join("");
      els.themeSelect.value = state.theme;
    }

    function applyLanguage() {
      els.langEn.classList.toggle("active", state.lang === "en");
      els.langRu.classList.toggle("active", state.lang === "ru");

      document.title = t("appTitle");
      els.brandTitle.textContent = t("appTitle");
      els.brandSubtitle.textContent = t("appSub");
      els.searchInput.placeholder = t("searchPlaceholder");

      els.sidebarTitle.textContent = t("browse");
      els.sidebarSubtitle.textContent = t("filters");
      els.catLabel.textContent = t("categories");
      els.sidebarNote.textContent = t("sidebarNote");
      els.launcherTitle.textContent = t("launcherTitle");
      els.launcherDesc.textContent = t("launcherDesc");
      els.statToolsLabel.textContent = t("tools");
      els.statFavsLabel.textContent = t("favorites");
      els.statRecentLabel.textContent = t("recent");
      els.favoritesTitle.textContent = t("favorites");
      els.recentTitle.textContent = t("recent");
      els.allToolsLabel.textContent = t("allTools");
      els.backBtn.textContent = `← ${t("back")}`;
      els.openNewTabBtn.textContent = `${t("openNewTab")} ↗`;
      els.menuBtn.setAttribute("aria-label", t("menu"));
      els.sidebarClose.setAttribute("aria-label", t("close"));

      renderCategoryList();
      renderMiniBlocks();
      renderTools();
      if (state.activeTool) {
        renderWorkspace();
      }
      applyTheme();
    }

    function setTheme(theme) {
      if (!["dark", "light", "purple", "emerald"].includes(theme)) return;
      state.theme = theme;
      applyTheme();
      saveState();
      toast(t("toastSaved"), "good");
    }

    function setLanguage(lang) {
      if (!["en", "ru"].includes(lang)) return;
      state.lang = lang;
      applyLanguage();
      saveState();
      toast(t("toastSaved"), "good");
    }

    function openSidebar() {
      state.sidebarOpen = true;
      els.sidebar.classList.add("open");
      els.backdrop.classList.add("open");
      els.menuBtn.setAttribute("aria-expanded", "true");
    }

    function closeSidebar() {
      state.sidebarOpen = false;
      els.sidebar.classList.remove("open");
      els.backdrop.classList.remove("open");
      els.menuBtn.setAttribute("aria-expanded", "false");
    }

    function toggleSidebar() {
      if (state.sidebarOpen) closeSidebar();
      else openSidebar();
    }

    function setCategory(category) {
      state.category = category;
      renderCategoryList();
      renderTools();
      saveState();
    }

    function matchesQuery(tool, query) {
      if (!query) return true;
      const text = [
        toolTitle(tool),
        toolDesc(tool),
        tool.href,
        categoryLabel(tool.category)
      ].join(" ").toLowerCase();
      return text.includes(query.toLowerCase());
    }

    function filteredTools() {
      return tools.filter((tool) => {
        const categoryOk = state.category === "all" || tool.category === state.category;
        return categoryOk && matchesQuery(tool, state.query);
      });
    }

    function renderCategoryList() {
      const counts = {};
      for (const cat of categories) counts[cat] = 0;
      for (const tool of tools) counts[tool.category] = (counts[tool.category] || 0) + 1;

      els.categoryList.innerHTML = categories
        .map((cat) => {
          const active = state.category === cat;
          const label = cat === "all" ? t("allTools") : categoryLabel(cat);
          const count = cat === "all" ? tools.length : counts[cat] || 0;
          return `
            <button type="button" class="category-btn ${active ? "active" : ""}" data-category="${cat}">
              <span>${label}</span>
              <span class="count">${count}</span>
            </button>
          `;
        })
        .join("");

      els.categoryList.querySelectorAll(".category-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          setCategory(btn.dataset.category);
          if (window.matchMedia("(max-width: 920px)").matches) closeSidebar();
        });
      });
    }

    function renderMiniBlocks() {
      const favTools = state.favorites.map(getTool).filter(Boolean);
      const recentTools = state.recent.map(getTool).filter(Boolean);

      els.statTools.textContent = String(tools.length);
      els.statFavs.textContent = String(favTools.length);
      els.statRecent.textContent = String(recentTools.length);

      els.favoritesCount.textContent = String(favTools.length);
      els.recentCount.textContent = String(recentTools.length);

      els.favoritesBlock.classList.toggle("hidden", favTools.length === 0);
      els.recentBlock.classList.toggle("hidden", recentTools.length === 0);

      els.favoritesRow.innerHTML = favTools.length
        ? favTools.map(miniItemHTML).join("")
        : `<div class="empty">${t("nothingYet")}</div>`;
      els.recentRow.innerHTML = recentTools.length
        ? recentTools.map(miniItemHTML).join("")
        : `<div class="empty">${t("nothingYet")}</div>`;

      els.favoritesRow.querySelectorAll("[data-open-id]").forEach(bindMiniItem);
      els.recentRow.querySelectorAll("[data-open-id]").forEach(bindMiniItem);
    }

    function miniItemHTML(tool) {
      return `
        <button type="button" class="mini-item" data-open-id="${tool.id}">
          <strong>${tool.icon} ${escapeHTML(toolTitle(tool))}</strong>
          <span>${escapeHTML(toolDesc(tool))}</span>
        </button>
      `;
    }

    function renderTools() {
      const list = filteredTools();
      els.toolGrid.innerHTML = "";

      if (!list.length) {
        els.toolGrid.innerHTML = `
          <div class="empty" style="grid-column: 1 / -1;">
            <strong>${t("noResultsTitle")}</strong>
            <div>${t("noResultsDesc")}</div>
          </div>
        `;
        return;
      }

      els.toolGrid.innerHTML = list.map(cardHTML).join("");
      els.toolGrid.querySelectorAll(".tool-card").forEach((card) => {
        const id = card.dataset.id;
        const tool = getTool(id);
        if (!tool) return;

        card.addEventListener("click", (e) => {
          const favBtn = e.target.closest("[data-fav-id]");
          if (favBtn) return;
          openTool(id);
        });

        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openTool(id);
          }
        });
      });

      els.toolGrid.querySelectorAll("[data-fav-id]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFavorite(btn.dataset.favId);
        });
      });
    }

    function cardHTML(tool) {
      const isFav = state.favorites.includes(tool.id);
      return `
        <article class="tool-card" role="button" tabindex="0" data-id="${tool.id}" aria-label="${escapeHTML(toolTitle(tool))}">
          <div class="tool-top">
            <div class="tool-icon">${tool.icon}</div>
            <button
              type="button"
              class="card-fav ${isFav ? "active" : ""}"
              data-fav-id="${tool.id}"
              aria-label="${isFav ? t("unfavorite") : t("favorite")}"
              title="${isFav ? t("unfavorite") : t("favorite")}"
            >★</button>
          </div>

          <div class="tool-content">
            <h3>${escapeHTML(toolTitle(tool))}</h3>
            <p>${escapeHTML(toolDesc(tool))}</p>
          </div>

          <div class="tool-meta">
            <span class="badge primary">${escapeHTML(categoryLabel(tool.category))}</span>
            <span class="open-mini">${t("open")} →</span>
          </div>
        </article>
      `;
    }

    function bindMiniItem(el) {
      el.addEventListener("click", () => openTool(el.dataset.openId));
    }

    function toggleFavorite(id) {
      const idx = state.favorites.indexOf(id);
      if (idx >= 0) state.favorites.splice(idx, 1);
      else state.favorites.unshift(id);
      state.favorites = uniqueIds(state.favorites).slice(0, 12);
      renderMiniBlocks();
      renderTools();
      saveState();
    }

    function updateRecent(id) {
      state.recent = uniqueIds([id, ...state.recent]).slice(0, 6);
    }

    function uniqueIds(list) {
      const seen = new Set();
      const out = [];
      for (const item of list) {
        if (!item || seen.has(item)) continue;
        seen.add(item);
        out.push(item);
      }
      return out;
    }

    function openTool(id, announce = true) {
      const tool = getTool(id);
      if (!tool) return;

      state.activeTool = tool;
      updateRecent(id);
      renderWorkspace();
      renderMiniBlocks();
      renderTools();
      saveState();

      if (window.matchMedia("(max-width: 920px)").matches) closeSidebar();

      if (announce) toast(t("toastOpened", toolTitle(tool)), "good");
      els.main?.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderWorkspace() {
      if (!state.activeTool) {
        els.workspace.classList.remove("active");
        els.launcher.classList.remove("hidden");
        return;
      }

      const tool = state.activeTool;
      els.workspace.classList.add("active");
      els.launcher.classList.add("hidden");
      els.workspaceTitle.textContent = toolTitle(tool);
      els.workspacePath.textContent = tool.href;
      els.toolFrame.src = tool.href;
      els.frameBox.classList.add("loading");
      els.frameBox.setAttribute("data-loading", t("loading"));

      els.toolFrame.onload = () => {
        els.frameBox.classList.remove("loading");
      };
    }

    function closeWorkspace() {
      state.activeTool = null;
      els.workspace.classList.remove("active");
      els.launcher.classList.remove("hidden");
      els.toolFrame.removeAttribute("src");
      saveState();
      renderTools();
      renderMiniBlocks();
    }

    function openCurrentInNewTab() {
      if (!state.activeTool) return;
      window.open(state.activeTool.href, "_blank", "noopener");
    }

    function toast(message, kind = "") {
      const item = document.createElement("div");
      item.className = `toast ${kind}`.trim();
      item.textContent = message;
      els.toastWrap.appendChild(item);
      window.setTimeout(() => {
        item.style.opacity = "0";
        item.style.transform = "translateY(10px)";
        item.style.transition = "opacity .16s ease, transform .16s ease";
      }, 1800);
      window.setTimeout(() => item.remove(), 2050);
    }

    function escapeHTML(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function isDesktopShortcutTarget(el) {
      const tag = el?.tagName?.toLowerCase();
      return !["input", "textarea", "select"].includes(tag);
    }

    function bindEvents() {
      els.searchInput.addEventListener("input", () => {
        state.query = els.searchInput.value.trim();
        renderTools();
      });

      els.themeSelect.addEventListener("change", () => {
        setTheme(els.themeSelect.value);
      });

      els.langEn.addEventListener("click", () => setLanguage("en"));
      els.langRu.addEventListener("click", () => setLanguage("ru"));

      els.menuBtn.addEventListener("click", toggleSidebar);
      els.sidebarClose.addEventListener("click", closeSidebar);
      els.backdrop.addEventListener("click", closeSidebar);

      els.backBtn.addEventListener("click", closeWorkspace);
      els.openNewTabBtn.addEventListener("click", openCurrentInNewTab);

      window.addEventListener("keydown", (e) => {
        const desktop = window.matchMedia("(min-width: 921px)").matches;
        if (!desktop) return;

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          els.searchInput.focus();
          els.searchInput.select();
          return;
        }

        if (e.key === "Escape") {
          if (state.activeTool) {
            closeWorkspace();
          } else if (state.sidebarOpen) {
            closeSidebar();
          }
          return;
        }

        if (!isDesktopShortcutTarget(document.activeElement)) return;

        if (e.altKey && e.key === "1") {
          e.preventDefault();
          setCategory("all");
        }
      });

      window.addEventListener("resize", () => {
        if (window.matchMedia("(min-width: 921px)").matches) {
          closeSidebar();
        }
      });

      let touchStartX = null;
      let touchStartY = null;
      let tracking = false;

      const onStart = (e) => {
        if (!window.matchMedia("(max-width: 920px)").matches) return;
        const target = e.target.closest?.("#sidebar");
        if (!target) return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        tracking = true;
      };

      const onMove = (e) => {
        if (!tracking || touchStartX === null || touchStartY === null) return;
        const t = e.touches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;

        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < -42) closeSidebar();
          tracking = false;
        }
      };

      const onEnd = () => {
        tracking = false;
        touchStartX = null;
        touchStartY = null;
      };

      els.sidebar.addEventListener("touchstart", onStart, { passive: true });
      els.sidebar.addEventListener("touchmove", onMove, { passive: true });
      els.sidebar.addEventListener("touchend", onEnd, { passive: true });
      els.sidebar.addEventListener("touchcancel", onEnd, { passive: true });
    }

    function init() {
      loadState();
      applyTheme();
      applyLanguage();
      bindEvents();

      els.searchInput.value = state.query || "";
      els.themeSelect.value = state.theme;

      renderCategoryList();
      renderMiniBlocks();
      renderTools();

      if (state.activeTool) {
        renderWorkspace();
        toast(t("toastRestored"), "good");
      }

      saveState();
    }

    init();
  </script>
</body>
</html>
