<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Duel Reflex</title>
<style>
    body {
        background: #111;
        color: white;
        text-align: center;
        font-family: Arial;
        margin-top: 100px;
    }
    h1 {
        font-size: 40px;
    }
    #status {
        font-size: 30px;
        margin: 40px;
    }
    .controls {
        font-size: 18px;
        margin-top: 30px;
    }
    button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>⚔️ Duel Reflex</h1>

<div id="status">Нажми "Старт"</div>

<button onclick="startGame()">Старт</button>

<div class="controls">
    Игрок 1: нажимает <b>A</b><br>
    Игрок 2: нажимает <b>L</b>
</div>

<script>
let canShoot = false;
let gameActive = false;

function startGame() {
    document.getElementById("status").innerText = "ЖДИТЕ...";
    canShoot = false;
    gameActive = true;

    let delay = Math.random() * 3000 + 2000;

    setTimeout(() => {
        document.getElementById("status").innerText = "🔥 ОГОНЬ!";
        canShoot = true;
    }, delay);
}

document.addEventListener("keydown", function(e) {
    if (!gameActive) return;

    if (e.key.toLowerCase() === "a") {
        shoot("Игрок 1");
    }
    if (e.key.toLowerCase() === "l") {
        shoot("Игрок 2");
    }
});

function shoot(player) {
    if (!canShoot) {
        document.getElementById("status").innerText = player + " проиграл (слишком рано!)";
    } else {
        document.getElementById("status").innerText = player + " победил! 🎉";
    }
    gameActive = false;
}
</script>

</body>
</html>
