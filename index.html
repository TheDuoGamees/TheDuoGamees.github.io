<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Duel Arena</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

.container {
    display: flex;
    height: 100vh;
}

.player {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px;
}

.left { background: #1e3a8a; }
.right { background: #7f1d1d; }

.hp {
    font-size: 20px;
}

button {
    padding: 15px;
    margin: 5px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
}

.attack { background: #ef4444; }
.block { background: #22c55e; }
.ult { background: gold; }

#log {
    position: absolute;
    top: 45%;
    width: 100%;
    font-size: 22px;
}
</style>
</head>
<body>

<div id="log">Бой начался!</div>

<div class="container">

<div class="player left">
    <div class="hp">Игрок 1 ❤️ <span id="hp1">100</span></div>
    <div>
        <button class="attack" onclick="attack(1)">⚔️</button>
        <button class="block" onclick="block(1)">🛡</button>
        <button class="ult" onclick="ult(1)">⚡</button>
    </div>
</div>

<div class="player right">
    <div class="hp">Игрок 2 ❤️ <span id="hp2">100</span></div>
    <div>
        <button class="attack" onclick="attack(2)">⚔️</button>
        <button class="block" onclick="block(2)">🛡</button>
        <button class="ult" onclick="ult(2)">⚡</button>
    </div>
</div>

</div>

<script>
let hp1 = 100;
let hp2 = 100;
let block1 = false;
let block2 = false;
let ult1 = 0;
let ult2 = 0;

function update() {
    document.getElementById("hp1").innerText = hp1;
    document.getElementById("hp2").innerText = hp2;
}

function log(text) {
    document.getElementById("log").innerText = text;
}

function attack(player) {
    let dmg = Math.floor(Math.random() * 10) + 8;

    if (player === 1) {
        if (block2) dmg /= 2;
        hp2 -= dmg;
        ult1 += 10;
        log("Игрок 1 атакует!");
    } else {
        if (block1) dmg /= 2;
        hp1 -= dmg;
        ult2 += 10;
        log("Игрок 2 атакует!");
    }

    block1 = false;
    block2 = false;

    checkWin();
    update();
}

function block(player) {
    if (player === 1) {
        block1 = true;
        log("Игрок 1 защищается");
    } else {
        block2 = true;
        log("Игрок 2 защищается");
    }
}

function ult(player) {
    if (player === 1 && ult1 >= 50) {
        hp2 -= 25;
        ult1 = 0;
        log("💥 Игрок 1 использует ульту!");
    }
    if (player === 2 && ult2 >= 50) {
        hp1 -= 25;
        ult2 = 0;
        log("💥 Игрок 2 использует ульту!");
    }

    checkWin();
    update();
}

function checkWin() {
    if (hp1 <= 0) {
        log("🏆 Игрок 2 победил!");
    }
    if (hp2 <= 0) {
        log("🏆 Игрок 1 победил!");
    }
}
</script>

</body>
</html>
