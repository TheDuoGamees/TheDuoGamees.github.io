<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyForge Pro — API Key Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2333;
            --border: #30363d;
            --text: #e6edf3;
            --text2: #8b949e;
            --text3: #6e7681;
            --accent: #58a6ff;
            --accent2: #3fb950;
            --danger: #f85149;
            --warning: #d2991d;
            --glow: 0 0 18px rgba(88, 166, 255, 0.35);
            --glow-strong: 0 0 32px rgba(88, 166, 255, 0.55);
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 0.18s ease;
            --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
        }
        [data-theme="light"] {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --surface2: #f0f2f5;
            --border: #d0d7de;
            --text: #1f2328;
            --text2: #656d76;
            --text3: #8c959f;
            --accent: #0969da;
            --accent2: #1a7f37;
            --danger: #cf222e;
            --warning: #9a6700;
            --glow: 0 0 12px rgba(9, 105, 218, 0.2);
            --glow-strong: 0 0 24px rgba(9, 105, 218, 0.35);
        }
        [data-theme="neon"] {
            --bg: #050510;
            --surface: #0a0a1a;
            --surface2: #0f0f24;
            --border: #1a3a4a;
            --text: #e0f7ff;
            --text2: #80c8e0;
            --text3: #5080a0;
            --accent: #00f0ff;
            --accent2: #00ff88;
            --danger: #ff3366;
            --warning: #ffaa00;
            --glow: 0 0 22px rgba(0, 240, 255, 0.5), 0 0 60px rgba(0, 240, 255, 0.18);
            --glow-strong: 0 0 36px rgba(0, 240, 255, 0.7), 0 0 90px rgba(0, 240, 255, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.55;
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
        }
        .app-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 24px 40px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--accent);
            text-shadow: var(--glow);
        }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            transition: all var(--transition);
            white-space: nowrap;
            user-select: none;
            font-family: var(--font);
            letter-spacing: 0.01em;
        }
        .btn:hover:not(:disabled) {
            border-color: var(--accent);
            box-shadow: var(--glow);
            transform: translateY(-1px);
        }
        .btn:active:not(:disabled) { transform: scale(0.97); transition: 0.06s ease; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 700;
            box-shadow: var(--glow);
        }
        .btn-primary:hover:not(:disabled) { box-shadow: var(--glow-strong); }
        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-sm { padding: 5px 11px; font-size: 0.8rem; }
        .btn-xs { padding: 3px 8px; font-size: 0.72rem; border-radius: 4px; }
        .btn-group { display: flex; gap: 0; }
        .btn-group .btn { border-radius: 0; margin-left: -1px; }
        .btn-group .btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); margin-left: 0; }
        .btn-group .btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            transition: all var(--transition);
        }
        .card-header {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 14px;
            color: var(--text);
            letter-spacing: 0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
        .form-row label {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text2);
            min-width: 70px;
            letter-spacing: 0.02em;
        }
        input[type="text"], input[type="number"], select {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: var(--font);
            transition: all var(--transition);
            outline: none;
            min-width: 80px;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: var(--glow); }
        input[type="number"] { width: 100px; -moz-appearance: textfield; }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 0.84rem;
        }
        .toggle-row input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--accent);
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
        }
        .badge.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--glow); }
        .badge:hover:not(.active) { border-color: var(--accent); }
        .progress-wrap {
            height: 8px;
            background: var(--surface2);
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0;
            display: none;
        }
        .progress-wrap.visible { display: block; }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.2s ease;
            box-shadow: var(--glow);
            width: 0%;
        }
        .preview-area {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            font-family: var(--mono);
            font-size: 0.78rem;
            max-height: 320px;
            overflow-y: auto;
            line-height: 1.7;
            word-break: break-all;
            color: var(--text);
            white-space: pre-wrap;
            transition: all var(--transition);
        }
        .preview-stat { font-size: 0.78rem; color: var(--text3); margin-top: 6px; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: var(--glow-strong);
        }
        .modal h3 { margin-bottom: 12px; font-size: 1.1rem; }
        .modal p { color: var(--text2); margin-bottom: 20px; font-size: 0.9rem; }
        .modal .btn-row { display: flex; gap: 10px; justify-content: center; }
        .stat { font-size: 0.8rem; color: var(--text3); }
        .highlight { color: var(--accent2); font-weight: 700; }
        @media (max-width: 640px) {
            .app-container { padding: 10px 12px 30px; }
            header { flex-direction: column; align-items: flex-start; }
            .form-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body data-theme="dark">
    <div class="app-container">
        <header>
            <span class="logo">🔑 KeyForge Pro</span>
            <div class="header-actions">
                <div class="btn-group" id="themeBtns">
                    <button class="btn btn-xs" data-theme-val="dark">🌙 Dark</button>
                    <button class="btn btn-xs" data-theme-val="light">☀️ Light</button>
                    <button class="btn btn-xs" data-theme-val="neon">💜 Neon</button>
                </div>
                <button class="btn btn-xs" id="langToggle">🌐 RU</button>
            </div>
        </header>

        <div class="card" style="padding:12px 16px;">
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <span class="badge active" data-mode="standard" id="modeBadgeStandard">🔐 Standard Mode</span>
                <span class="badge" data-mode="custom" id="modeBadgeCustom">⚙️ Custom Mode</span>
            </div>
        </div>

        <div class="card" id="standardSettings">
            <div class="card-header" data-i18n="standard_settings">Standard Mode Settings</div>
            <div class="form-row">
                <label data-i18n="bits_label">Bits:</label>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button class="btn btn-xs bits-preset-std active" data-bits="256">256</button>
                    <button class="btn btn-xs bits-preset-std" data-bits="128">128</button>
                    <button class="btn btn-xs bits-preset-std" data-bits="512">512</button>
                </div>
            </div>
            <div class="form-row">
                <label data-i18n="prefix_label">Prefix:</label>
                <input type="text" id="stdPrefix" placeholder="e.g. myapp_" maxlength="32">
            </div>
            <div class="form-row">
                <label data-i18n="key_type_label">Key Type:</label>
                <input type="text" id="stdKeyType" placeholder="e.g. sk" maxlength="16">
            </div>
            <div class="form-row">
                <label data-i18n="env_label">Environment:</label>
                <input type="text" id="stdEnv" placeholder="e.g. prod" maxlength="16">
            </div>
            <div class="stat" data-i18n="std_info">Uses crypto.getRandomValues + URL-safe Base64. No separator.</div>
        </div>

        <div class="card" id="customSettings" style="display:none;">
            <div class="card-header" data-i18n="custom_settings">Custom Mode Settings</div>
            <div class="form-row">
                <label data-i18n="mode_toggle_label">Mode:</label>
                <div style="display:flex;gap:6px;">
                    <button class="btn btn-xs custom-mode-btn active" data-cmode="length" id="cmodeLength">Length</button>
                    <button class="btn btn-xs custom-mode-btn" data-cmode="bits" id="cmodeBits">Bits</button>
                </div>
            </div>
            <div class="form-row" id="lengthRow">
                <label data-i18n="length_label">Length:</label>
                <input type="number" id="customLength" value="32" min="4" max="256" step="1">
                <span class="stat" id="equivBits">(256 bits equivalent)</span>
            </div>
            <div class="form-row" id="bitsRow" style="display:none;">
                <label data-i18n="bits_label_custom">Bits:</label>
                <input type="number" id="customBits" value="256" min="32" max="2048" step="8">
                <span class="stat" id="equivLength">(32 chars)</span>
                <div style="display:flex;gap:4px;flex-wrap:wrap;margin-left:4px;">
                    <button class="btn btn-xs bits-preset-cust" data-bits="32">32</button>
                    <button class="btn btn-xs bits-preset-cust" data-bits="64">64</button>
                    <button class="btn btn-xs bits-preset-cust active" data-bits="256">256</button>
                    <button class="btn btn-xs bits-preset-cust" data-bits="512">512</button>
                    <button class="btn btn-xs bits-preset-cust" data-bits="1024">1024</button>
                    <button class="btn btn-xs bits-preset-cust" data-bits="2048">2048</button>
                </div>
            </div>
            <div class="form-row" style="margin-top:8px;">
                <label data-i18n="charset_label">Charset:</label>
                <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
                    <label class="toggle-row"><input type="checkbox" id="chkLetters" checked> <span data-i18n="letters">Letters</span></label>
                    <label class="toggle-row"><input type="checkbox" id="chkNumbers" checked> <span data-i18n="numbers">Numbers</span></label>
                    <label class="toggle-row"><input type="checkbox" id="chkSymbols"> <span data-i18n="symbols">Symbols</span></label>
                    <label class="toggle-row"><input type="checkbox" id="chkExcludeSimilar"> <span data-i18n="exclude_similar">Exclude Similar</span></label>
                </div>
            </div>
            <div class="form-row">
                <label data-i18n="custom_chars">Custom:</label>
                <input type="text" id="customCharset" placeholder="Additional chars..." maxlength="64">
            </div>
            <div class="form-row" style="margin-top:8px;">
                <label data-i18n="separator_label">Separator:</label>
                <input type="text" id="separator" value="-" maxlength="4" style="width:60px;">
                <label data-i18n="interval_label" style="margin-left:8px;">Interval:</label>
                <input type="number" id="interval" value="8" min="1" max="64" style="width:70px;">
            </div>
            <div class="form-row">
                <label data-i18n="prefix_label">Prefix:</label>
                <input type="text" id="custPrefix" placeholder="e.g. key_" maxlength="32">
                <label data-i18n="key_type_label" style="margin-left:8px;">Type:</label>
                <input type="text" id="custKeyType" placeholder="e.g. api" maxlength="16">
                <label data-i18n="env_label" style="margin-left:8px;">Env:</label>
                <input type="text" id="custEnv" placeholder="e.g. prod" maxlength="16">
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span data-i18n="preview_title">👁️ Live Preview</span>
                <div style="display:flex;gap:8px;align-items:center;">
                    <span class="stat" data-i18n="preview_count_label">Show:</span>
                    <input type="number" id="previewCount" value="60" min="10" max="100" step="10" style="width:65px;">
                    <button class="btn btn-xs" id="copyAllPreview" data-i18n="copy_all">📋 Copy All</button>
                </div>
            </div>
            <div class="preview-area" id="previewArea"></div>
            <div class="preview-stat" id="previewStat"></div>
        </div>

        <div class="card">
            <div class="card-header" data-i18n="generation_title">📦 Batch Generation</div>
            <div class="form-row">
                <label data-i18n="count_label">Count:</label>
                <input type="number" id="genCount" value="100" min="1" max="1000000" step="1">
                <label data-i18n="format_label" style="margin-left:8px;">Format:</label>
                <select id="genFormat">
                    <option value="txt">TXT</option>
                    <option value="csv">CSV</option>
                    <option value="json">JSON</option>
                    <option value="zip">ZIP</option>
                </select>
                <button class="btn btn-primary" id="btnGenerate" data-i18n="generate_btn">⚡ Generate</button>
                <button class="btn btn-danger" id="btnStop" disabled data-i18n="stop_btn">⛔ Stop</button>
            </div>
            <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
            <div class="stat" id="progressText"></div>
        </div>
    </div>

    <div class="modal-overlay" id="stopModalOverlay">
        <div class="modal">
            <h3 data-i18n="stop_modal_title">⛔ Generation Stopped</h3>
            <p data-i18n="stop_modal_desc">Would you like to download the partial results?</p>
            <div class="btn-row">
                <button class="btn btn-primary" id="btnDownloadPartial" data-i18n="download_partial_btn">📥 Download Partial</button>
                <button class="btn" id="btnDiscardPartial" data-i18n="discard_btn">🗑️ Discard</button>
            </div>
        </div>
    </div>
<script>
(function() {
    // ═══════════════════════════════════════
    // 1. I18N — full translations (RU / EN)
    // ═══════════════════════════════════════
    const i18n = {
        en: {
            standard_settings: 'Standard Mode Settings',
            custom_settings: 'Custom Mode Settings',
            bits_label: 'Bits:',
            bits_label_custom: 'Bits:',
            prefix_label: 'Prefix:',
            key_type_label: 'Key Type:',
            env_label: 'Environment:',
            std_info: 'Uses crypto.getRandomValues + URL-safe Base64. No separator.',

            charset_label: 'Charset:',
            letters: 'Letters',
            numbers: 'Numbers',
            symbols: 'Symbols',

            copy_all: '📋 Copy All',
            generation_title: '📦 Batch Generation',
            count_label: 'Count:',
            format_label: 'Format:',
            generate_btn: '⚡ Generate',

            stop_modal_desc: 'Would you like to download the partial results?',
            download_partial_btn: '📥 Download Partial',
            discard_btn: '🗑️ Discard',

            preview_keys: '{count} preview keys',
            partial_downloaded: 'Downloaded {count} partial keys.',
        },
        ru: {
            standard_settings: 'Настройки стандартного режима',
            custom_settings: 'Настройки пользовательского режима',
            bits_label: 'Биты:',
            bits_label_custom: 'Биты:',
            prefix_label: 'Префикс:',
            key_type_label: 'Тип ключа:',
            env_label: 'Окружение:',
            std_info: 'Используется crypto.getRandomValues + URL-safe Base64. Без разделителей.',
            mode_toggle_label: 'Режим:',
            length_label: 'Длина:',
            charset_label: 'Набор символов:',
            letters: 'Буквы',
            numbers: 'Цифры',
            symbols: 'Символы',
            exclude_similar: 'Исключить похожие',

            interval_label: 'Интервал:',
            preview_title: '👁️ Предпросмотр',
            preview_count_label: 'Показывать:',
            copy_all: '📋 Копировать всё',

            preview_keys: 'Ключей в превью: {count}',
            partial_downloaded: 'Скачано {count} ключей (частично).',
        }
    };

    function t(key, replacements) {
        let str = (i18n[currentLang] && i18n[currentLang][key]) || i18n['en'][key] || key;
        if (replacements) {
            for (const [k, v] of Object.entries(replacements)) str = str.replace(`{${k}}`, v);
        }
        return str;
    }

    // ═══════════════════════════════════════
    // 2. STATE — single source of truth
    // ═══════════════════════════════════════
    const state = {
        mode: 'standard',               // 'standard' | 'custom'
        standardBits: 256,
        standardPrefix: '',
        standardKeyType: '',
        standardEnv: '',
        customMode: 'length',           // 'length' | 'bits'

        genFormat: 'txt',
        previewCount: 60,
        theme: 'dark',
        language: 'en',
        // Runtime
        isGenerating: false,
        worker: null,
        stopRequested: false,
        partialKeys: [],
    };

    let currentLang = 'en';

    // ═══════════════════════════════════════
    // 3. DOM CACHE
    // ═══════════════════════════════════════
    const $ = {};
    function cacheDom() {
        $.standardSettings = document.getElementById('standardSettings');
        $.customSettings = document.getElementById('customSettings');
        $.modeBadgeStandard = document.getElementById('modeBadgeStandard');
        $.modeBadgeCustom = document.getElementById('modeBadgeCustom');
        $.stdPrefix = document.getElementById('stdPrefix');
        $.stdKeyType = document.getElementById('stdKeyType');
        $.stdEnv = document.getElementById('stdEnv');
        $.customLength = document.getElementById('customLength');
        $.customBits = document.getElementById('customBits');
        $.lengthRow = document.getElementById('lengthRow');
        $.bitsRow = document.getElementById('bitsRow');
        $.equivBits = document.getElementById('equivBits');
        $.equivLength = document.getElementById('equivLength');
        $.chkLetters = document.getElementById('chkLetters');
        $.chkNumbers = document.getElementById('chkNumbers');
        $.chkSymbols = document.getElementById('chkSymbols');
        $.chkExcludeSimilar = document.getElementById('chkExcludeSimilar');
        $.customCharset = document.getElementById('customCharset');
        $.separator = document.getElementById('separator');
        $.interval = document.getElementById('interval');
        $.custPrefix = document.getElementById('custPrefix');
        $.custKeyType = document.getElementById('custKeyType');
        $.custEnv = document.getElementById('custEnv');
        $.previewCount = document.getElementById('previewCount');
        $.previewArea = document.getElementById('previewArea');
        $.previewStat = document.getElementById('previewStat');
        $.genCount = document.getElementById('genCount');
        $.genFormat = document.getElementById('genFormat');
        $.btnGenerate = document.getElementById('btnGenerate');

        $.progressBar = document.getElementById('progressBar');
        $.progressText = document.getElementById('progressText');
        $.stopModalOverlay = document.getElementById('stopModalOverlay');
        $.btnDownloadPartial = document.getElementById('btnDownloadPartial');
        $.btnDiscardPartial = document.getElementById('btnDiscardPartial');
        $.copyAllPreview = document.getElementById('copyAllPreview');
        $.langToggle = document.getElementById('langToggle');
        $.themeBtns = document.getElementById('themeBtns');

    // ═══════════════════════════════════════
    // 4. HELPERS — charset, encoding, rand
    // ═══════════════════════════════════════
    const SIMILAR_CHARS = new Set(['0','O','o','I','l','1']);
    const LETTERS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const NUMBERS = '0123456789';
    const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`';

    function buildCharset(settings) {
        let chars = '';
        if (settings.customCharsetLetters) chars += LETTERS;
        if (settings.customCharsetNumbers) chars += NUMBERS;
        if (settings.customCharsetSymbols) chars += SYMBOLS;
        if (settings.customCharsetCustom) chars += settings.customCharsetCustom;
        if (settings.customExcludeSimilar) {
            chars = [...new Set(chars)].filter(c => !SIMILAR_CHARS.has(c)).join('');
        } else {
            chars = [...new Set(chars)].join('');
        }
        return chars || (LETTERS + NUMBERS);
    }

    function getRandomBytes(n) {
        const arr = new Uint8Array(n);
        crypto.getRandomValues(arr);
        return arr;
    }

    function urlSafeBase64(bytes) {
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    // Unbiased random index using rejection sampling for uniform distribution
    function createUnbiasedRandIndex(charsetLength) {
        const max = Math.floor(0xFFFFFFFF / charsetLength) * charsetLength;
        const buffer = new Uint32Array(1024);
        let index = 1024;
        return function() {
            let rand;
            do {
                if (index >= 1024) {
                    crypto.getRandomValues(buffer);
                    index = 0;
                }
                rand = buffer[index++];
            } while (rand >= max);
            return rand % charsetLength;
        };
    }

    function createFastRandIndex(charsetLength) {
        return () => Math.floor(Math.random() * charsetLength);
    }

    // ═══════════════════════════════════════
    // 5. SINGLE GENERATOR FUNCTION
    // ═══════════════════════════════════════
    function generateKey(config, randIndexFn) {
        if (config.mode === 'standard') {
            const byteLen = config.standardBits / 8;
            const bytes = getRandomBytes(byteLen);
            const encoded = urlSafeBase64(bytes);
            const parts = [];
            if (config.standardPrefix) parts.push(config.standardPrefix);
            if (config.standardKeyType) parts.push(config.standardKeyType);
            if (config.standardEnv) parts.push(config.standardEnv);
            parts.push(encoded);
            return parts.join('');
        } else {
            const charset = buildCharset(config);
            let length = (config.customMode === 'bits')
                ? Math.ceil(config.customBits / 8)
                : config.customLength;
            const chars = [];
            for (let i = 0; i < length; i++) {
                chars.push(charset[randIndexFn()]);
            }
            let raw = chars.join('');
            const sep = config.customSeparator || '';
            const interval = (config.customMode === 'bits')
                ? config.customInterval
                : (config.customInterval > 0 ? config.customInterval : length + 1);
            if (sep && interval < raw.length) {
                const chunks = [];
                for (let i = 0; i < raw.length; i += interval) chunks.push(raw.slice(i, i + interval));
                raw = chunks.join(sep);
            }
            const parts = [];
            if (config.customPrefix) parts.push(config.customPrefix);
            if (config.customKeyType) parts.push(config.customKeyType);
            if (config.customEnv) parts.push(config.customEnv);
            parts.push(raw);
            return parts.join('');
        }
    }

    function getRandIndexFn(charsetLength) {
        return createUnbiasedRandIndex(charsetLength);
    }

    // (script continues – do not close)

    // ═══════════════════════════════════════
    // 6. WORKER — shared generator via string
    // ═══════════════════════════════════════
    function buildWorkerScript() {
        const genFn = generateKey.toString();
        const buildCharsetFn = buildCharset.toString();
        const similarSet = JSON.stringify([...SIMILAR_CHARS]);
        const lettersStr = JSON.stringify(LETTERS);
        const numbersStr = JSON.stringify(NUMBERS);
        const symbolsStr = JSON.stringify(SYMBOLS);
        return `
const SIMILAR_CHARS = new Set(${similarSet});
const LETTERS = ${lettersStr};
const NUMBERS = ${numbersStr};
const SYMBOLS = ${symbolsStr};
const buildCharset = ${buildCharsetFn};
const getRandomBytes = (n)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return a;};
const urlSafeBase64 = (b)=>{let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=/g,'');};
const createUnbiasedRandIndex = (len)=>{
    const max=Math.floor(0xFFFFFFFF/len)*len;
    const buf=new Uint32Array(1024);let idx=1024;
    return ()=>{let r;do{if(idx>=1024){crypto.getRandomValues(buf);idx=0;}r=buf[idx++];}while(r>=max);return r%len;};
};
const generateKey = ${genFn};
let stopFlag=false;
self.onmessage=function(e){
    if(e.data.type==='stop'){stopFlag=true;return;}
    if(e.data.type==='generate'){
        stopFlag=false;
        const cfg=e.data.config;
        const total=e.data.count;
        const chunkSize=1000;
        const allKeys=[];
        const charset=cfg.mode==='standard'?null:buildCharset(cfg);
        const randFn=cfg.mode==='standard'?null:createUnbiasedRandIndex(charset.length);
        for(let i=0;i<total;i+=chunkSize){
            if(stopFlag){self.postMessage({type:'stopped',keys:allKeys,progress:Math.round((i/total)*100)});return;}
            const batch=Math.min(chunkSize,total-i);
            for(let j=0;j<batch;j++) allKeys.push(generateKey(cfg,randFn));
            self.postMessage({type:'progress',progress:Math.round(((i+batch)/total)*100),count:allKeys.length});
        }
        self.postMessage({type:'complete',keys:allKeys,progress:100});
    }
};`;
    }

    function createWorker() {
        const blob = new Blob([buildWorkerScript()], { type: 'application/javascript' });
        return new Worker(URL.createObjectURL(blob));
    }

    // ═══════════════════════════════════════
    // 7. FILE OUTPUT — TXT, CSV, JSON, ZIP
    // ═══════════════════════════════════════
    function downloadKeys(keys, format, count) {
        const baseName = `keys${count}`;
        let blob, filename;
        const content = keys.join('\n') + '\n';
        switch (format) {
            case 'txt':
                blob = new Blob([content], { type: 'text/plain' });
                filename = `${baseName}.txt`;
                break;
            case 'csv':
                blob = new Blob([content], { type: 'text/csv' });
                filename = `${baseName}.csv`;
                break;
            case 'json':
                blob = new Blob([JSON.stringify(keys, null, 2)], { type: 'application/json' });
                filename = `${baseName}.json`;
                break;
            case 'zip':
                if (typeof JSZip !== 'undefined') {
                    const zip = new JSZip();
                    zip.file(`${baseName}.txt`, content);
                    zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }).then(zipBlob => {
                        triggerDownload(zipBlob, `${baseName}.zip`);
                    });
                    return;
                }
                // Fallback to TXT if JSZip missing
                blob = new Blob([content], { type: 'text/plain' });
                filename = `${baseName}.txt`;
                break;
            default:
                blob = new Blob([content], { type: 'text/plain' });
                filename = `${baseName}.txt`;
        }
        triggerDownload(blob, filename);
    }

    function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ═══════════════════════════════════════
    // 8. UI LOGIC — mode, theme, i18n refresh
    // ═══════════════════════════════════════
    function setMode(mode) {
        state.mode = mode;
        $.modeBadgeStandard.classList.toggle('active', mode === 'standard');
        $.modeBadgeCustom.classList.toggle('active', mode === 'custom');
        $.standardSettings.style.display = mode === 'standard' ? '' : 'none';
        $.customSettings.style.display = mode === 'custom' ? '' : 'none';
        schedulePreview();
        saveState();
    }

    function setCustomMode(cmode) {
        state.customMode = cmode;
        const isLength = cmode === 'length';
        document.getElementById('cmodeLength').classList.toggle('active', isLength);
        document.getElementById('cmodeBits').classList.toggle('active', !isLength);
        $.lengthRow.style.display = isLength ? '' : 'none';
        $.bitsRow.style.display = isLength ? 'none' : '';
        updateEquivalents();
        schedulePreview();
        saveState();
    }

    function updateEquivalents() {
        if (state.customMode === 'length') {
            $.equivBits.textContent = `(${state.customLength * 8} bits equivalent)`;
        } else {
            $.equivLength.textContent = `(${Math.ceil(state.customBits / 8)} chars)`;
        }
    }

    function setStandardBits(bits) {
        state.standardBits = bits;
        document.querySelectorAll('.bits-preset-std').forEach(b => {
            b.classList.toggle('active', parseInt(b.dataset.bits) === bits);
        });
        schedulePreview();
        saveState();
    }

    function setCustomBits(bits) {
        state.customBits = bits;
        document.querySelectorAll('.bits-preset-cust').forEach(b => {
            b.classList.toggle('active', parseInt(b.dataset.bits) === bits);
        });
        $.customBits.value = bits;
        updateEquivalents();
        schedulePreview();
        saveState();
    }

    function setTheme(theme) {
        state.theme = theme;
        document.body.setAttribute('data-theme', theme);
        document.querySelectorAll('#themeBtns [data-theme-val]').forEach(b => {
            b.classList.toggle('active', b.dataset.themeVal === theme);
        });
        saveState();
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'ru' : 'en';
        state.language = currentLang;
        $.langToggle.textContent = currentLang === 'en' ? '🌐 RU' : '🌐 EN';
        refreshI18n();
        schedulePreview();
        saveState();
    }

    function refreshI18n() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (el.tagName === 'INPUT' && el.type === 'text') return;
            if (el.tagName === 'BUTTON' || el.tagName === 'SPAN' || el.tagName === 'DIV' ||
                el.tagName === 'LABEL' || el.tagName === 'OPTION') {
                const translated = t(key);
                if (translated && !translated.includes('{')) el.textContent = translated;
            }
        });
        const stdInfo = document.querySelector('#standardSettings .stat');
        if (stdInfo) stdInfo.textContent = t('std_info');
        updatePreview();
    }

    function updateUIForGeneration(isGenerating) {
        state.isGenerating = isGenerating;
        $.btnGenerate.disabled = isGenerating;
        $.btnStop.disabled = !isGenerating;
        $.progressWrap.classList.toggle('visible', isGenerating);
        if (!isGenerating) $.progressBar.style.width = '0%';
    }

    function showStopModal() {
        $.stopModalOverlay.classList.add('visible');
    }

    function hideStopModal() {
        $.stopModalOverlay.classList.remove('visible');
    }

    // ═══════════════════════════════════════
    // 9. PREVIEW — uses same generateKey
    // ═══════════════════════════════════════
    let previewTimeout = null;

    function getSettingsSnapshot() {
        return {
            mode: state.mode,
            standardBits: state.standardBits,
            standardPrefix: state.standardPrefix,
            standardKeyType: state.standardKeyType,
            standardEnv: state.standardEnv,
            customMode: state.customMode,
            customLength: state.customLength,
            customBits: state.customBits,
            customCharsetLetters: state.customCharsetLetters,
            customCharsetNumbers: state.customCharsetNumbers,
            customCharsetSymbols: state.customCharsetSymbols,
            customCharsetCustom: state.customCharsetCustom,
            customExcludeSimilar: state.customExcludeSimilar,
            customSeparator: state.customSeparator,
            customInterval: state.customInterval,
            customPrefix: state.customPrefix,
            customKeyType: state.customKeyType,
            customEnv: state.customEnv,
        };
    }

    function updatePreview() {
        const cfg = getSettingsSnapshot();
        const count = Math.min(Math.max(state.previewCount, 10), 100);
        const keys = [];
        const charset = cfg.mode === 'standard' ? null : buildCharset(cfg);
        const randFn = cfg.mode === 'standard' ? null : getRandIndexFn(charset.length);
        for (let i = 0; i < count; i++) keys.push(generateKey(cfg, randFn));
        $.previewArea.textContent = keys.join('\n');
        $.previewStat.textContent = t('preview_keys', { count: keys.length });
    }

    function schedulePreview() {
        if (previewTimeout) clearTimeout(previewTimeout);
        previewTimeout = setTimeout(updatePreview, 200);
    }

    // ═══════════════════════════════════════
    // 10. GENERATION ORCHESTRATION
    // ═══════════════════════════════════════
    function startGeneration() {
        if (state.isGenerating) return;
        const count = Math.max(1, Math.min(1000000, parseInt(state.genCount) || 100));
        state.genCount = count;
        state.stopRequested = false;
        state.partialKeys = [];
        updateUIForGeneration(true);
        $.progressText.textContent = t('generating');
        $.progressBar.style.width = '0%';

        const cfg = getSettingsSnapshot();
        const worker = createWorker();
        state.worker = worker;

        worker.onmessage = function(e) {
            const msg = e.data;
            if (msg.type === 'progress') {
                $.progressBar.style.width = msg.progress + '%';
                $.progressText.textContent = `${msg.count.toLocaleString()} / ${count.toLocaleString()}`;
            } else if (msg.type === 'complete') {
                finishGeneration(msg.keys, count, false);
            } else if (msg.type === 'stopped') {
                finishGeneration(msg.keys, msg.keys.length, true);
            }
        };

        worker.onerror = function(err) {
            console.error('Worker error:', err);
            updateUIForGeneration(false);
            $.progressText.textContent = 'Error during generation.';
            if (state.worker) { state.worker.terminate(); state.worker = null; }
        };

        worker.postMessage({ type: 'generate', config: cfg, count });
    }

    function stopGeneration() {
        if (!state.isGenerating || !state.worker) return;
        state.stopRequested = true;
        state.worker.postMessage({ type: 'stop' });
    }

    function finishGeneration(keys, actualCount, wasStopped) {
        updateUIForGeneration(false);
        if (state.worker) { state.worker.terminate(); state.worker = null; }
        if (wasStopped && keys.length > 0) {
            state.partialKeys = keys;
            showStopModal();
        } else if (wasStopped && keys.length === 0) {
            $.progressText.textContent = t('stopped_early', { count: 0 });
        } else if (!wasStopped) {
            $.progressText.textContent = t('completed', { count: actualCount });
            downloadKeys(keys, state.genFormat, actualCount);
        }
        saveState();
    }

    function downloadPartial() {
        const keys = state.partialKeys;
        hideStopModal();
        if (keys && keys.length > 0) {
            downloadKeys(keys, state.genFormat, keys.length);
            $.progressText.textContent = t('partial_downloaded', { count: keys.length });
        }
        state.partialKeys = [];
    }

    function discardPartial() {
        hideStopModal();
        $.progressText.textContent = t('stopped_early', { count: state.partialKeys.length || 0 });
        state.partialKeys = [];
    }

    // ═══════════════════════════════════════
    // 11. STORAGE — persist all settings
    // ═══════════════════════════════════════
    const STORAGE_KEY = 'keyforge_pro_state_v3';

    function saveState() {
        const toSave = {
            mode: state.mode,
            standardBits: state.standardBits,
            standardPrefix: state.standardPrefix,
            standardKeyType: state.standardKeyType,
            standardEnv: state.standardEnv,
            customMode: state.customMode,
            customLength: state.customLength,
            customBits: state.customBits,
            customCharsetLetters: state.customCharsetLetters,
            customCharsetNumbers: state.customCharsetNumbers,
            customCharsetSymbols: state.customCharsetSymbols,
            customCharsetCustom: state.customCharsetCustom,
            customExcludeSimilar: state.customExcludeSimilar,
            customSeparator: state.customSeparator,
            customInterval: state.customInterval,
            customPrefix: state.customPrefix,
            customKeyType: state.customKeyType,
            customEnv: state.customEnv,
            genCount: state.genCount,
            genFormat: state.genFormat,
            previewCount: state.previewCount,
            theme: state.theme,
            language: state.language,
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); } catch (e) { /* quota exceeded – ignore */ }
    }

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const saved = JSON.parse(raw);
                if (saved.mode) state.mode = saved.mode;
                if (saved.standardBits) state.standardBits = saved.standardBits;
                if (saved.standardPrefix !== undefined) state.standardPrefix = saved.standardPrefix;
                if (saved.standardKeyType !== undefined) state.standardKeyType = saved.standardKeyType;
                if (saved.standardEnv !== undefined) state.standardEnv = saved.standardEnv;
                if (saved.customMode) state.customMode = saved.customMode;
                if (saved.customLength) state.customLength = saved.customLength;
                if (saved.customBits) state.customBits = saved.customBits;
                if (saved.customCharsetLetters !== undefined) state.customCharsetLetters = saved.customCharsetLetters;
                if (saved.customCharsetNumbers !== undefined) state.customCharsetNumbers = saved.customCharsetNumbers;
                if (saved.customCharsetSymbols !== undefined) state.customCharsetSymbols = saved.customCharsetSymbols;
                if (saved.customCharsetCustom !== undefined) state.customCharsetCustom = saved.customCharsetCustom;
                if (saved.customExcludeSimilar !== undefined) state.customExcludeSimilar = saved.customExcludeSimilar;
                if (saved.customSeparator !== undefined) state.customSeparator = saved.customSeparator;
                if (saved.customInterval) state.customInterval = saved.customInterval;
                if (saved.customPrefix !== undefined) state.customPrefix = saved.customPrefix;
                if (saved.customKeyType !== undefined) state.customKeyType = saved.customKeyType;
                if (saved.customEnv !== undefined) state.customEnv = saved.customEnv;
                if (saved.genCount) state.genCount = saved.genCount;
                if (saved.genFormat) state.genFormat = saved.genFormat;
                if (saved.previewCount) state.previewCount = saved.previewCount;
                if (saved.theme) state.theme = saved.theme;
                if (saved.language) state.language = saved.language;
            }
        } catch (e) { /* corrupted data – ignore, use defaults */ }
    }

    // ═══════════════════════════════════════
    // 12. EVENT BINDINGS
    // ═══════════════════════════════════════
    function bindEvents() {
        $.modeBadgeStandard.addEventListener('click', () => setMode('standard'));
        $.modeBadgeCustom.addEventListener('click', () => setMode('custom'));

        document.querySelectorAll('.bits-preset-std').forEach(btn => {
            btn.addEventListener('click', () => setStandardBits(parseInt(btn.dataset.bits)));
        });

        document.getElementById('cmodeLength').addEventListener('click', () => setCustomMode('length'));
        document.getElementById('cmodeBits').addEventListener('click', () => setCustomMode('bits'));

        document.querySelectorAll('.bits-preset-cust').forEach(btn => {
            btn.addEventListener('click', () => setCustomBits(parseInt(btn.dataset.bits)));
        });

        document.querySelectorAll('#themeBtns [data-theme-val]').forEach(btn => {
            btn.addEventListener('click', () => setTheme(btn.dataset.themeVal));
        });

        $.langToggle.addEventListener('click', toggleLanguage);

        [$.stdPrefix, $.stdKeyType, $.stdEnv].forEach(el => {
            el.addEventListener('input', () => {
                state.standardPrefix = $.stdPrefix.value;
                state.standardKeyType = $.stdKeyType.value;
                state.standardEnv = $.stdEnv.value;
                schedulePreview();
                saveState();
            });
        });

        $.customLength.addEventListener('input', () => {
            state.customLength = Math.max(4, Math.min(256, parseInt($.customLength.value) || 32));
            updateEquivalents();
            schedulePreview();
            saveState();
        });

        $.customBits.addEventListener('input', () => {
            let val = parseInt($.customBits.value) || 256;
            val = Math.max(32, Math.min(2048, val));
            val = Math.round(val / 8) * 8;
            state.customBits = val;
            $.customBits.value = val;
            setCustomBits(val);
            updateEquivalents();
            schedulePreview();
            saveState();
        });

        $.chkLetters.addEventListener('change', () => { state.customCharsetLetters = $.chkLetters.checked; schedulePreview(); saveState(); });
        $.chkNumbers.addEventListener('change', () => { state.customCharsetNumbers = $.chkNumbers.checked; schedulePreview(); saveState(); });
        $.chkSymbols.addEventListener('change', () => { state.customCharsetSymbols = $.chkSymbols.checked; schedulePreview(); saveState(); });
        $.chkExcludeSimilar.addEventListener('change', () => { state.customExcludeSimilar = $.chkExcludeSimilar.checked; schedulePreview(); saveState(); });

        $.customCharset.addEventListener('input', () => { state.customCharsetCustom = $.customCharset.value; schedulePreview(); saveState(); });

        [$.separator, $.interval, $.custPrefix, $.custKeyType, $.custEnv].forEach(el => {
            el.addEventListener('input', () => {
                state.customSeparator = $.separator.value;
                state.customInterval = parseInt($.interval.value) || 8;
                state.customPrefix = $.custPrefix.value;
                state.customKeyType = $.custKeyType.value;
                state.customEnv = $.custEnv.value;
                schedulePreview();
                saveState();
            });
        });

        $.previewCount.addEventListener('input', () => {
            state.previewCount = Math.max(10, Math.min(100, parseInt($.previewCount.value) || 60));
            schedulePreview();
            saveState();
        });

        $.genCount.addEventListener('input', () => {
            state.genCount = Math.max(1, Math.min(1000000, parseInt($.genCount.value) || 100));
            saveState();
        });

        $.genFormat.addEventListener('change', () => {
            state.genFormat = $.genFormat.value;
            saveState();
        });

        $.btnGenerate.addEventListener('click', startGeneration);
        $.btnStop.addEventListener('click', stopGeneration);

        $.copyAllPreview.addEventListener('click', () => {
            const text = $.previewArea.textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const orig = $.copyAllPreview.textContent;
                $.copyAllPreview.textContent = '✅ ' + t('copied');
                setTimeout(() => { $.copyAllPreview.textContent = orig; }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const orig = $.copyAllPreview.textContent;
                $.copyAllPreview.textContent = '✅ ' + t('copied');
                setTimeout(() => { $.copyAllPreview.textContent = orig; }, 1500);
            });
        });

        $.btnDownloadPartial.addEventListener('click', downloadPartial);
        $.btnDiscardPartial.addEventListener('click', discardPartial);
        $.stopModalOverlay.addEventListener('click', (e) => { if (e.target === $.stopModalOverlay) discardPartial(); });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.isGenerating) stopGeneration();
            if (e.key === 'Escape' && $.stopModalOverlay.classList.contains('visible')) discardPartial();
        });
    }

    // ═══════════════════════════════════════
    // 13. INITIALIZATION
    // ═══════════════════════════════════════
    function applyLoadedState() {
        setMode(state.mode);
        setStandardBits(state.standardBits);
        $.stdPrefix.value = state.standardPrefix;
        $.stdKeyType.value = state.standardKeyType;
        $.stdEnv.value = state.standardEnv;
        setCustomMode(state.customMode);
        $.customLength.value = state.customLength;
        $.customBits.value = state.customBits;
        $.chkLetters.checked = state.customCharsetLetters;
        $.chkNumbers.checked = state.customCharsetNumbers;
        $.chkSymbols.checked = state.customCharsetSymbols;
        $.chkExcludeSimilar.checked = state.customExcludeSimilar;
        $.customCharset.value = state.customCharsetCustom;
        $.separator.value = state.customSeparator;
        $.interval.value = state.customInterval;
        $.custPrefix.value = state.customPrefix;
        $.custKeyType.value = state.customKeyType;
        $.custEnv.value = state.customEnv;
        setCustomBits(state.customBits);
        $.genCount.value = state.genCount;
        $.genFormat.value = state.genFormat;
        $.previewCount.value = state.previewCount;
        setTheme(state.theme);
        currentLang = state.language;
        $.langToggle.textContent = currentLang === 'en' ? '🌐 RU' : '🌐 EN';
        refreshI18n();
        updateEquivalents();
        updatePreview();
    }

    function validateSystem() {
        const errors = [];
        const cfg = getSettingsSnapshot();
        cfg.mode = 'custom';
        cfg.customMode = 'bits';
        cfg.customBits = 256;
        cfg.customCharsetLetters = true;
        cfg.customCharsetNumbers = false;
        cfg.customCharsetSymbols = false;
        cfg.customCharsetCustom = '';
        cfg.customExcludeSimilar = false;
        cfg.customSeparator = '';
        cfg.customInterval = 8;
        cfg.customPrefix = '';
        cfg.customKeyType = '';
        cfg.customEnv = '';
        const charset = buildCharset(cfg);
        if (charset !== LETTERS) errors.push('Charset build failed for letters-only');
        const testKey = generateKey(cfg, () => 0);
        const expectedLen = Math.ceil(256 / 8);
        if (testKey.length < expectedLen) errors.push('Bits mode length calculation wrong');
        if (typeof generateKey !== 'function') errors.push('Single generator missing');
        if (typeof buildCharset !== 'function') errors.push('Charset builder missing');
        if (!i18n['en'] || !i18n['ru']) errors.push('i18n dictionaries incomplete');
        if (Object.keys(i18n['en']).length !== Object.keys(i18n['ru']).length) errors.push('i18n key count mismatch');
        if (errors.length > 0) console.error('⚠️ VALIDATION FAILED:', errors);
        else console.log('✅ System validated. Single generator, no duplicates, all features ready.');
    }

    function init() {
        cacheDom();
        loadState();
        bindEvents();
        applyLoadedState();
        validateSystem();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
