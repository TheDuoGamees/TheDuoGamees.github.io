<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Key Generator (Server)</title>

<style>
body {
    font-family: -apple-system, sans-serif;
    background: #0f0f1a;
    color: white;
    margin: 0;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 20px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: #4f7cff;
    color: white;
    margin-top: 5px;
}

.output {
    margin-top: 10px;
    max-height: 200px;
    overflow: auto;
    font-size: 12px;
    background: #000;
    padding: 10px;
    border-radius: 10px;
}

.status {
    text-align: center;
    font-size: 12px;
    margin-top: 10px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Server Generator</h2>

<input id="prefix" placeholder="prefix (api_live_)">
<input id="count" type="number" value="1000">
<input id="length" type="number" value="24">

<select id="type">
<option value="">Тип</option>
<option value="api">API</option>
<option value="sk">Secret</option>
<option value="pk">Public</option>
</select>

<select id="env">
<option value="">Env</option>
<option value="live">Live</option>
<option value="test">Test</option>
</select>

<button onclick="generate()">Сгенерировать</button>

<div class="status" id="status"></div>
<div class="output" id="output"></div>

</div>
</div>

<script>
let generatedKeys = [];

async function generate() {
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    const count = parseInt(document.getElementById("count").value);
    const length = parseInt(document.getElementById("length").value);

    const prefix = document.getElementById("prefix").value;
    const type = document.getElementById("type").value;
    const env = document.getElementById("env").value;

    status.innerText = "Отправка запроса...";

    try {
        const res = await fetch("https://theduogamees-github-io.onrender.com/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                count,
                length,
                prefix,
                type,
                env
            })
        });

        const data = await res.json();

        if (!data.success) {
            status.innerText = "Ошибка: " + data.error;
            return;
        }

        generatedKeys = data.keys;

        output.innerText = generatedKeys.slice(0, 100).join("\n");
        status.innerText = "Готово ✅ (" + data.count + ")";

    } catch (e) {
        status.innerText = "Ошибка соединения (сервер спит или упал)";
        console.error(e);
    }
}
</script>

</body>
</html>
