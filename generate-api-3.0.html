<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Key Generator Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
    color: #fff;
}

/* 📱 контейнер */
.container {
    max-width: 480px;
    margin: auto;
    padding: 16px;
}

/* 💎 карточка */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.08);
}

/* 📱 заголовок */
h1 {
    font-size: 20px;
    margin-bottom: 5px;
}

p {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 15px;
}

/* 🧩 форма */
.label {
    font-size: 12px;
    margin-bottom: 6px;
    display: block;
}

.input, select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 15px;
    margin-bottom: 12px;
}

.input:focus {
    outline: 1px solid #4f7cff;
}

/* 🧠 чекбоксы */
.options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
}

.options label {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 5px;
}

/* ⚡ кнопки */
.button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #4f7cff, #6f9cff);
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin-top: 5px;
}

.button.secondary {
    background: rgba(255,255,255,0.1);
}

/* 📊 статус */
.status {
    margin-top: 10px;
    font-size: 12px;
    text-align: center;
    color: #aaa;
}

/* 📦 вывод */
.output {
    margin-top: 15px;
    max-height: 200px;
    overflow: auto;
    font-size: 12px;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 10px;
}

/* 📱 адаптация */
@media (min-width: 768px) {
    .container {
        max-width: 600px;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>API Key Generator</h1>
<p>Профессиональная генерация ключей</p>

<!-- 📌 префикс -->
<label class="label">Префикс (например: api_live_)</label>
<input class="input" id="prefix" placeholder="api_live_">

<!-- 📌 тип -->
<label class="label">Тип ключа</label>
<select id="type">
<option value="">Без типа</option>
<option value="api">API</option>
<option value="sk">Secret Key</option>
<option value="pk">Public Key</option>
</select>

<!-- 📌 окружение -->
<label class="label">Окружение</label>
<select id="env">
<option value="">Без окружения</option>
<option value="live">Live</option>
<option value="test">Test</option>
</select>

<!-- 📌 параметры -->
<label class="label">Количество</label>
<input class="input" id="count" type="number" value="1000">

<label class="label">Длина</label>
<input class="input" id="length" type="number" value="24">

<!-- ⚙️ настройки -->
<div class="options">
<label><input type="checkbox" id="letters" checked> Буквы</label>
<label><input type="checkbox" id="digits" checked> Цифры</label>
<label><input type="checkbox" id="exclude"> Без похожих</label>
<label><input type="checkbox" id="crypto" checked> Безопасный режим</label>
</div>

<!-- 🎯 действия -->
<button class="button" onclick="generate()">Сгенерировать</button>
<button class="button secondary" onclick="copyAll()">Скопировать</button>
<button class="button secondary" onclick="downloadFile('txt')">TXT</button>
<button class="button secondary" onclick="downloadFile('csv')">CSV</button>
<button class="button secondary" onclick="downloadFile('json')">JSON</button>

<div class="status" id="status"></div>

<!-- 📦 вывод -->
<div class="output" id="output"></div>

</div>
</div>
<script>
let generatedKeys = [];

/* =========================
   🔐 КРИПТО / RANDOM
========================= */

function secureRandom(max) {
    if (window.crypto && crypto.getRandomValues) {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        return array[0] % max;
    } else {
        return Math.floor(Math.random() * max);
    }
}

/* =========================
   🔤 СИМВОЛЫ
========================= */

function getCharset() {
    const letters = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const digits = "0123456789";
    
    let charset = "";

    if (document.getElementById("letters").checked) charset += letters;
    if (document.getElementById("digits").checked) charset += digits;

    // fallback
    if (!charset) charset = letters + digits;

    // исключение похожих символов
    if (document.getElementById("exclude").checked) {
        charset = charset.replace(/[0Ool1I]/g, "");
    }

    return charset;
}

/* =========================
   🔑 ГЕНЕРАЦИЯ КЛЮЧА
========================= */

function generateKey(length, charset) {
    let result = "";
    const max = charset.length;

    for (let i = 0; i < length; i++) {
        result += charset[secureRandom(max)];
    }

    return result;
}

/* =========================
   🧠 СТРУКТУРА КЛЮЧА
========================= */

function buildPrefix() {
    const custom = document.getElementById("prefix").value.trim();
    const type = document.getElementById("type").value;
    const env = document.getElementById("env").value;

    let parts = [];

    if (type) parts.push(type);
    if (env) parts.push(env);

    let base = parts.join("_");

    if (custom) return custom;
    if (base) return base + "_";

    return "";
}

/* =========================
   ⚡ ГЕНЕРАЦИЯ */
async function generate() {
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    let count = parseInt(document.getElementById("count").value);
    let length = parseInt(document.getElementById("length").value);

    const prefix = document.getElementById("prefix").value;
    const type = document.getElementById("type").value;
    const env = document.getElementById("env").value;

    const letters = document.getElementById("letters").checked;
    const digits = document.getElementById("digits").checked;
    const exclude = document.getElementById("exclude").checked;

    status.innerText = "Запрос отправлен... (сервер может просыпаться)";

    try {
        const res = await fetch("https://theduogamees-github-io.onrender.com/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                count,
                length,
                prefix,
                type,
                env,
                letters,
                digits,
                exclude
            })
        });

        const data = await res.json();

        if (!data.success) {
            status.innerText = "Ошибка: " + data.error;
            return;
        }

        generatedKeys = data.keys;

        output.innerText = generatedKeys.slice(0, 100).join("\n");
        status.innerText = "Готово ✅ (" + data.count + ")";

    } catch (err) {
        status.innerText = "Ошибка подключения (сервер спит или упал)";
        console.error(err);
    }
}
    
/* =========================
   📋 КОПИРОВАНИЕ
========================= */

function copyAll() {
    if (!generatedKeys.length) return alert("Нет данных");

    navigator.clipboard.writeText(generatedKeys.join("\n"));
    alert("Скопировано!");
}

/* =========================
   📦 ЭКСПОРТ
========================= */

function downloadFile(type) {
    if (!generatedKeys.length) return alert("Сначала сгенерируй");

    let content = "";
    let filename = "";

    if (type === "txt") {
        content = generatedKeys.join("\n");
        filename = "keys.txt";
    }

    if (type === "csv") {
        content = "key\n" + generatedKeys.join("\n");
        filename = "keys.csv";
    }

    if (type === "json") {
        content = JSON.stringify(generatedKeys, null, 2);
        filename = "keys.json";
    }

    const blob = new Blob([content], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();

    URL.revokeObjectURL(url);
}
</script>
