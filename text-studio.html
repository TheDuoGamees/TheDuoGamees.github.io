<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>Text Studio</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #e8e8ed;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #aeaeb2;
            --border-color: #d2d2d7;
            --accent: #0071e3;
            --accent-hover: #005bbf;
            --accent-light: #e8f2fd;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.14);
            --toolbar-bg: #fbfbfd;
            --editor-bg: #ffffff;
            --card-bg: #ffffff;
            --card-hover: #f8f8fa;
            --tag-bg: #f0f0f3;
            --tag-text: #1d1d1f;
            --danger: #e53935;
            --danger-hover: #c62828;
            --success: #2e7d32;
            --success-light: #e8f5e9;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --transition-fast: 150ms ease;
            --transition-normal: 200ms ease;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        [data-theme="dark"] {
            --bg-primary: #1c1c1e;
            --bg-secondary: #2c2c2e;
            --bg-tertiary: #3a3a3c;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #6e6e73;
            --border-color: #48484a;
            --accent: #0a84ff;
            --accent-hover: #409cff;
            --accent-light: #1a3a5c;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
            --toolbar-bg: #2c2c2e;
            --editor-bg: #1c1c1e;
            --card-bg: #2c2c2e;
            --card-hover: #3a3a3c;
            --tag-bg: #3a3a3c;
            --tag-text: #f5f5f7;
            --danger: #ff453a;
            --danger-hover: #ff6961;
            --success: #30d158;
            --success-light: #1a3a2a;
            --warning: #ffd60a;
            --warning-light: #3a3520;
        }
        [data-theme="amoled"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-tertiary: #707070;
            --border-color: #2a2a2a;
            --accent: #4da6ff;
            --accent-hover: #7abfff;
            --accent-light: #0d2137;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.7);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.8);
            --toolbar-bg: #080808;
            --editor-bg: #000000;
            --card-bg: #0a0a0a;
            --card-hover: #141414;
            --tag-bg: #1a1a1a;
            --tag-text: #ffffff;
            --danger: #ff453a;
            --danger-hover: #ff6961;
            --success: #30d158;
            --success-light: #0a1a10;
            --warning: #ffd60a;
            --warning-light: #1a1800;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            transition: background var(--transition-normal), color var(--transition-normal);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 10px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            z-index: 10;
            min-height: 48px;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 6px;
            flex-shrink: 0;
        }
        .logo {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-right: 8px;
            white-space: nowrap;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font-sans);
            white-space: nowrap;
            transition: all var(--transition-fast);
            min-height: 36px;
            min-width: 36px;
            position: relative;
            outline: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        .btn:hover {
            background: var(--bg-tertiary);
        }
        .btn:active {
            transform: scale(0.95);
            background: var(--bg-tertiary);
        }
        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            pointer-events: none;
        }
        .btn-icon-only {
            padding: 7px;
            min-width: 36px;
        }
        .btn-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-accent:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-danger {
            color: var(--danger);
        }
        .btn-danger:hover {
            background: #fce4e4;
        }
        [data-theme="dark"] .btn-danger:hover,
        [data-theme="amoled"] .btn-danger:hover {
            background: #2a1010;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 0.78rem;
            min-height: 30px;
            border-radius: 6px;
        }
        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 120px;
        }
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .main-textarea {
            width: 100%;
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            line-height: 1.7;
            background: var(--editor-bg);
            color: var(--text-primary);
            transition: background var(--transition-normal), color var(--transition-normal);
            min-height: 100px;
            tab-size: 2;
            -moz-tab-size: 2;
        }
        .main-textarea::placeholder {
            color: var(--text-tertiary);
        }
        .preview-panel {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            font-family: var(--font-sans);
            line-height: 1.6;
            display: none;
            word-wrap: break-word;
        }
        .preview-panel.active {
            display: block;
        }
        .preview-panel h1,
        .preview-panel h2,
        .preview-panel h3 {
            margin-top: 0.8em;
            margin-bottom: 0.4em;
        }
        .preview-panel h1 {
            font-size: 1.6rem;
        }
        .preview-panel h2 {
            font-size: 1.3rem;
        }
        .preview-panel h3 {
            font-size: 1.1rem;
        }
        .preview-panel p {
            margin-bottom: 0.6em;
        }
        .preview-panel code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85em;
        }
        .preview-panel pre {
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.85em;
            margin-bottom: 0.6em;
        }
        .preview-panel pre code {
            background: none;
            padding: 0;
        }
        .preview-panel blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            color: var(--text-secondary);
            margin: 0.6em 0;
        }
        .preview-panel ul,
        .preview-panel ol {
            padding-left: 1.5em;
            margin-bottom: 0.6em;
        }
        .preview-panel a {
            color: var(--accent);
        }
        .preview-panel table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 0.6em;
        }
        .preview-panel th,
        .preview-panel td {
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            text-align: left;
        }
        .preview-panel th {
            background: var(--bg-tertiary);
        }
        .tabs-container {
            flex-shrink: 0;
            border-top: 1px solid var(--border-color);
            background: var(--toolbar-bg);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            z-index: 5;
        }
        .tabs-container::-webkit-scrollbar {
            display: none;
        }
        .tabs-row {
            display: flex;
            gap: 0;
            padding: 0 8px;
            min-width: max-content;
        }
        .tab-btn {
            padding: 10px 13px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: var(--font-sans);
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all var(--transition-fast);
            outline: none;
            touch-action: manipulation;
            flex-shrink: 0;
            letter-spacing: -0.01em;
        }
        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }
        .tab-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
            border-radius: 4px 4px 0 0;
        }
        .tool-panel {
            flex-shrink: 0;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            overflow-y: auto;
            max-height: 45vh;
            z-index: 4;
            transition: all var(--transition-fast);
        }
        .tool-panel:empty {
            display: none;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            width: 100%;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            text-align: center;
            transition: all var(--transition-fast);
        }
        .stat-card:hover {
            background: var(--card-hover);
            box-shadow: var(--shadow-sm);
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.02em;
        }
        .stat-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .pill-btn {
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.82rem;
            font-family: var(--font-sans);
            transition: all var(--transition-fast);
            white-space: nowrap;
            touch-action: manipulation;
            outline: none;
        }
        .pill-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }
        .pill-btn:active {
            transform: scale(0.95);
        }
        .pill-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .input-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }
        .input-field {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--editor-bg);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: var(--font-sans);
            outline: none;
            transition: all var(--transition-fast);
            flex: 1;
            min-width: 100px;
        }
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .highlight-match {
            background: var(--warning);
            color: #000;
            border-radius: 2px;
            padding: 1px 2px;
        }
        .diff-added {
            background: #d4edda;
            color: #155724;
        }
        .diff-removed {
            background: #f8d7da;
            color: #721c24;
        }
        .diff-unchanged {
            color: var(--text-secondary);
        }
        [data-theme="dark"] .diff-added {
            background: #1a3a2a;
            color: #30d158;
        }
        [data-theme="dark"] .diff-removed {
            background: #3a1a1a;
            color: #ff453a;
        }
        [data-theme="amoled"] .diff-added {
            background: #0a2a10;
            color: #30d158;
        }
        [data-theme="amoled"] .diff-removed {
            background: #2a0a0a;
            color: #ff453a;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            pointer-events: none;
            transition: transform var(--transition-normal);
            box-shadow: var(--shadow-lg);
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .split-view {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow: hidden;
        }
        .split-textarea {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            background: var(--editor-bg);
            color: var(--text-primary);
            resize: none;
            outline: none;
            min-height: 80px;
            transition: all var(--transition-fast);
        }
        .split-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .diff-output {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 60px;
            max-height: 250px;
        }
        @media (min-width:768px) {
            .toolbar {
                padding: 8px 16px;
                gap: 6px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.88rem;
            }
            .main-textarea {
                padding: 20px 24px;
                font-size: 1rem;
            }
            .tabs-row {
                padding: 0 12px;
            }
            .tab-btn {
                padding: 11px 16px;
                font-size: 0.84rem;
            }
            .tool-panel {
                padding: 12px 16px;
                gap: 8px;
            }
            .stat-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            .preview-panel {
                padding: 20px 24px;
                border-left: 1px solid var(--border-color);
                border-top: none;
            }
            .editor-area.split-horizontal {
                flex-direction: row;
            }
            .editor-area.split-horizontal .main-textarea {
                flex: 1;
                border-right: 1px solid var(--border-color);
            }
            .editor-area.split-horizontal .preview-panel {
                flex: 1;
                border-top: none;
                border-left: none;
            }
            .split-view {
                flex-direction: row;
            }
            .diff-output {
                max-height: none;
            }
        }
        @media (min-width:1024px) {
            .app-container {
                border-left: 1px solid var(--border-color);
                border-right: 1px solid var(--border-color);
            }
            .stat-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
        @media (max-width:360px) {
            .toolbar {
                gap: 1px;
                padding: 4px 6px;
            }
            .btn {
                padding: 5px 7px;
                font-size: 0.75rem;
                min-height: 30px;
                min-width: 30px;
                gap: 2px;
            }
            .btn svg {
                width: 15px;
                height: 15px;
            }
            .logo {
                font-size: 0.95rem;
                margin-right: 2px;
            }
            .tab-btn {
                padding: 8px 9px;
                font-size: 0.7rem;
            }
            .toolbar-sep {
                margin: 0 2px;
                height: 18px;
            }
        }
    </style>
</head>

            function t(key) { return (LANGUAGES[state.language] && LANGUAGES[state.language][key]) || key; }

            function saveState() {
                if (!state.autosave) return;
                try {
                    const toSave = {
                        text: state.text,
                        comparisonText: state.comparisonText,
                        theme: state.theme,
                        language: state.language,
                        activeCategory: state.activeCategory,
                        fontSize: state.fontSize,
                        tabSize: state.tabSize,
                        autosave: state.autosave,
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                } catch (e) {}
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const saved = JSON.parse(raw);
                        if (typeof saved.text === 'string') state.text = saved.text;
                        if (typeof saved.comparisonText === 'string') state.comparisonText = saved.comparisonText;
                        if (['light', 'dark', 'amoled'].includes(saved.theme)) state.theme = saved.theme;
                        if (['en', 'ru'].includes(saved.language)) state.language = saved.language;
                        if (CATEGORIES.some(c => c.id === saved.activeCategory)) state.activeCategory =
                            saved.activeCategory;
                        if (typeof saved.fontSize === 'number' && saved.fontSize >= 10 && saved.fontSize <= 32) state
                            .fontSize = saved.fontSize;
                        if (typeof saved.tabSize === 'number' && saved.tabSize >= 1 && saved.tabSize <= 8) state.tabSize =
                            saved.tabSize;
                        if (typeof saved.autosave === 'boolean') state.autosave = saved.autosave;
                    }
                } catch (e) {}
                if (!state.theme || !['light', 'dark', 'amoled'].includes(state.theme)) {
                    const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
                    state.theme = prefersDark ? 'dark' : 'light';
                }
            }

            function applyTheme() {
                document.body.setAttribute('data-theme', state.theme);
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (metaTheme) {
                    const colors = { light: '#ffffff', dark: '#1c1c1e', amoled: '#000000' };
                    metaTheme.setAttribute('content', colors[state.theme] || '#ffffff');
                }
                updateThemeIcon();
            }

            function updateThemeIcon() {
                const svg = dom.iconTheme;
                if (state.theme === 'light') {
                    svg.innerHTML =
                        '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
                } else {
                    svg.innerHTML =
                        '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
                }
            }

            function showToast(msg) {
                dom.toast.textContent = msg;
                dom.toast.classList.add('show');
                clearTimeout(dom.toast._timeout);
                dom.toast._timeout = setTimeout(() => dom.toast.classList.remove('show'), 1800);
            }

            function pushUndo() {
                if (state.undoStack.length >= state.maxUndo) state.undoStack.shift();
                state.undoStack.push(state.text);
                state.redoStack = [];
            }

            function undo() {
                if (state.undoStack.length === 0) return;
                state.redoStack.push(state.text);
                state.text = state.undoStack.pop();
                dom.mainTextarea.value = state.text;
                onTextChanged(false);
            }

            function redo() {
                if (state.redoStack.length === 0) return;
                state.undoStack.push(state.text);
                state.text = state.redoStack.pop();
                dom.mainTextarea.value = state.text;
                onTextChanged(false);
            }

            function setText(newText, pushHistory = true) {
                if (newText === state.text) return;
                if (pushHistory) pushUndo();
                state.text = newText;
                dom.mainTextarea.value = state.text;
                onTextChanged(false);
            }

            function onTextChanged(pushHistory = true) {
                if (pushHistory && state.text !== dom.mainTextarea.value) {
                    pushUndo();
                    state.text = dom.mainTextarea.value;
                    state.redoStack = [];
                }
                state.text = dom.mainTextarea.value;
                autoResizeTextarea();
                updateLivePreview();
                updateToolPanel();
                debouncedSave();
            }

            function autoResizeTextarea() {
                const ta = dom.mainTextarea;
                ta.style.height = 'auto';
                ta.style.height = Math.max(100, ta.scrollHeight) + 'px';
            }

            function updateLivePreview() {
                if (state.activeCategory === 'markdown') {
                    renderMarkdownPreview();
                } else if (state.activeCategory === 'html' && state.activeTool === 'htmlPreview') {
                    renderHtmlPreview();
                } else {
                    dom.previewPanel.classList.remove('active');
                    dom.editorArea.classList.remove('split-horizontal');
                }
            }

            function renderMarkdownPreview() {
                dom.previewPanel.classList.add('active');
                if (window.innerWidth >= 768) dom.editorArea.classList.add('split-horizontal');
                else dom.editorArea.classList.remove('split-horizontal');
                dom.previewPanel.innerHTML = parseMarkdown(state.text);
            }

            function renderHtmlPreview() {
                dom.previewPanel.classList.add('active');
                if (window.innerWidth >= 768) dom.editorArea.classList.add('split-horizontal');
                else dom.editorArea.classList.remove('split-horizontal');
                const safeHtml = state.text;
                dom.previewPanel.innerHTML =
                    '<iframe sandbox="allow-scripts" style="width:100%;height:100%;min-height:300px;border:none;background:#fff;" srcdoc="' +
                    safeHtml.replace(/"/g, '&quot;') + '"></iframe>';
            }

            function parseMarkdown(md) {
                if (!md) return '<p style="color:var(--text-tertiary)">' + t('noText') + '</p>';
                let html = md;
                html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
                html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
                html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
                html = html.replace(/^---$/gm, '<hr>');
                html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
                html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
                html = html.replace(/\n\n/g, '</p><p>');
                html = html.replace(/\n/g, '<br>');
                html = '<p>' + html + '</p>';
                html = html.replace(/<p><\/p>/g, '');
                html = html.replace(/<p>(<h[1-4]>)/g, '$1');
                html = html.replace(/(<\/h[1-4]>)<\/p>/g, '$1');
                html = html.replace(/<p>(<ul>)/g, '$1');
                html = html.replace(/(<\/ul>)<\/p>/g, '$1');
                html = html.replace(/<p>(<blockquote>)/g, '$1');
                html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
                html = html.replace(/<p>(<pre>)/g, '$1');
                html = html.replace(/(<\/pre>)<\/p>/g, '$1');
                html = html.replace(/<p>(<hr>)<\/p>/g, '$1');
                return html;
            }

            function updateToolPanel() {
                dom.toolPanel.innerHTML = '';
                const cat = state.activeCategory;
                if (cat === 'statistics') renderStatistics();
                else if (cat === 'case') renderCaseTools();
                else if (cat === 'cleaning') renderCleaningTools();
                else if (cat === 'transform') renderTransformTools();
                else if (cat === 'formatting') renderFormattingTools();
                else if (cat === 'search') renderSearchTools();
                else if (cat === 'markdown') renderMarkdownTools();
                else if (cat === 'html') renderHtmlTools();
                else if (cat === 'encoding') renderEncodingTools();
                else if (cat === 'json') renderJsonTools();
                else if (cat === 'csv') renderCsvTools();
                else if (cat === 'regex') renderRegexTools();
                else if (cat === 'diff') renderDiffTools();
                else if (cat === 'generate') renderGenerateTools();
                else if (cat === 'settings') renderSettingsTools();
                updateLivePreview();
            }

            function renderStatistics() {
                const text = state.text;
                const chars = text.length;
                const charsNoSpace = text.replace(/\s/g, '').length;
                const wordsArr = text.trim() ? text.trim().split(/\s+/) : [];
                const wordCount = wordsArr.length;
                const sentences = text.split(/[.!?]+/).filter(s => s.trim()).length;
                const paragraphs = text.split(/\n\n+/).filter(p => p.trim()).length;
                const uniqueWords = new Set(wordsArr.map(w => w.toLowerCase().replace(/[^a-zа-яё0-9]/gi, ''))).size;
                const avgWordLen = wordCount > 0 ? (charsNoSpace / wordCount).toFixed(1) : '0';
                const avgSentLen = sentences > 0 ? (wordCount / sentences).toFixed(1) : '0';
                const readTime = Math.max(1, Math.ceil(wordCount / 200));
                const speakTime = Math.max(1, Math.ceil(wordCount / 130));
                const freq = {};
                wordsArr.forEach(w => {
                    const cw = w.toLowerCase().replace(/[^a-zа-яё0-9]/gi, '');
                    if (cw && cw.length > 1) freq[cw] = (freq[cw] || 0) + 1;
                });

            function parseCSV(text) {
                const rows = [];
                let row = [];
                let field = '';
                let inQuotes = false;
                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    if (inQuotes) {
                        if (ch === '"') {
                            if (i + 1 < text.length && text[i + 1] === '"') { field += '"';
                                i++; } else { inQuotes = false; }
                        } else { field += ch; }
                    } else {
                        if (ch === '"') { inQuotes = true; } else if (ch === ',') { row.push(field);
                            field = ''; } else if (ch === '\n') { row.push(field);
                            rows.push(row);
                            row = [];
                            field = ''; } else if (ch === '\r') {} else { field += ch; }
                    }
                }
                row.push(field);
                if (row.some(f => f !== '') || rows.length === 0) rows.push(row);
                return rows.filter(r => r.some(f => f.trim() !== ''));
            }

            function htmlTableToCsv(html) {
                const match = html.match(/<table[^>]*>([\s\S]*?)<\/table>/i);
                if (!match) return null;
                const tableContent = match[1];
                const rows = [];
                const trMatches = tableContent.match(/<tr[^>]*>([\s\S]*?)<\/tr>/gi);
                if (!trMatches) return null;
                trMatches.forEach(tr => {
                    const cells = [];
                    const cellMatches = tr.match(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi);
                    if (cellMatches) {
                        cellMatches.forEach(tc => {
                            const content = tc.replace(/<[^>]*>/g, '').replace(/"/g, '""').trim();
                            cells.push('"' + content + '"');
                        });
                    }
                    if (cells.length > 0) rows.push(cells.join(','));
                });
                return rows.join('\n');
            }

            function generateLorem(count) {
                const words = ['lorem', 'ipsum', 'dolor', 'sit', 'amet', 'consectetur', 'adipiscing', 'elit', 'sed', 'do',
                    'eiusmod', 'tempor', 'incididunt', 'ut', 'labore', 'et', 'dolore', 'magna', 'aliqua', 'enim', 'ad',

                    'voluptate', 'velit', 'esse', 'cillum', 'dolore', 'eu', 'fugiat', 'nulla', 'pariatur'
                ];
                const paragraphs = [];
                for (let p = 0; p < Math.ceil(count / 40); p++) {
                    const len = Math.min(40, count - p * 40);
                    if (len <= 0) break;
                    let para = '';
                    for (let i = 0; i < len; i++) { para += words[Math.floor(Math.random() * words.length)] + ' '; }

                for (let i = 0; i < count; i++) {
                    result.push(subjects[Math.floor(Math.random() * subjects.length)] + verbs[Math.floor(Math.random() *
                        verbs.length)] + ' ' + objects[Math.floor(Math.random() * objects.length)] + '.');
                }
                return result.join(' ');
            }

            function generateNicknames(count) {
                const prefixes = ['Shadow', 'Cyber', 'Neon', 'Pixel', 'Quantum', 'Turbo', 'Mega', 'Ultra', 'Hyper',
                    'Crypto', 'Blaze', 'Storm', 'Frost', 'Thunder', 'Solar'
                ];
                const suffixes = ['Wolf', 'Phoenix', 'Dragon', 'Hawk', 'Tiger', 'Viper', 'Raven', 'Ghost', 'Knight',
                    'Wizard', 'Ninja', 'Samurai', 'Hunter', 'Legend', 'Master'
                ];
                const result = [];
                for (let i = 0; i < count; i++) {
                    result.push(prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() *
                        suffixes.length)] + Math.floor(Math.random() * 100));
                }
                return result.join('\n');
            }

            function renderSettingsTools() {
                dom.toolPanel.innerHTML =
                    '<div class="input-row" style="gap:12px;">' +
                    '<span style="font-size:0.82rem;">' + t('settingsFontSize') +
                    '</span><input class="input-field" id="settingFontSize" type="number" min="10" max="32" value="' +
                    state.fontSize + '" style="max-width:70px;">' +
                    '<span style="font-size:0.82rem;">' + t('settingsTabSize') +
                    '</span><input class="input-field" id="settingTabSize" type="number" min="1" max="8" value="' + state
                    .tabSize + '" style="max-width:60px;">' +
                    '<button class="pill-btn" id="btnToggleAutosave">' + t('settingsAutosave') + ': ' + (state.autosave ? t(
                        'settingsOn') : t('settingsOff')) + '</button>' +
                    '<button class="btn btn-sm" id="btnImportFile">' + t('importFile') + '</button>' +
                    '</div>';
                document.getElementById('settingFontSize')?.addEventListener('change', function() {
                    const val = parseInt(this.value);
                    if (val >= 10 && val <= 32) { state.fontSize = val;
                        dom.mainTextarea.style.fontSize = val + 'px';
                        saveState(); }
                });
                document.getElementById('settingTabSize')?.addEventListener('change', function() {
                    const val = parseInt(this.value);
                    if (val >= 1 && val <= 8) { state.tabSize = val;
                        dom.mainTextarea.style.tabSize = val;
                        dom.mainTextarea.style.MozTabSize = val;
                        saveState(); }
                });
                document.getElementById('btnToggleAutosave')?.addEventListener('click', function() {
                    state.autosave = !state.autosave;
                    this.textContent = t('settingsAutosave') + ': ' + (state.autosave ? t('settingsOn') : t(
                        'settingsOff'));
                    saveState();
                });
                document.getElementById('btnImportFile')?.addEventListener('click', () => dom.hiddenFileInput.click());
            }

            function bindPillClicks(handlers) {
                dom.toolPanel.querySelectorAll('.pill-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const tool = this.dataset.tool;
                        if (handlers[tool]) handlers[tool]();
                    });
                });
            }

            function escapeRegex(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

            function htmlEscapeAttr(str) { return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g,
                    '&lt;').replace(/>/g, '&gt;'); }

            function htmlEscapeText(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

            function renderTabs() {
                dom.tabsRow.innerHTML = CATEGORIES.map(c =>
                    '<button class="tab-btn' + (c.id === state.activeCategory ? ' active' : '') + '" data-cat="' + c
                    .id + '" role="tab" aria-selected="' + (c.id === state.activeCategory ? 'true' : 'false') +
                    '">' + c.icon + ' ' + t(c.labelKey) + '</button>'
                ).join('');
                dom.tabsRow.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        state.activeCategory = this.dataset.cat;
                        state.activeTool = null;
                        dom.previewPanel.classList.remove('active');
                        dom.editorArea.classList.remove('split-horizontal');
                        dom.previewPanel.innerHTML = '';
                        renderTabs();
                        updateToolPanel();
                        saveState();
                    });
                });
            }

            function debouncedSave() {
                clearTimeout(debouncedSave._timer);
                debouncedSave._timer = setTimeout(saveState, 400);
            }

            function init() {
                loadState();
                applyTheme();
                dom.mainTextarea.value = state.text;
                dom.mainTextarea.style.fontSize = state.fontSize + 'px';
                dom.mainTextarea.style.tabSize = state.tabSize;
                dom.mainTextarea.style.MozTabSize = state.tabSize;
                dom.mainTextarea.placeholder = t('placeholder');
                renderTabs();
                updateToolPanel();
                autoResizeTextarea();
                dom.mainTextarea.addEventListener('input', () => onTextChanged(true));
                dom.mainTextarea.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault();
                        undo(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && e.shiftKey) { e.preventDefault();
                        redo(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Z') { e.preventDefault();
                        redo(); }
                });
                dom.btnUndo.addEventListener('click', undo);
                dom.btnRedo.addEventListener('click', redo);
                dom.btnTheme.addEventListener('click', () => {
                    const themes = ['light', 'dark', 'amoled'];
                    const idx = themes.indexOf(state.theme);
                    state.theme = themes[(idx + 1) % 3];
                    applyTheme();
                    saveState();
                });
                dom.btnLang.addEventListener('click', () => {
                    state.language = state.language === 'en' ? 'ru' : 'en';
                    dom.mainTextarea.placeholder = t('placeholder');
                    renderTabs();
                    updateToolPanel();
                    saveState();
                });
                dom.btnCopy.addEventListener('click', () => {
                    if (!state.text) { showToast(t('noText')); return; }
                    navigator.clipboard.writeText(state.text).then(() => showToast(t('copied'))).catch(() => {
                        dom.mainTextarea.select();
                        document.execCommand('copy');
                        showToast(t('copied'));
                    });
                });
                dom.btnPaste.addEventListener('click', async () => {
                    try {
                        const clipText = await navigator.clipboard.readText();
                        if (clipText) { setText(state.text + clipText);
                            showToast(t('pasted')); }
                    } catch (e) { showToast('Could not paste'); }
                });
                dom.btnClear.addEventListener('click', () => {
                    if (state.text) { setText('');
                        showToast(t('cleared')); }
                });
                dom.btnDownload.addEventListener('click', () => {
                    if (!state.text) { showToast(t('noText')); return; }
                    downloadFile('textstudio.txt', state.text, 'text/plain');
                    showToast(t('downloaded'));
                });
                dom.hiddenFileInput.addEventListener('change', function() {
                    const file = this.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(e) { setText(e.target.result); };
                    reader.readAsText(file);
                    this.value = '';
                });
                const editorWrapper = document.getElementById('editorWrapper');
                editorWrapper.addEventListener('dragover', function(e) { e.preventDefault();
                    e.stopPropagation(); });
                editorWrapper.addEventListener('drop', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const file = e.dataTransfer.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(ev) { setText(ev.target.result); };
                        reader.readAsText(file);
                    }
                });
                window.addEventListener('resize', () => { updateLivePreview();
                    autoResizeTextarea(); });
                window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(e) {
                    if (!localStorage.getItem(STORAGE_KEY) || !JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')
                        .theme) {
                        state.theme = e.matches ? 'dark' : 'light';
                        applyTheme();
                        saveState();
                    }
                });
                updateThemeIcon();
            }

            function downloadFile(filename, content, mimeType) {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            init();
        })();
    </script>
</body>
</html>
