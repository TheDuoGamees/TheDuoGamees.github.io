<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Key Generator</title>
  <link rel="stylesheet" href="">
<style>
  /* =========================
   BASE / RESET
========================= */
 * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  transition: 0.25s ease;
}

/* =========================
   THEMES
========================= */
:root {
  --bg: #0f1115;
  --panel: #1a1d24;
  --text: #e6e6e6;
  --muted: #9aa0a6;
  --accent: #4f8cff;
  --danger: #ff4d4f;
}

body.light {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --text: #1a1a1a;
  --muted: #6b7280;
  --accent: #3b82f6;
}

body.neon {
  --bg: #0a0f1f;
  --panel: #111827;
  --text: #00ffe1;
  --accent: #ff00ff;
}

/* =========================
   LAYOUT
========================= */
#app {
  max-width: 1100px;
  margin: auto;
  padding: 16px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.header h1 {
  font-size: 20px;
}

.header-controls {
  display: flex;
  gap: 8px;
}

/* =========================
   PANELS
========================= */
.panel {
  background: var(--panel);
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

/* =========================
   GRID
========================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

/* =========================
   FIELDS
========================= */
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

label {
  font-size: 12px;
  color: var(--muted);
}

input, select {
  background: transparent;
  border: 1px solid #2a2f3a;
  padding: 8px;
  border-radius: 8px;
  color: var(--text);
}

input:focus, select:focus {
  outline: none;
  border-color: var(--accent);
}

/* =========================
   CHARSET / OPTIONS
========================= */
.charset, .options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.charset label,
.options label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
}

/* =========================
   FORMAT
========================= */
.format {
  margin-top: 12px;
}

/* =========================
   BUTTONS
========================= */
.actions {
  margin-top: 14px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  border: none;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.15s ease;
  font-weight: 500;
}

.btn.primary {
  background: var(--accent);
  color: white;
}

.btn.secondary {
  background: #2a2f3a;
  color: var(--text);
}

.btn.danger {
  background: var(--danger);
  color: white;
}

.btn:active {
  transform: scale(0.96);
}

/* =========================
   PREVIEW
========================= */
pre {
  max-height: 240px;
  overflow: auto;
  background: #0b0d12;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
}

/* =========================
   STATUS
========================= */
.status {
  font-size: 14px;
}

#progressBar {
  height: 8px;
  background: #2a2f3a;
  border-radius: 6px;
  margin-top: 8px;
  overflow: hidden;
}

#progressFill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.2s ease;
}

/* =========================
   NOTIFY
========================= */
#notifyContainer {
  position: fixed;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 1000;
}

.notify {
  background: var(--panel);
  padding: 10px 14px;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* =========================
   MODAL
========================= */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.modal.hidden {
  display: none;
}

.modal-content {
  background: var(--panel);
  padding: 20px;
  border-radius: 12px;
  max-width: 400px;
  text-align: center;
}

/* =========================
   RESPONSIVE
========================= */
@media (max-width: 600px) {
  .header {
    flex-direction: column;
    gap: 10px;
  }

  .actions {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header class="header">
    <h1 data-i18n="title">API Key Generator</h1>

    <div class="header-controls">
      <select id="langSelect">
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>

      <select id="themeSelect">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="neon">Neon</option>
      </select>
    </div>
  </header>

  <!-- SETTINGS -->
  <section class="panel">

    <div class="grid">

      <!-- LENGTH -->
      <div class="field">
        <label data-i18n="length">Length</label>
        <input id="lengthInput" type="number" min="1" value="32">
      </div>

      <!-- BITS -->
      <div class="field">
        <label data-i18n="bits">Bits</label>
        <input id="bitsInput" type="number" min="64" max="2048">
      </div>

      <!-- PREFIX -->
      <div class="field">
        <label data-i18n="prefix">Prefix</label>
        <input id="prefixInput" type="text" placeholder="sk_">
      </div>

      <!-- TYPE -->
      <div class="field">
        <label data-i18n="type">Type</label>
        <select id="typeSelect">
          <option value="">—</option>
          <option value="api">api</option>
          <option value="sk">sk</option>
          <option value="pk">pk</option>
        </select>
      </div>

      <!-- ENV -->
      <div class="field">
        <label data-i18n="env">Environment</label>
        <select id="envSelect">
          <option value="">—</option>
          <option value="live">live</option>
          <option value="test">test</option>
        </select>
      </div>

      <!-- COUNT -->
      <div class="field">
        <label data-i18n="count">Count</label>
        <input id="countInput" type="number" min="1" value="1000">
      </div>

    </div>

    <!-- CHARSET -->
    <div class="charset">

      <label>
        <input type="checkbox" id="letters" checked>
        <span data-i18n="letters">Letters</span>
      </label>

      <label>
        <input type="checkbox" id="numbers" checked>
        <span data-i18n="numbers">Numbers</span>
      </label>

      <label>
        <input type="checkbox" id="symbols">
        <span data-i18n="symbols">Symbols</span>
      </label>

      <label>
        <input type="checkbox" id="excludeSimilar">
        <span data-i18n="excludeSimilar">Exclude similar</span>
      </label>

      <input id="customCharset" type="text" placeholder="Custom charset">

    </div>

    <!-- OPTIONS -->
    <div class="options">

      <label>
        <input type="checkbox" id="separator">
        <span data-i18n="separator">Use "-" separator</span>
      </label>

      <label>
        <input type="checkbox" id="cryptoMode" checked>
        <span data-i18n="crypto">Crypto secure</span>
      </label>

    </div>

    <!-- FORMAT -->
    <div class="format">
      <select id="formatSelect">
        <option value="txt">TXT</option>
        <option value="csv">CSV</option>
        <option value="json">JSON</option>
        <option value="zip">ZIP</option>
      </select>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button id="previewBtn" class="btn secondary" data-i18n="preview">Preview</button>
      <button id="generateBtn" class="btn primary" data-i18n="generate">Generate</button>
      <button id="stopBtn" class="btn danger" data-i18n="stop">Stop</button>
    </div>

  </section>

  <!-- PREVIEW -->
  <section class="panel">
    <h2 data-i18n="previewTitle">Preview</h2>
    <pre id="previewOutput"></pre>
  </section>

  <!-- STATUS -->
  <section class="panel status">
    <div id="statusText">Idle</div>
    <div id="progressBar">
      <div id="progressFill"></div>
    </div>
  </section>

</div>

<!-- NOTIFICATIONS -->
<div id="notifyContainer"></div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <p id="modalText"></p>
    <button id="modalConfirm" class="btn primary">OK</button>
  </div>
</div>

<script>
/* =========================
   1. STATE
========================= */
const state = {
  lang: 'ru',
  theme: 'dark',

  length: 32,
  bits: null,
  count: 1000,

  prefix: '',
  type: '',
  env: '',

  charset: {
    letters: true,
    numbers: true,
    symbols: false,
    excludeSimilar: false,
    custom: ''
  },

  separator: false,
  crypto: true,

  format: 'txt',

  isGenerating: false,
  stopRequested: false,

  warnedFast: false
};


/* =========================
   2. DOM
========================= */
const DOM = {
  app: document.getElementById('app'),

  langSelect: document.getElementById('langSelect'),
  themeSelect: document.getElementById('themeSelect'),

  lengthInput: document.getElementById('lengthInput'),
  bitsInput: document.getElementById('bitsInput'),
  countInput: document.getElementById('countInput'),

  prefixInput: document.getElementById('prefixInput'),
  typeSelect: document.getElementById('typeSelect'),
  envSelect: document.getElementById('envSelect'),

  letters: document.getElementById('letters'),
  numbers: document.getElementById('numbers'),
  symbols: document.getElementById('symbols'),
  excludeSimilar: document.getElementById('excludeSimilar'),
  customCharset: document.getElementById('customCharset'),

  separator: document.getElementById('separator'),
  cryptoMode: document.getElementById('cryptoMode'),

  formatSelect: document.getElementById('formatSelect'),

  previewBtn: document.getElementById('previewBtn'),
  generateBtn: document.getElementById('generateBtn'),
  stopBtn: document.getElementById('stopBtn'),

  previewOutput: document.getElementById('previewOutput'),

  statusText: document.getElementById('statusText'),
  progressFill: document.getElementById('progressFill'),

  notifyContainer: document.getElementById('notifyContainer'),

  modal: document.getElementById('modal'),
  modalText: document.getElementById('modalText'),
  modalConfirm: document.getElementById('modalConfirm')
};


/* =========================
   3. i18n
========================= */
const i18n = {
  ru: {
    title: "Генератор API ключей",
    length: "Длина",
    bits: "Биты",
    prefix: "Префикс",
    type: "Тип",
    env: "Окружение",
    count: "Количество",

    letters: "Буквы",
    numbers: "Цифры",
    symbols: "Символы",
    excludeSimilar: "Исключить похожие",

    separator: "Разделитель '-'",
    crypto: "Крипто режим",

    preview: "Превью",
    generate: "Генерировать",
    stop: "Стоп",

    previewTitle: "Предпросмотр",

    idle: "Ожидание",
    generating: "Генерация...",
    done: "Готово",
    stopped: "Остановлено",

    fastWarning: "ВАЖНО: Math.random небезопасен",
    largeWarning: "Большой объём. Продолжить?",

    saved: "Файл сохранён",
    stoppedNotify: "Процесс остановлен"
  },

  en: {
    title: "API Key Generator",
    length: "Length",
    bits: "Bits",
    prefix: "Prefix",
    type: "Type",
    env: "Environment",
    count: "Count",

    letters: "Letters",
    numbers: "Numbers",
    symbols: "Symbols",
    excludeSimilar: "Exclude similar",

    separator: "Use '-' separator",
    crypto: "Crypto secure",

    preview: "Preview",
    generate: "Generate",
    stop: "Stop",

    previewTitle: "Preview",

    idle: "Idle",
    generating: "Generating...",
    done: "Done",
    stopped: "Stopped",

    fastWarning: "IMPORTANT: Math.random is NOT secure",
    largeWarning: "Large volume. Continue?",

    saved: "File saved",
    stoppedNotify: "Process stopped"
  }
};


/* =========================
   i18n helper
========================= */
function t(key) {
  return i18n[state.lang][key] || key;
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = t(key);
  });

  DOM.statusText.textContent = t('idle');
}


/* =========================
   INIT BASIC UI STATE
========================= */
function applyTheme() {
  document.body.className = state.theme;
}

function syncInputsFromState() {
  DOM.langSelect.value = state.lang;
  DOM.themeSelect.value = state.theme;

  DOM.lengthInput.value = state.length;
  DOM.bitsInput.value = state.bits || '';
  DOM.countInput.value = state.count;

  DOM.prefixInput.value = state.prefix;
  DOM.typeSelect.value = state.type;
  DOM.envSelect.value = state.env;

  DOM.letters.checked = state.charset.letters;
  DOM.numbers.checked = state.charset.numbers;
  DOM.symbols.checked = state.charset.symbols;
  DOM.excludeSimilar.checked = state.charset.excludeSimilar;
  DOM.customCharset.value = state.charset.custom;

  DOM.separator.checked = state.separator;
  DOM.cryptoMode.checked = state.crypto;

  DOM.formatSelect.value = state.format;
}

/* =========================
   4. HELPERS
========================= */

/* Charset builder */
function buildCharset() {
  let chars = '';

  if (state.charset.letters) {
    chars += 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  }

  if (state.charset.numbers) {
    chars += '0123456789';
  }

  if (state.charset.symbols) {
    chars += '!@#$%^&*()_+[]{}<>?';
  }

  if (state.charset.custom) {
    chars += state.charset.custom;
  }

  if (state.charset.excludeSimilar) {
    chars = chars.replace(/[0Ool1I]/g, '');
  }

  // remove duplicates
  chars = [...new Set(chars.split(''))].join('');

  return chars;
}


/* Random index */
function getRandomIndex(max, cryptoMode) {
  if (cryptoMode && window.crypto && crypto.getRandomValues) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }
  return Math.floor(Math.random() * max);
}


/* Length resolver */
function resolveLength() {
  if (state.bits) {
    return Math.ceil(state.bits / 8);
  }
  return state.length;
}


/* Chunk separator */
function applySeparator(str) {
  if (!state.separator) return str;

  return str.match(/.{1,4}/g).join('-');
}


/* Prefix builder */
function buildPrefix() {
  let parts = [];

  if (state.type) parts.push(state.type);
  if (state.env) parts.push(state.env);

  let prefix = parts.join('_');

  if (state.prefix) {
    prefix = state.prefix + prefix;
  }

  return prefix ? prefix + '_' : '';
}


/* File formatter */
function formatOutput(keys) {
  switch (state.format) {
    case 'json':
      return JSON.stringify(keys, null, 2);

    case 'csv':
    case 'txt':
      return keys.join('\n');

    default:
      return keys.join('\n');
  }
}


/* File size estimate (MB) */
function estimateSize(count, length) {
  const bytes = count * (length + 1);
  return (bytes / 1024 / 1024).toFixed(2);
}


/* =========================
   5. GENERATOR (ЕДИНЫЙ)
========================= */

function generateKey(charset) {
  const len = resolveLength();
  let result = '';

  for (let i = 0; i < len; i++) {
    const idx = getRandomIndex(charset.length, state.crypto);
    result += charset[idx];
  }

  result = applySeparator(result);

  return buildPrefix() + result;
}


/* Batch generator (reuse core logic) */
function generateBatch(count, onProgress) {
  const charset = buildCharset();

  if (!charset.length) {
    throw new Error('EMPTY_CHARSET');
  }

  const keys = [];
  const chunkSize = 1000;

  for (let i = 0; i < count; i++) {

    if (state.stopRequested) break;

    keys.push(generateKey(charset));

    if (i % chunkSize === 0 && onProgress) {
      onProgress(i, count);
    }
  }

  return keys;
}

/* =========================
   6. WORKER (inline)
========================= */

function createWorker() {
  const workerCode = `
    self.onmessage = function(e) {
      const { state, count } = e.data;

      function getRandomIndex(max, cryptoMode) {
        if (cryptoMode && self.crypto && self.crypto.getRandomValues) {
          const arr = new Uint32Array(1);
          self.crypto.getRandomValues(arr);
          return arr[0] % max;
        }
        return Math.floor(Math.random() * max);
      }

      function buildCharset(s) {
        let chars = '';

        if (s.charset.letters) chars += 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (s.charset.numbers) chars += '0123456789';
        if (s.charset.symbols) chars += '!@#$%^&*()_+[]{}<>?';
        if (s.charset.custom) chars += s.charset.custom;

        if (s.charset.excludeSimilar) {
          chars = chars.replace(/[0Ool1I]/g, '');
        }

        return [...new Set(chars.split(''))].join('');
      }

      function resolveLength(s) {
        return s.bits ? Math.ceil(s.bits / 8) : s.length;
      }

      function applySeparator(str, use) {
        if (!use) return str;
        return str.match(/.{1,4}/g).join('-');
      }

      function buildPrefix(s) {
        let parts = [];
        if (s.type) parts.push(s.type);
        if (s.env) parts.push(s.env);

        let prefix = parts.join('_');
        if (s.prefix) prefix = s.prefix + prefix;

        return prefix ? prefix + '_' : '';
      }

      function generateKey(s, charset) {
        const len = resolveLength(s);
        let res = '';

        for (let i = 0; i < len; i++) {
          const idx = getRandomIndex(charset.length, s.crypto);
          res += charset[idx];
        }

        res = applySeparator(res, s.separator);
        return buildPrefix(s) + res;
      }

      const charset = buildCharset(state);
      const chunkSize = 2000;
      let result = [];

      for (let i = 0; i < count; i++) {
        if (i % chunkSize === 0) {
          self.postMessage({ progress: i, total: count });
        }

        result.push(generateKey(state, charset));
      }

      self.postMessage({ done: true, result });
    };
  `;

  const blob = new Blob([workerCode], { type: 'application/javascript' });
  return new Worker(URL.createObjectURL(blob));
}


/* =========================
   7. UI HELPERS
========================= */

function notify(text) {
  const el = document.createElement('div');
  el.className = 'notify';
  el.textContent = text;

  DOM.notifyContainer.appendChild(el);

  setTimeout(() => {
    el.remove();
  }, 3000);
}

function showModal(text, onConfirm) {
  DOM.modalText.textContent = text;
  DOM.modal.classList.remove('hidden');

  DOM.modalConfirm.onclick = () => {
    DOM.modal.classList.add('hidden');
    onConfirm && onConfirm();
  };
}

function updateProgress(current, total) {
  const percent = Math.floor((current / total) * 100);
  DOM.progressFill.style.width = percent + '%';
}

function setStatus(key) {
  DOM.statusText.textContent = t(key);
}


/* =========================
   DOWNLOAD
========================= */

function downloadFile(content, filename) {
  const blob = new Blob([content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}


/* =========================
   ZIP (JSZip CDN)
========================= */
function loadJSZip(callback) {
  if (window.JSZip) return callback();

  const script = document.createElement('script');
  script.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
  script.onload = callback;
  document.body.appendChild(script);
}


/* =========================
   GENERATE FLOW
========================= */

function handleGenerate() {
  if (state.isGenerating) return;

  const count = state.count;
  const length = resolveLength();

  const sizeMB = estimateSize(count, length);

  if (count > 250000) {
    return showModal(t('largeWarning') + ' ~' + sizeMB + 'MB', start);
  }

  start();

  function start() {
    state.isGenerating = true;
    state.stopRequested = false;

    setStatus('generating');

    if (!state.crypto && !state.warnedFast) {
      notify(t('fastWarning'));
      state.warnedFast = true;
    }

    const worker = createWorker();

    worker.postMessage({ state, count });

    worker.onmessage = function(e) {
      const data = e.data;

      if (data.progress !== undefined) {
        updateProgress(data.progress, count);
      }

      if (data.done) {
        finish(data.result);
        worker.terminate();
      }
    };

    DOM.stopBtn.onclick = () => {
      state.stopRequested = true;
      worker.terminate();
      setStatus('stopped');
      notify(t('stoppedNotify'));
      state.isGenerating = false;
    };
  }

  function finish(keys) {
    const filename = \`keys_\${keys.length}.\${state.format}\`;

    if (state.format === 'zip') {
      loadJSZip(() => {
        const zip = new JSZip();
        zip.file("keys.txt", keys.join('\\n'));

        zip.generateAsync({ type: "blob" }).then(content => {
          downloadFile(content, filename.replace('.zip', '.zip'));
        });
      });
    } else {
      const content = formatOutput(keys);
      downloadFile(content, filename);
    }

    setStatus('done');
    notify(t('saved'));

    state.isGenerating = false;
    updateProgress(100, 100);
  }
}


/* =========================
   PREVIEW
========================= */

function handlePreview() {
  try {
    const keys = generateBatch(80);
    DOM.previewOutput.textContent = keys.join('\n');
  } catch (e) {
    notify('Charset empty');
  }
}


/* =========================
   EVENTS (ЕДИНЫЙ СЛОЙ)
========================= */

function bindEvents() {

  DOM.langSelect.onchange = () => {
    state.lang = DOM.langSelect.value;
    applyTranslations();
    saveState();
  };

  DOM.themeSelect.onchange = () => {
    state.theme = DOM.themeSelect.value;
    applyTheme();
    saveState();
  };

  DOM.lengthInput.oninput = () => state.length = +DOM.lengthInput.value;
  DOM.bitsInput.oninput = () => state.bits = DOM.bitsInput.value ? +DOM.bitsInput.value : null;
  DOM.countInput.oninput = () => state.count = +DOM.countInput.value;

  DOM.prefixInput.oninput = () => state.prefix = DOM.prefixInput.value;
  DOM.typeSelect.onchange = () => state.type = DOM.typeSelect.value;
  DOM.envSelect.onchange = () => state.env = DOM.envSelect.value;

  DOM.letters.onchange = () => state.charset.letters = DOM.letters.checked;
  DOM.numbers.onchange = () => state.charset.numbers = DOM.numbers.checked;
  DOM.symbols.onchange = () => state.charset.symbols = DOM.symbols.checked;
  DOM.excludeSimilar.onchange = () => state.charset.excludeSimilar = DOM.excludeSimilar.checked;
  DOM.customCharset.oninput = () => state.charset.custom = DOM.customCharset.value;

  DOM.separator.onchange = () => state.separator = DOM.separator.checked;
  DOM.cryptoMode.onchange = () => state.crypto = DOM.cryptoMode.checked;

  DOM.formatSelect.onchange = () => state.format = DOM.formatSelect.value;

  DOM.previewBtn.onclick = handlePreview;
  DOM.generateBtn.onclick = handleGenerate;
}


/* =========================
   8. STORAGE
========================= */

function saveState() {
  localStorage.setItem('keygen_state', JSON.stringify(state));
}

function loadState() {
  const saved = localStorage.getItem('keygen_state');
  if (!saved) return;

  try {
    Object.assign(state, JSON.parse(saved));
  } catch {}
}


/* =========================
   INIT
========================= */

function init() {
  loadState();
  applyTheme();
  syncInputsFromState();
  applyTranslations();
  bindEvents();
}

init();
</script>
</body>
</html>
